></div><section id="map-panel" class="map-panel" hidden aria-label="역사 분기표"><div class="map-head"><h2>갈라진 역사</h2><div class="actions"><button class="small" id="spoilers" aria-pressed="false">미발견 사건 공개</button><button class="small" id="zoom-out" aria-label="분기표 축소">−</button><button class="small" id="zoom-in" aria-label="분기표 확대">＋</button><button class="small" id="map-current">현재 사건 찾기</button></div></div><p class="legend">금색 선: 이번 회차의 선택 · 회색 선: 다른 경로 · 점선 상자: 미발견 사건<br>가로·세로로 밀어 확인할 수 있습니다. 사건 공개 시 결말까지 표시됩니다.</p><div class="map-scroll" id="map-scroll" tabindex="0" aria-label="좌우로 스크롤하는 사건 분기표"></div><details><summary>이번 회차를 글로 보기</summary><ol id="path-list"></ol></details></section></main><footer>1873년 친정을 출발점으로 하는 대체 역사 · 조기 수교, 강화 사변, 조일전쟁, 부산 조약 및 이후 전개는 창작입니다. 수치와 결과는 역사적 가능성의 예측이 아닙니다.<span id="save-note"></span></footer><dialog id="confirm"><h2>다른 역사를 시작할까요?</h2><p>이번 회차의 진행은 초기화됩니다. 이전 회차에서 발견한 사건은 분기표에 남습니다.</p><div class="actions"><button class="primary" id="confirm-reset">새로 시작</button><button class="small" id="cancel-reset">돌아가기</button></div></dialog><script>
'use strict';
const NODES={"start":{"id":"start","year":1873,"title":"친정, 첫 번째 갈림길","story":"대원군이 물러난 뒤 직접 정치를 시작했다. 바다를 건너 새로운 관계를 맺을 것인가, 먼저 조선 안에서 힘을 기를 것인가?","choices":[{"title":"먼저 수교할 나라를 찾는다","desc":"외교 상대를 선택하는 사건으로 이어진다.","next":"diplomacy","delta":[-3,0,0,5,0,0],"flags":[],"when":null},{"title":"수교를 미루고 해안을 요새화한다","desc":"미수교 경로. 훗날 연안 방어 작전에 영향을 준다.","next":"unyo","delta":[-8,0,12,0,3,3],"flags":["fortified"],"when":null},{"title":"문을 닫고 왕실의 통제력을 강화한다","desc":"미수교 경로. 군사 준비보다 왕권에 투자한다.","next":"unyo","delta":[5,-5,0,-3,2,12],"flags":["closed"],"when":null}],"ending":null,"fact":"고종은 1873년 친정을 시작했다. 이 뒤의 조기 수교·전쟁 경로는 사용자가 제안한 가상 역사다."},"diplomacy":{"id":"diplomacy","year":1874,"title":"누구와 먼저 손을 잡을 것인가","story":"역관들이 서로 다른 외교 구상을 올렸다. 상대국마다 얻을 수 있는 기술과 교역, 감수해야 할 의존이 다르다.","choices":[{"title":"독일과 기술·통상 교섭을 시작한다","desc":"군사 기술과 관세 문제를 중심으로 별도의 협상이 열린다.","next":"german","delta":[-3,0,0,6,0,0],"flags":[],"when":null},{"title":"미국에 수교 사절을 보낸다","desc":"공개 통상과 외교적 보호의 한계를 마주한다.","next":"american","delta":[-3,0,0,4,2,0],"flags":[],"when":null},{"title":"러시아와 북방 협정을 협상한다","desc":"군사 지원과 항구 사용권의 교환이 의제로 오른다.","next":"russian","delta":[-3,0,4,0,-2,0],"flags":[],"when":null},{"title":"일본과 직접 국교를 협상한다","desc":"강화도 회담에서 조약 조건을 선택한다.","next":"ganghwa","delta":[0,0,0,3,0,0],"flags":[],"when":null}],"ending":null,"fact":null},"german":{"id":"german","year":1875,"title":"조독 통상 협상","story":"독일 측 교섭단이 기술자 파견과 통상을 제안한다. 그러나 설비를 운용할 사람과 수입품에 매길 관세는 조선이 결정해야 한다.","choices":[{"title":"기술자와 교사를 들이고 관세권을 지킨다","desc":"국내 기술 교육을 시작한다.","next":"workshop","delta":[-8,2,5,12,4,0],"flags":["german","technical"],"when":null},{"title":"군사 교관과 무기 구매에 집중한다","desc":"훈련된 군대로 연안 위기에 대응한다.","next":"coast","delta":[-10,-2,15,3,0,3],"flags":["german","trained"],"when":null},{"title":"불리한 조건을 거절하고 미국과 교섭한다","desc":"독일 협상을 중단하고 미국 경로로 이동한다.","next":"american","delta":[-3,0,0,2,3,0],"flags":[],"when":null}],"ending":null,"fact":null},"workshop":{"id":"workshop","year":1877,"title":"기계를 돌릴 사람들","story":"새 공장의 기계는 pressed"],"when":null},{"title":"공동 관리 기구와 사용 기한을 재협상한다","desc":"지원 관계를 제한하고 국경 협의로 나아간다.","next":"border","delta":[-4,5,2,5,3,-2],"flags":["joint_port"],"when":null}],"ending":null,"fact":null},"border":{"id":"border","year":1879,"title":"북방 국경의 협정","story":"교역이 늘자 러시아는 접경 지역의 질서 유지를 위한 협약을 제안한다. 한 나라의 후원과 여러 나라의 균형 사이에서 선택해야 한다.","choices":[{"title":"국경 방어 협정을 맺되 지휘권은 조선이 갖는다","desc":"독립적인 군 지휘권을 토대로 연안 위기에 대응한다.","next":"coast","delta":[-5,2,10,3,4,2],"flags":["trained"],"when":null},{"title":"독일·미국에도 사절을 보내 균형을 만든다","desc":"다자 협력 회담으로 이어진다.","next":"alliance","delta":[-6,3,0,7,7,0],"flags":["balanced"],"when":null},{"title":"러시아의 상주 군대를 받아들인다","desc":"외국군 주둔과 의존 문제를 다룬다.","next":"protectorate","delta":[8,-6,9,0,-14,5],"flags":["garrison"],"when":null}],"ending":null,"fact":null},"protectorate":{"id":"protectorate","year":1881,"title":"보호의 대가","story":"외국군은 질서를 유지하지만 군항과 재정 정책에 관여하기 시작했다. 조선 정부가 실제로 결정할 수 있는 일은 줄어든다.","choices":[{"title":"철수를 요구하고 국내 연대를 조직한다","desc":"의존 관계를 끝내기 위한 국민적 협약으로 향한다.","next":"congress","delta":[-12,12,-8,7,14,-5],"flags":["independence"],"when":null},{"title":"주둔을 인정하고 왕실의 지위를 보장받는다","desc":"후원국에 의존하는 결말.","next":"end_dependency","delta":[6,-5,0,0,-12,8],"flags":[],"when":null}],"ending":null,"fact":null},"ports":{"id":"ports","year":1877,"title":"열린 항구의 두 얼굴","story":"새 물자가 들어오지만 수입품에 밀린 장인과 세금을 요구받는 상인이 반발한다. 교역의 이익을 누구에게 돌릴 것인가?","choices":[{"title":"관세 수입을 학교와 피해 업종에 투자한다","desc":"상공업 성장 뒤 조세 대표권의 문제가 제기된다.","next":"customs","delta":[-5,9,0,12,2,-2],"flags":["school"],"when":null},{"title":"항구 운영을 외국 상사에 맡겨 세입을 확보한다","desc":"외국 상사의 재정 통제 요구가 뒤따른다.","next":"debt","delta":[14,-6,0,4,-8,0],"flags":["concession"],"when":null},{"title":"상인 대표를 국정 협의에 참여시킨다","desc":"대표 정치의 구체적인 형태를 논의한다.","next":"congress","delta":[3,10,0,8,2,-8],"flags":["merchant_voice"],"when":null}],"ending":null,"fact":null},"customs":{"id":"customs","year":1880,"title":"누가 세금을 결정하는가","story":"새 산업과 통상에서 세입이 늘었다. 세금을 내는 상인과 지방 주민들은 예산을 공개하고 자신들의 목소리를 반영하라고 요구한다."," function applyChoice(s,index){const node=NODES[s.node];if(s.pending||node.ending||!Number.isInteger(index)||!node.choices[index])return false;const choice=node.choices[index];const route=resolve(choice,s);if(!route||!NODES[route.to])throw Error('Invalid branch');const before=[...s.stats];s.stats=s.stats.map((v,i)=>Math.max(0,Math.min(100,v+choice.delta[i])));s.flags=[...new Set([...s.flags,...choice.flags])];const to=NODES[route.to];const nextYear=Math.max(to.year,s.year+1);s.history.push({node:s.node,year:s.year,choice:index,to:route.to,nextYear,delta:s.stats.map((v,i)=>v-before[i]),result:route.result||to.story});s.pending=true;return true}

body+=`<details><summary>이번 회차의 선택 기록 · ${state.history.length}개</summary>${state.history.length?state.history.map(h=>`<div class="history-entry"><strong>${h.year} · ${esc(NODES[h.node].title)}</strong><p>${esc(NODES[h.node].choices[h.choice].title)}</p><p>→ ${esc(NODES[h.to].title)}</p></div>`).join(''):'<p>첫 선택을 내리면 기록이 시작됩니다.</p>'}</details><details><summary>역사와 가상의 구분</summary><p>${esc(node.fact||'이 사건의 시기·선택·결과는 대체 역사 게임을 위한 창작입니다. 다른 경로에서 이 사건에 합류하면 발생 연도도 지나온 시간에 맞춰 조정됩니다.')}</p><p>실제 역사에서 운요호 사건은 1875년, 강화도 조약은 1876년에 일어났습니다. 게임의 조기 수교, 원산 항구 소요, 강화 사변, 조일전쟁, 부산 조약과 정치 체제 변화는 실제 사건의 재현이 아닙니다.</p><p><a href="https://contents.history.go.kr/front/hm/view.do?levelId=hm_115_0010" target="_blank" rel="noopener noreferrer">우리역사넷 — 실제 강화도 조약 읽기 ↗</a></p></details>`;
document.getElementById('notice').textContent=notice;
document.getElementById('app').innerHTML=`<div class="layout"><aside><p class="eyebrow">${over?'이 경로의 마지막 해':'갈라지는 연대기'}</p><span class="year">${state.year}</span><p class="era">${over?'당신이 남긴 나라':'조선 · 대체 역사의 한 장면'}</p><div class="stats">${LABELS.map((l,i)=>`<div><div class="stathead"><span>${l}</span><strong>${state.stats[i]}</strong></div><div class="track" role="meter" aria-label="${l}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.stats[i]}"><div class="fill ${state.stats[i]<25?'low':''}" style="width:${state.stats[i]}%"></div></div></div>`).join('')}</div><p class="side-note">현재 준비와 관계</p><div class="chips">${state.flags.filter(f=>FLAG_NAMES[f]).map(f=>`<span class="chip">${FLAG_NAMES[f]}</span>`).join('')||'<span class="hint">아직 결정된 정책이 없습니다.</span>'}</div><p class="side-note">수치는 정책의 누적 효과입니다. 전쟁·중립 판정에는 군사력과 준비 기록이 함께 쓰입니다. 결말은 수치의 합계가 아닌 선택한 경로로 결정됩니다.</p><p class="hint">발견한 사건 ${seen.size} / ${Object.keys(NODES).length}</p></aside><article>${body}</article></div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));const next=document.getElementById('next');if(next)next.onclick=goNext;const again=document.getElementById('again');if(again)again.onclick=()=>document.getElementById('confirm').showModal();const endMap=document.getElementById('ending-map');if(endMap)endMap.onclick=()=>toggleMap(true);if(showMap)renderMap();if(focus){document.querySelector('h1').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function targets(node){return [...new Set(node.choices.flatMap(c=>typeof c.next==='string'?[c.next]:c.next.map(r=>r.to)))]}
function graphLayout(){const indegree=Object.fromEntries(Object.keys(NODES).map(id=>[id,0]));for(const n of Object.values(NODES))for(const to of targets(n))indegree[to]++;const queue=Object.keys(indegree).filter(id=>indegree[id]===0),depth=Object.fromEntries(Object.keys(NODES).map(id=>[id,0]));let processed=0;while(queue.length){const id=queue.shift();processed++;for(const to of targets(NODES[id])){depth[to]=Math.max(depth[to],depth[id]+1);if(--indegree[to]===0)queue.push(to)}}if(processed!==Object.keys(NODES).length)throw Error('Cyclic graph');const cols=[];for(const id of Object.keys(NODES)){const d=depth[id];(cols[d]||=[]).push(id)}const maxRows=Math.max(...cols.map(c=>c.length)),positions={};cols.forEach((ids,d)=>ids.forEach((id,row)=>positions[id]={x:30+d*260,y:35+row*110+(maxRows-ids.length)*55}));return{positions,width:cols.length*260+40,height:maxRows*110+70}}
const graph=graphLayout();
function renderMap(){const path=new Set(state.history.map(h=>`${h.node}:${h.to}`));const visits=new Set(['start',...state.history.flatMap(h=>[h.node,h.to])]);const current=state.pending?state.history.at(-1).to:state.node;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${graph.width*zoom}" height="${graph.height*zoom}" viewBox="0 0 ${graph.width} ${graph.height}" role="img" aria-label="역사 선택 분기표" lang="ko"><title>역사 선택 분기표. 자세한 이동 기록은 아래 이번 회차를 글로 보기에서 확인할 수 있습니다.</title>`;
for(const node of Object.values(NODES)){const a=graph.positions[node.id];for(const to of targets(node)){const b=graph.positions[to],taken=path.has(`${node.id}:${to}`),mx=(a.x+220+b.x)/2;svg+=`<path class="edge ${taken?'taken':''}" d="M${a.x+220} ${a.y+35} C${mx} ${a.y+35} ${mx} ${b.y+35} ${b.x} ${b.y+35}"/>`}}
for(const node of Object.values(NODES)){const p=graph.positions[node.id],known=showAll||seen.has(node.id),title=known?node.title:'미발견 사건',words=title.length>16?[title.slice(0,16),title.slice(16)]:[title];svg+=`<g id="map-node-${node.id}" class="${visits.has(node.id)?'visited':''} ${node.id===current?'current':''} ${known?'':'unseen'}"><title>${esc(title)}</title><rect x="${p.x}" y="${p.y}" width="220" height="70" rx="5"/><text class="tiny" x="${p.x+12}" y="${p.y+18}">${node.id===current?'현재 경로':visits.has(node.id)?'이번 회차':known?'다른 경로':'???'}${known&&node.ending?' · 결말':''}</text>${words.map((w,i)=>`<text x="${p.x+12}" y="${p.y+40+i*18}">${esc(w)}</text>`).join('')}</g>`}svg+='</svg>';document.getElementById('map-scroll').innerHTML=svg;document.getElementById('path-list').innerHTML=state.history.map(h=>`<li>${h.year} · ${esc(NODES[h.node].title)} — ${esc(NODES[h.node].choices[h.choice].title)} → ${esc(NODES[h.to].title)}</li>`).join('')||'<li>1873 · 친정, 첫 번째 갈림길</li>';document.getElementById('spoilers').setAttribute('aria-pressed',String(showAll));document.getElementById('spoilers').textContent=showAll?'미발견 사건 숨기기':'미발견 사건 공개';document.getElementById('zoom-out').disabled=zoom<=.45;document.getElementById('zoom-in').disabled=zoom>=1.25}
function centerMap(){const current=state.pending?state.history.at(-1).to:state.node,p=graph.positions[current],box=document.getElementById('map-scroll');box.scrollTo({left:(p.x+110)*zoom-box.clientWidth/2,top:(p.y+35)*zoom-box.clientHeight/2,behavior:'instant'})}
function toggleMap(force){showMap=typeof force==='boolean'?force:!showMap;document.getElementById('map-panel').hidden=!showMap;document.getElementById('map-toggle').setAttribute('aria-expanded',String(showMap));if(showMap){renderMap();centerMap();document.getElementById('map-panel').scrollIntoView({block:'start',behavior:'instant'})}}
document.getElementById('restart').onclick=()=>document.getElementById('confirm').showModal();document.getElementById('cancel-reset').onclick=()=>document.getElementById('confirm').close();document.getElementById('confirm-reset').onclick=startOver;document.getElementById('map-toggle').onclick=()=>toggleMap();document.getElementById('spoilers').onclick=()=>{showAll=!showAll;renderMap()};document.getElementById('zoom-out').onclick=()=>{zoom=Math.max(.45,Math.round((zoom-.15)*100)/100);renderMap();centerMap()};document.getElementById('zoom-in').onclick=()=>{zoom=Math.min(1.25,Math.round((zoom+.15)*100)/100);renderMap();centerMap()};document.getElementById('map-current').onclick=centerMap;render();save();
</script></body></html>
