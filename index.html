'use strict';
const NODES={"start":{"id":"start","year":1873,"title":"친정, 첫 번째 갈림길","story":"대원군이 물러난 뒤 직접 정치를 시작했다. 바다를 건너 새로운 관계를 맺을 것인가, 먼저 조선 안에서 힘을 기를 것인가?","choices":[{"title":"먼저 수교할 나라를 찾는다","desc":"예조의 관리가 아룁니다. “바다 밖 사정을 알아야 저들의 요구도 가릴 수 있사옵니다.” 역관과 사절을 보내 조선이 먼저 교섭의 문을 두드리십시오. 다만 조정의 유생들은 선왕의 뜻을 저버린다며 상소를 올릴 것입니다.","next":"diplomacy","delta":[-3,0,0,5,0,0],"flags":[],"when":null,"result":"예조에 각국의 사정과 통상 조건을 조사하라는 전교가 내려갔다. 역관들이 불려 왔고, 조정은 어느 나라에 첫 국서를 보낼지를 두고 갈라졌다."},{"title":"수교를 미루고 해안을 요새화한다","desc":"병조는 낡은 포대와 비어 있는 군량 창고를 먼저 가리킵니다. 외교의 문을 잠시 닫고 강화의 진보와 수송로를 정비하십시오. 적이 오기 전에 대비할 수 있으나 공사와 징발의 부담은 연안 백성에게 돌아갑니다.","next":"unyo","delta":[-8,0,12,0,3,3],"flags":["fortified"],"when":null,"result":"강화의 진보를 수리하고 해안 지형을 조사하라는 명령이 전달됐다. 군량과 자재를 실은 배가 움직이는 동안, 외국 선박의 접근을 알리는 보고가 올라왔다."},{"title":"문을 닫고 왕실의 통제력을 강화한다","desc":"측근들은 새로 친정을 시작한 임금의 명령부터 바로 세워야 한다고 주장합니다. 궁중 인사와 군영을 장악하고 대외 교섭을 엄금하십시오. 조정은 조용해지겠지만 바다 밖의 변화는 궁궐의 명령을 기다리지 않습니다.","next":"unyo","delta":[5,-5,0,-3,2,12],"flags":["closed"],"when":null,"result":"요직에 측근이 배치되고 외국과의 사사로운 접촉을 금하는 교지가 반포됐다. 조정의 복종은 얻었지만 연안 군영의 낡은 장비는 그대로 남았다."}],"ending":null,"fact":"고종은 1873년 친정을 시작했다. 이 뒤의 조기 수교·전쟁 경로는 사용자가 제안한 가상 역사다."},"diplomacy":{"id":"diplomacy","year":1874,"title":"누구와 먼저 손을 잡을 것인가","story":"역관들이 서로 다른 외교 구상을 올렸다. 상대국마다 얻을 수 있는 기술과 교역, 감수해야 할 의존이 다르다.","choices":[{"title":"독일과 기술·통상 교섭을 시작한다","desc":"역관은 유럽에서 강대국으로 떠오른 독일의 기계와 군사 제도를 보고합니다. 청이나 일본의 독점을 견제할 기술 상대를 찾으십시오. 다만 먼 나라의 상인이 이익을 본다고 해서 군함까지 조선을 지켜 주리라 기대할 수는 없습니다.","next":"german","delta":[-3,0,0,6,0,0],"flags":[],"when":null,"result":"독일 측과 접촉할 역관에게 기술자 초빙과 통상 조건을 적은 훈령을 내렸다. 군사적 보호가 아닌 계약의 내용을 놓고 교섭이 시작됐다."},{"title":"미국에 수교 사절을 보낸다","desc":"일부 신하는 태평양 건너의 미국을 새로운 교역 상대가 될 나라로 봅니다. 사절에게 관세와 국법을 존중하는 관계를 타진하게 하십시오. 왕실은 우호를 원하지만 상대가 약속할 수 있는 것은 통상인지 보호인지부터 가려야 합니다.","next":"american","delta":[-3,0,0,4,2,0],"flags":[],"when":null,"result":"미국 측에 전달할 국서가 봉해졌다. 돌아온 첫 답신은 통상에 관심을 보였지만, 조선이 위기에 처했을 때 병력을 보내겠다는 약속은 담지 않았다."},{"title":"러시아와 북방 협정을 협상한다","desc":"북방의 관리들은 국경을 맞댄 러시아와 먼저 뜻을 맞춰야 한다고 말합니다. 육상 교역과 군사 지원을 얻을 수 있으나 러시아가 원하는 항구의 사용권은 결코 가벼운 대가가 아닙니다.","next":"russian","delta":[-3,0,4,0,-2,0],"flags":[],"when":null,"result":"북방 교섭을 맡은 관리에게 국서를 보냈다. 러시아 측은 교역과 교관 파견을 논의하자며 동해 항구에 관한 조건을 함께 제시했다."},{"title":"일본과 직접 국교를 협상한다","desc":"왜학 역관은 가까운 일본과의 관계를 더는 미룰 수 없다고 아룁니다. 직접 사절을 맞아 충돌의 구실을 줄이십시오. 그러나 회담장에서는 예법보다 개항과 관할권을 둘러싼 요구가 더 무겁게 다뤄질 것입니다.","next":"ganghwa","delta":[0,0,0,3,0,0],"flags":[],"when":null,"result":"접견 사절에게 회담의 전권과 한계를 적어 주었다. 일본 측은 친교의 말과 함께 항구 개방 및 자국민의 재판 문제를 의제로 올렸다."}],"ending":null,"fact":null},"german":{"id":"german","year":1875,"title":"조독 통상 협상","story":"독일 측 교섭단이 기술자 파견과 통상을 제안한다. 그러나 설비를 운용할 사람과 수입품에 매길 관세는 조선이 결정해야 한다.","choices":[{"title":"기술자와 교사를 들이고 관세권을 지킨다","desc":"호조와 예조는 기술을 배우되 세금까지 외국인의 손에 맡기지는 말자고 의견을 모읍니다. 교사·기술자를 기간을 정해 고용하고 세관은 조선이 관리하게 하십시오. 당장의 비용은 크지만 기계를 스스로 돌릴 인재를 남길 수 있습니다.","next":"workshop","delta":[-8,2,5,12,4,0],"flags":["german","technical"],"when":null,"result":"관세 징수는 조선 관리가 맡고 기술자는 계약 기간 동안 교육을 담당하도록 합의했다. 기계가 도착하자 이제 누구를 가르치고 어떤 공장을 세울지가 새 과제가 됐다."},{"title":"군사 교관과 무기 구매에 집중한다","desc":"병조는 학교의 성과를 기다리다가는 다음 함대를 막지 못한다고 재촉합니다. 교관과 무기를 먼저 들여 정예 부대를 만드십시오. 빠른 전력 보강은 가능하나 탄약·부품의 수입이 끊기면 새 군대도 멈출 수 있습니다.","next":"coast","delta":[-10,-2,15,3,0,3],"flags":["german","trained"],"when":null,"result":"외국 교관이 훈련을 맡고 새 포와 소총이 군영에 들어왔다. 병조는 개선된 사격 보고와 함께 탄약 구입비를 추가로 청했다."},{"title":"불리한 조건을 거절하고 미국과 교섭한다","desc":"사절의 요구가 조정에서 정한 한도를 넘었습니다. 왕명으로 교섭을 중단하고 다른 상대를 찾으십시오. 조건을 지키는 선례를 세울 수 있지만 이미 쓴 사행 비용과 시간은 돌려받을 수 없습니다.","next":"american","delta":[-3,0,0,2,3,0],"flags":[],"when":null,"result":"역관에게 협상을 중지시키고 미국과의 접촉을 준비하게 했다. 독일의 기술 도입은 미뤄졌고 새 상대에게 조선의 조건을 처음부터 설명해야 했다."}],"ending":null,"fact":null},"workshop":{"id":"workshop","year":1877,"title":"기계를 돌릴 사람들","story":"새 공장의 기계는 도착했지만 기술자가 모자란다. 투자가 결실을 맺으려면 운영 방식부터 정해야 한다.","choices":[{"title":"기술학교를 세우고 민간 상인을 참여시킨다","desc":"기술을 외국인 몇 사람에게만 맡기면 계약이 끝나는 날 공장도 멈춥니다. 신분보다 재주를 보고 학생을 뽑고 상인들의 출자를 허용하십시오. 새로운 인재와 부가 자라는 만큼 이들은 국정에서도 발언권을 요구할 것입니다.","next":"customs","delta":[-6,8,2,12,3,-4],"flags":["school"],"when":null,"result":"공장 곁에 강습소가 마련되고 역관과 장인, 상인의 자제가 함께 배웠다. 출자한 상인들은 수익뿐 아니라 관청의 지출과 세금에도 관심을 보이기 시작했다."},{"title":"공장을 군수 시설로 전환한다","desc":"군영은 민간 제품보다 탄약과 수리 부속이 급하다고 호소합니다. 공장의 생산을 병조의 주문에 집중하십시오. 전쟁 준비는 빨라지지만 장인과 상인의 기대는 국가의 군수 계획에 종속됩니다.","next":"coast","delta":[-6,-3,13,5,0,5],"flags":["trained"],"when":null,"result":"공장에 내려가는 주문서가 군수품 중심으로 바뀌었다. 포와 소총의 수리는 빨라졌지만 민간 주문이 밀리면서 상인들의 불만도 쌓였다."}],"ending":null,"fact":null},"american":{"id":"american","year":1875,"title":"조미 수교 협상","story":"통상은 가능하다는 답이 왔지만 군사적 보호를 보장하겠다는 약속은 없다. 조선이 원하는 관계를 구체적으로 제시해야 한다.","choices":[{"title":"군사 보장보다 관세와 교육 교류를 확보한다","desc":"군사 지원에 관한 모호한 말보다 문서에 남는 권리를 확보하라는 상소가 올라옵니다. 관세 징수와 교육 교류를 우선 협상하십시오. 외국군의 보호는 얻지 못해도 새 교역을 조선의 제도 안에서 다룰 여지는 생깁니다.","next":"ports","delta":[6,2,0,7,3,0],"flags":["american","open_trade"],"when":null,"result":"군사 보장 요구를 접고 통상과 교육 조항을 구체화했다. 항구로 새로운 물자가 들어오기 시작하자 조정에는 교역의 이익과 피해가 함께 보고됐다."},{"title":"군사적 보호를 조건으로 끝까지 재협상한다","desc":"대신들은 통상의 문을 열기 전에 침략을 막을 약속부터 받아야 한다고 주장합니다. 군사 보호를 끝까지 요구하십시오. 다만 상대가 거절하면 조약도 지원도 얻지 못한 채 다음 위기를 맞을 수 있습니다.","next":"unyo","delta":[-5,0,0,2,0,-2],"flags":["american_contact"],"when":null,"result":"사절은 보호 약속 없이는 서명할 수 없다는 훈령을 전했다. 교섭은 길어졌고, 조정이 답신을 기다리는 사이 강화 해역의 긴급 장계가 도착했다."},{"title":"여러 나라에 항구를 개방해 독점을 막는다","desc":"어느 한 나라가 항구를 독차지하면 가격과 운송까지 좌우할 수 있습니다. 여러 나라 상인에게 같은 문을 열어 경쟁을 유도하십시오. 세입은 늘 수 있으나 외국 물품과 겨뤄야 할 국내 장인들은 보호책을 요구할 것입니다.","next":"customs","delta":[10,-3,0,8,-3,0],"flags":["open_trade"],"when":null,"result":"여러 나라 상인에게 통상의 길이 열렸다. 세관의 장부는 두꺼워졌지만 값싼 수입품에 밀린 장인들이 지방 관아에 탄원서를 내기 시작했다."}],"ending":null,"fact":null},"russian":{"id":"russian","year":1875,"title":"조러 북방 협상","story":"러시아는 교관 파견을 제안하며 동해 항구의 사용을 요구한다. 지원을 받는 순간 국내 주민과 다른 나라들도 반응할 것이다.","choices":[{"title":"원산의 제한적 사용권과 군사 지원을 교환한다","desc":"러시아 측은 항구를 쓸 수 있다면 교관과 군수 지원을 제공하겠다고 말합니다. 사용 구역과 기간을 정해 군사적 여유를 얻으십시오. 그러나 조약의 작은 글씨를 모르는 주민들에게는 외국 병사의 초소 자체가 영토 양도로 보일 수 있습니다.","next":"wonsan","delta":[8,-7,12,2,-10,3],"flags":["russian","lease"],"when":null,"result":"항구의 일부 구역에 외국 경비가 배치되고 교관이 도착했다. 어민과 상인은 새 통행 규칙에 반발했고, 원산의 지방관은 소요의 조짐을 보고했다."},{"title":"항구 양도를 거절하고 육상 교역만 허용한다","desc":"함경도의 보고에 따르면 육상 교역만으로도 곡물과 물자의 교환을 늘릴 수 있습니다. 항구는 내주지 않고 국경 시장과 통행 규칙을 협상하십시오. 군사 지원의 규모는 줄겠지만 해안의 관할권은 온전히 남습니다.","next":"border","delta":[6,3,3,4,4,0],"flags":["russian","limited"],"when":null,"result":"항구 사용 요구는 거절하고 육상 교역의 범위만 정했다. 국경 왕래가 늘어나자 세금 징수와 순찰 구역을 둘러싼 새로운 협의가 필요해졌다."},{"title":"협상을 중단하고 독일에 접근한다","desc":"항구를 둘러싼 요구는 조정이 허락한 범위를 넘어섭니다. 당장의 군사 지원을 포기하고 독일의 기술을 들이는 길을 찾으십시오. 가까운 강국을 자극하는 부담과 먼 나라와 다시 협상할 비용을 감수해야 합니다.","next":"german","delta":[-3,0,0,2,2,0],"flags":[],"when":null,"result":"항구 양도에 응할 수 없다는 답신을 보냈다. 조정은 러시아의 반응을 살피며 독일 측에 기술·통상 교섭을 타진했다."}],"ending":null,"fact":null},"wonsan":{"id":"wonsan","year":1877,"title":"원산의 항구 소요","story":"항구 사용권 협정 이후 외국 경비와 주민이 충돌했다. 항구를 넘겼다는 소문이 퍼지고, 조정의 명령을 거부하는 상인들이 늘어난다.","choices":[{"title":"주민 대표와 협의하고 항구 사용권을 회수한다","desc":"지방관은 주민들이 외국 경비보다 조정의 침묵에 더 분노한다고 보고합니다. 대표를 만나 피해를 조사하고 항구 사용권의 회수를 명하십시오. 국내 신뢰를 되찾을 수 있으나 보상 요구와 지원 중단을 감당해야 합니다.","next":"customs","delta":[-10,12,-4,4,10,-3],"flags":["lease_revoked"],"when":null,"result":"주민 대표가 관아에 들어왔고 조정은 사용권을 회수하겠다고 통보했다. 외국 측의 배상 요구가 남았지만 주민들은 다시 조선 관리의 명령을 따르기 시작했다."},{"title":"러시아 경비와 함께 소요를 진압한다","desc":"군영에서는 항구가 마비되면 교역과 군수품 반입이 함께 끊긴다고 주장합니다. 외국 경비와 합동으로 질서를 회복하십시오. 길은 빨리 열릴 수 있으나 백성은 자신들을 누른 군대 뒤에서 누구의 명령이 움직였는지 기억할 것입니다.","next":"protectorate","delta":[0,-14,5,0,-12,7],"flags":["repressed"],"when":null,"result":"합동 경비가 거리를 장악하며 항구의 업무는 재개됐다. 그러나 체포자 가족의 탄원이 쌓였고 조정은 질서 유지를 위해 외국 병력에 더 의존하게 됐다."},{"title":"공동 관리 기구와 사용 기한을 재협상한다","desc":"상인들은 항구를 닫는 것도 군대를 더 들이는 것도 원하지 않습니다. 조선 관리가 참여하는 공동 관리와 명확한 만료일을 요구하십시오. 타협이 성립해도 외국 경비의 권한을 둘러싼 다툼까지 사라지지는 않습니다.","next":"border","delta":[-4,5,2,5,3,-2],"flags":["joint_port"],"when":null,"result":"조선 관리의 입회와 사용 기한을 명문화하는 재협상이 시작됐다. 통행 규칙이 완화되면서 소요는 잦아들었지만 북방 협력의 범위를 다시 정해야 했다."}],"ending":null,"fact":null},"border":{"id":"border","year":1879,"title":"북방 국경의 협정","story":"교역이 늘자 러시아는 접경 지역의 질서 유지를 위한 협약을 제안한다. 한 나라의 후원과 여러 나라의 균형 사이에서 선택해야 한다.","choices":[{"title":"국경 방어 협정을 맺되 지휘권은 조선이 갖는다","desc":"국경을 지키는 장수는 교관과 물자를 받을 수 있어도 명령권까지 넘겨서는 안 된다고 아룁니다. 지원 범위를 문서로 한정하고 작전 지휘는 조선 관원이 맡게 하십시오. 상대는 더 많은 권리를 요구하며 지원 속도를 늦출 수 있습니다.","next":"coast","delta":[-5,2,10,3,4,2],"flags":["trained"],"when":null,"result":"지원 물자의 인도와 교관의 임무를 구분하고 군령권은 조정에 남겼다. 훈련을 마친 부대가 배치되자 연안 방위에서도 전보다 넓은 선택이 가능해졌다."},{"title":"독일·미국에도 사절을 보내 균형을 만든다","desc":"한 나라의 호의에 기대면 그 나라의 뜻이 바뀌는 날 국정도 흔들립니다. 독일과 미국에도 사절을 보내 교역과 기술의 통로를 나누십시오. 균형을 만드는 외교에는 비용이 들며 서로 다른 약속을 관리할 관원이 필요합니다.","next":"alliance","delta":[-6,3,0,7,7,0],"flags":["balanced"],"when":null,"result":"여러 나라에 사절과 훈령이 나뉘어 보내졌다. 교섭 상대는 늘었지만 각국이 원하는 조건을 한자리에서 조정할 필요도 커졌다."},{"title":"러시아의 상주 군대를 받아들인다","desc":"북방의 장수들은 당장 쓸 수 있는 병력이 부족하다고 보고합니다. 러시아군의 주둔을 허용해 공백을 메우십시오. 국경은 안정될 수 있으나 그 군대를 언제, 어떤 조건으로 돌려보낼 수 있을지가 다음 문제입니다.","next":"protectorate","delta":[8,-6,9,0,-14,5],"flags":["garrison"],"when":null,"result":"외국군의 주둔지가 정해지고 국경 순찰이 강화됐다. 얼마 뒤 그 지휘관은 군항 운영과 군수 비용에 관한 협의를 조정에 요구했다."}],"ending":null,"fact":null},"protectorate":{"id":"protectorate","year":1881,"title":"보호의 대가","story":"외국군은 질서를 유지하지만 군항과 재정 정책에 관여하기 시작했다. 조선 정부가 실제로 결정할 수 있는 일은 줄어든다.","choices":[{"title":"철수를 요구하고 국내 연대를 조직한다","desc":"외국군이 떠나면 질서가 무너질 것이라는 주장이 궁궐에 가득합니다. 상인·지방관·군인 대표를 묶어 자체 치안과 재정을 마련한 뒤 철수를 요구하십시오. 국왕이 권한을 나눠야 얻을 수 있는 독립의 기반입니다.","next":"congress","delta":[-12,12,-8,7,14,-5],"flags":["independence"],"when":null,"result":"조정은 각계 대표에게 치안과 군비 분담을 논의하게 하고 철수 요구를 전달했다. 지원의 공백을 누가 메울지 결정하기 위해 보다 넓은 국정 협의가 소집됐다."},{"title":"주둔을 인정하고 왕실의 지위를 보장받는다","desc":"측근들은 적어도 왕실만은 보전해야 훗날을 도모할 수 있다고 말합니다. 주둔과 외교 감독을 인정하는 대신 왕위의 보장을 얻으십시오. 옥새는 남아도 그 옥새로 결정할 수 있는 일은 줄어들 것입니다.","next":"end_dependency","delta":[6,-5,0,0,-12,8],"flags":[],"when":null,"result":"왕실의 지위를 인정하는 문서가 도착했다. 그러나 대외 교섭과 군사 지출에는 후원국의 동의가 필요해졌고, 국왕의 재가는 이미 정해진 일을 확인하는 절차가 되어 갔다."}],"ending":null,"fact":null},"ports":{"id":"ports","year":1877,"title":"열린 항구의 두 얼굴","story":"새 물자가 들어오지만 수입품에 밀린 장인과 세금을 요구받는 상인이 반발한다. 교역의 이익을 누구에게 돌릴 것인가?","choices":[{"title":"관세 수입을 학교와 피해 업종에 투자한다","desc":"세관에는 은이 들어오지만 장인의 작업장에는 일감이 줄고 있습니다. 세입을 기술 교육과 업종 전환에 돌려 개항의 피해를 줄이십시오. 궁중과 군영에 돌아갈 몫을 줄여야 하므로 조정 안의 반발을 피하기 어렵습니다.","next":"customs","delta":[-5,9,0,12,2,-2],"flags":["school"],"when":null,"result":"기술 강습과 피해 업종 지원에 관세 수입이 배정됐다. 지원을 받은 상인과 장인들은 그 돈이 제대로 쓰이는지 확인할 창구도 요구했다."},{"title":"항구 운영을 외국 상사에 맡겨 세입을 확보한다","desc":"외국 상사는 항구를 맡기면 시설을 정비하고 정액의 수입을 보장하겠다고 제안합니다. 관리 부담을 덜고 급한 국고를 채우십시오. 대신 부두와 창고, 운송료에 관한 결정은 계약 상대의 손으로 넘어갑니다.","next":"debt","delta":[14,-6,0,4,-8,0],"flags":["concession"],"when":null,"result":"항구 운영 계약으로 국고에 자금이 들어왔다. 하지만 시설 투자금의 회수 조건이 붙으면서 장래의 세입과 관리권도 협상의 대상이 됐다."},{"title":"상인 대표를 국정 협의에 참여시킨다","desc":"상인들은 세금을 더 내더라도 자신들의 사정을 듣는 자리가 있어야 한다고 말합니다. 대표를 불러 통상과 지출을 함께 의논하십시오. 관직과 신분 밖의 사람이 국정에 참여하는 선례를 세우는 결정입니다.","next":"congress","delta":[3,10,0,8,2,-8],"flags":["merchant_voice"],"when":null,"result":"상인 대표가 관청의 회의에 참석했다. 처음에는 운송과 세금만 다루었으나 예산을 결정하는 권한이 누구에게 있는지까지 논의가 번졌다."}],"ending":null,"fact":null},"customs":{"id":"customs","year":1880,"title":"누가 세금을 결정하는가","story":"새 산업과 통상에서 세입이 늘었다. 세금을 내는 상인과 지방 주민들은 예산을 공개하고 자신들의 목소리를 반영하라고 요구한다.","choices":[{"title":"예산을 공개하고 지역 대표를 선출한다","desc":"호조의 장부를 공개하자는 요구가 지방까지 퍼졌습니다. 지역 대표를 뽑아 세입과 지출을 심의하게 하십시오. 새로운 협력을 얻는 대신 왕실의 씀씀이도 백성 앞에서 설명해야 합니다.","next":"congress","delta":[6,10,0,10,3,-10],"flags":["public_budget"],"when":null,"result":"각 지역에서 대표를 천거하거나 선출하는 절차가 마련됐다. 장부를 들여다본 대표들은 자문을 넘어 정책에 책임 있게 참여할 제도를 요구했다."},{"title":"세입을 군대에 집중하고 대표 요구는 미룬다","desc":"병조는 바다가 안전하지 않으면 시장의 번영도 하루아침에 사라진다고 경고합니다. 늘어난 세입을 포대와 상비군에 우선 배정하십시오. 국방의 성과가 나기 전까지 납세자의 불만을 견뎌야 합니다.","next":"coast","delta":[-4,-6,14,3,2,8],"flags":["mobilized"],"when":null,"result":"새 세입이 병기와 훈련비에 배정됐다. 군영의 보고는 개선됐지만 대표 선출을 요구하던 상인들은 납세의 대가로 무엇을 얻었는지 묻기 시작했다."},{"title":"외국 차관으로 공장과 철도를 동시에 확대한다","desc":"새 공장과 철길의 이익을 계산한 계획서가 올라왔습니다. 외국 자본을 들여 여러 사업을 한꺼번에 시작하십시오. 예상한 수익이 늦어져도 이자와 상환 기일은 기다려 주지 않습니다.","next":"debt","delta":[16,0,0,10,-7,0],"flags":["loan"],"when":null,"result":"차관 계약이 체결되고 여러 공사가 동시에 시작됐다. 호조는 장래의 수입을 담보로 자금을 얻었지만 곧 돌아올 상환 일정도 장부에 적어야 했다."}],"ending":null,"fact":null},"debt":{"id":"debt","year":1882,"title":"장부 위의 주권","story":"상환 기한이 다가왔다. 채권자는 세관 관리권을 담보로 요구한다. 공장을 지킬지, 재정의 결정권을 지킬지 선택해야 한다.","choices":[{"title":"사업을 줄이고 국내 자금으로 채무를 정리한다","desc":"호조는 사업 일부를 접고 국내 자금을 모으면 급한 채무를 줄일 수 있다고 보고합니다. 체면보다 장부의 건전성을 택하십시오. 공사 중단의 손실을 누가 부담할지 공정하게 설명하지 못하면 국내의 불만이 커집니다.","next":"congress","delta":[-14,4,-2,-3,12,-4],"flags":["debt_paid"],"when":null,"result":"수익이 늦어지는 사업을 정리하고 국내의 자금을 모았다. 큰 지출로 급한 채무를 줄였지만 출자자와 납세자들은 같은 일이 반복되지 않도록 재정 심의를 요구했다."},{"title":"세관 관리권을 넘겨 개발 사업을 유지한다","desc":"채권자는 세관을 직접 관리하게 해 주면 대출을 연장하겠다고 제안합니다. 공사와 지급을 계속할 수 있으나 국경에서 거두는 수입을 스스로 결정할 권리는 줄어듭니다. 잠시 맡긴 권한을 되찾는 일도 계약에 묶입니다.","next":"end_concession","delta":[8,-5,0,8,-16,2],"flags":[],"when":null,"result":"상환 유예와 세관 감독을 맞바꾸는 합의가 이루어졌다. 공사는 계속됐지만 조정이 예산을 짜기 전에 외국 관리가 세입의 몫을 먼저 정하게 됐다."},{"title":"채권국들을 한 회담에 불러 조건을 재협상한다","desc":"각 채권국은 서로의 특혜를 경계하고 있습니다. 이들을 한 회담에 불러 상환 일정과 관리권을 함께 협상하십시오. 경쟁을 이용할 여지는 있지만 여러 나라가 공동으로 감독하자는 요구를 낼 수도 있습니다.","next":"alliance","delta":[-6,0,0,4,3,0],"flags":["debt_talks"],"when":null,"result":"조정은 개별 협상을 멈추고 공동 회담을 제안했다. 채권국들의 다른 이해관계가 드러나자 채무 조정은 더 넓은 외교 관계의 문제로 옮겨 갔다."}],"ending":null,"fact":null},"unyo":{"id":"unyo","year":1875,"title":"운요호, 강화 앞바다","story":"일본 군함이 강화 해역에 접근한다. 외교적 접촉을 미뤄 온 조정은 무력시위에 대한 대응부터 결정해야 한다.","choices":[{"title":"대표를 보내 조약 조건을 협상한다","desc":"연안의 장계만으로 상대의 목적을 단정하기 어렵습니다. 사절을 보내 요구를 확인하고 회담의 범위를 정하십시오. 포성을 늦출 시간을 얻겠지만 협상장에는 함대의 위압도 함께 들어올 것입니다.","next":"ganghwa","delta":[-3,0,0,3,0,-2],"flags":[],"when":null,"result":"접견 사절이 강화로 떠났다. 충돌을 억제하라는 명령이 군영에 전달되는 동안 일본 측은 개항과 재판권에 관한 조건을 제시했다."},{"title":"상륙을 저지하고 해안 포대를 전개한다","desc":"수군의 장수는 가까이 다가온 배를 방치하면 다음에는 어디까지 내줄 것이냐고 묻습니다. 상륙을 저지하고 포대를 전개하십시오. 국토를 지키겠다는 뜻은 분명해지지만 한 차례의 교전이 더 큰 동원으로 이어질 수 있습니다.","next":"ganghwa_incident","delta":[-6,4,3,0,2,4],"flags":[],"when":null,"result":"해안 군영에 상륙 저지 명령이 내려졌다. 충돌 뒤 사태를 수습하려는 교섭이 이어졌으나 배상과 책임을 둘러싼 공방이 장기적인 무력 대치로 번졌다."},{"title":"제삼국의 중재를 요청하고 충돌을 피한다","desc":"역관들은 제삼국에 알리면 일본도 함부로 행동하기 어려울 것이라 주장합니다. 중재를 요청하며 현장의 발포를 억제하십시오. 그러나 회답이 올 때까지 항구와 백성을 지킬 책임은 여전히 조선에 있습니다.","next":"mediation","delta":[-4,-2,0,3,0,0],"flags":[],"when":null,"result":"중재를 청하는 문서가 여러 교섭 창구로 보내졌다. 확답은 늦었고 현장의 군영은 함대를 마주한 채 군량과 탄약을 소모했다."}],"ending":null,"fact":null},"mediation":{"id":"mediation","year":1876,"title":"답을 기다리는 조정","story":"중재를 요청했지만 어느 나라도 군사적 개입을 확약하지 않는다. 상대 함대는 물러나지 않았고, 기다릴수록 식량과 물자가 소모된다.","choices":[{"title":"중재를 기다리며 보급 체계를 먼저 정비한다","desc":"회답만 기다리는 사이에도 군영은 곡식을 먹습니다. 지방 창고와 조운선을 연결해 보급 체계를 점검하십시오. 협상이 성사되지 않더라도 버틸 힘은 남지만, 백성에게 추가 운송과 징발을 요구해야 합니다.","next":"ganghwa_incident","delta":[-8,2,7,3,0,0],"flags":["supplied"],"when":null,"result":"군량 창고와 운송 책임자가 지정됐다. 중재가 뚜렷한 성과를 내지 못한 가운데 조선은 준비된 보급망을 갖고 장기 대치에 들어갔다."},{"title":"일본과 직접 협상한다","desc":"중재국들은 우호적인 말만 되풀이하고 있습니다. 더 기다리지 말고 일본 사절과 직접 조건을 맞대십시오. 불리한 처지를 인정하는 듯 보이더라도 협상 내용을 스스로 확인할 수 있습니다.","next":"ganghwa","delta":[-2,0,0,2,-2,0],"flags":[],"when":null,"result":"중재의 회답을 기다리는 대신 직접 회담 일정을 잡았다. 조정은 사절에게 받아들일 수 있는 조건과 끝까지 다툴 권한을 구분해 보냈다."}],"ending":null,"fact":null},"ganghwa":{"id":"ganghwa","year":1876,"title":"강화도 회담","story":"일본은 개항과 자국민 재판권의 예외를 요구한다. 받아들이는 조항에 따라 조선의 다음 위기는 완전히 달라진다.","choices":[{"title":"불리한 조항을 받아들이고 개항한다","desc":"대신들은 지금 전쟁을 치르면 항구보다 더 많은 것을 잃을 수 있다고 아룁니다. 불리한 조항에 서명해 무력 충돌을 늦추고 시간을 사십시오. 그 시간의 값은 재판과 통상에서 조선의 권한을 제한하는 조문으로 남습니다.","next":"treaty_aftermath","delta":[8,-5,0,7,-12,0],"flags":["unequal"],"when":null,"result":"사절이 조약에 서명했다. 함대의 압박은 줄었지만 불리한 조항이 알려지자 조정에는 반대 상소가, 항구에는 피해 보고가 쌓였다."},{"title":"관세·재판권 문제를 놓고 협상을 계속한다","desc":"역관이 조문의 표현마다 다른 법적 뜻이 숨어 있다고 지적합니다. 관세와 재판의 권한을 구분해 수정안을 제시하십시오. 다른 나라와의 접촉이 있다면 지렛대가 되겠지만 회담이 결렬될 위험도 커집니다.","next":"revision","delta":[-5,2,0,5,3,-2],"flags":[],"when":null,"result":"사절에게 조문별 수정 훈령을 다시 내려보냈다. 회담은 길어졌고 일본 측은 조선의 요구를 뒷받침할 외교적 수단이 무엇인지 떠보기 시작했다."},{"title":"조약을 거부하고 군사적 대치에 들어간다","desc":"주권을 제한하는 조문에 옥새를 찍을 수 없다는 상소가 잇따릅니다. 서명을 거부하고 대치에 대비하십시오. 명분은 선명해지지만 그 명분을 지킬 군량과 포대가 실제로 준비되어 있는지 확인해야 합니다.","next":"ganghwa_incident","delta":[-4,4,3,0,4,3],"flags":[],"when":null,"result":"회담장에서 서명이 거부됐다. 외교 문서로 주고받던 요구는 해안의 병력 이동과 압박으로 바뀌었고 조정은 장기 대치에 들어갔다."}],"ending":null,"fact":null},"revision":{"id":"revision","year":1877,"title":"다시 쓰는 조약","story":"조선은 불리한 조항의 삭제를 요구했다. 다른 국가와의 접촉이 협상 카드가 될 수 있지만 상대가 반드시 양보하는 것은 아니다.","choices":[{"title":"여러 나라와의 교섭을 근거로 상호 통상안을 제시한다","desc":"역관은 다른 나라와의 교섭을 보여 주면 일본도 독점적인 조건만 고집하기 어렵다고 아룁니다. 실제로 이어 온 관계를 협상장에 내놓으십시오. 아직 문서와 사절의 왕래가 없다면 빈말로 간주될 수 있습니다.","next":[{"ifAny":["german","american","american_contact","russian"],"to":"revised_treaty","result":"기존 외교 접촉을 활용해 수정된 통상안에 합의했다."},{"to":"ultimatum","result":"활용할 외교 관계가 부족해 제안이 거절됐다. 최후통첩이 도착한다."}],"delta":[-4,0,0,4,2,0],"flags":[],"when":null,"ruleHint":"외교 접촉이 있으면 수정안, 없으면 압박이 이어진다.","result":"조선 사절은 기존의 외교 접촉과 상호 통상 원칙을 근거로 수정안을 내밀었다."},{"title":"개항 시기와 규모를 줄이는 절충안을 받는다","desc":"전면적인 조항 수정이 막히자 상대는 개항의 시기와 범위만 조정하자고 제안합니다. 권리의 문제를 남긴 채 시행을 늦춰 대비할 시간을 얻으십시오. 조정은 부분적인 양보를 성과로 설명해야 합니다.","next":"treaty_aftermath","delta":[4,-2,0,5,-7,0],"flags":["unequal"],"when":null,"result":"개항의 시행을 늦추고 규모를 줄이는 절충안에 합의했다. 하지만 핵심적인 권리 제한은 남아 국내의 반발과 통상 피해를 해소할 수는 없었다."},{"title":"협상을 중단하고 군사적 저항을 선택한다","desc":"더 다투어도 조문이 바뀌지 않는다는 보고가 왔습니다. 사절을 철수시키고 해안 군영에 대비를 명하십시오. 교섭으로 얻지 못한 것을 군사적으로 지킬 수 있는지 이제 장수와 백성에게 답해야 합니다.","next":"ganghwa_incident","delta":[-3,3,3,0,3,2],"flags":[],"when":null,"result":"사절이 귀환했고 해안 군영에 비상 명령이 내려졌다. 협상에서 해결하지 못한 분쟁은 장기적인 무력 충돌의 구실이 됐다."}],"ending":null,"fact":null},"revised_treaty":{"id":"revised_treaty","year":1878,"title":"수정된 통상 조약","story":"가상 역사에서 제한적인 상호 양보에 도달했다. 이제 항구를 열되 국내의 생산자와 세입을 어떻게 보호할지 결정해야 한다.","choices":[{"title":"교역 수입을 교육과 산업에 돌린다","desc":"고친 조약은 기회를 열었을 뿐 조선의 공장과 학교를 대신 세워 주지는 않습니다. 새 교역 수입을 기술과 인재에 투자하십시오. 성과가 나기 전에는 관청과 군영이 늘어난 세입을 양보해야 합니다.","next":"ports","delta":[8,3,0,8,3,0],"flags":["revised"],"when":null,"result":"통상 수입의 일부를 교육과 산업에 돌리는 계획이 승인됐다. 항구의 거래가 늘자 새로운 일자리와 기존 업종의 피해가 함께 드러났다."},{"title":"외교 관계를 넓혀 조약 이행을 지탱한다","desc":"사절은 유리한 문서도 상대가 무시하면 지킬 방법이 필요하다고 보고합니다. 교역 상대와 외교 창구를 넓혀 조약을 어길 때의 부담을 키우십시오. 다만 어느 나라도 조선의 권익만을 위해 움직이지는 않습니다.","next":"alliance","delta":[-3,2,0,5,6,0],"flags":["balanced"],"when":null,"result":"조약 이행을 여러 교섭 창구에 알리고 통상 관계를 넓혔다. 서로 다른 나라의 이해를 조정하기 위해 다자 협력의 범위를 논의하게 됐다."}],"ending":null,"fact":null},"treaty_aftermath":{"id":"treaty_aftermath","year":1878,"title":"조약 뒤의 갈등","story":"조약 반대 상소가 쌓이고 항구 주변에서 외국 상인과 주민이 충돌한다. 양보한 조약을 지킬 것인가, 국내의 반발을 정치적 힘으로 삼을 것인가?","choices":[{"title":"피해를 보상하고 관세·유통 제도를 정비한다","desc":"항구의 지방관은 조약을 당장 없애지 못하더라도 피해를 방치하지는 말아 달라고 청합니다. 보상과 유통 질서를 정비하고 허용된 범위의 관세 권한을 활용하십시오. 재정 부담을 감수해야 개항이 왕실만을 위한 일이 아니라는 믿음을 줄 수 있습니다.","next":"customs","delta":[-6,8,0,8,2,-3],"flags":[],"when":null,"result":"피해 조사와 보상 절차가 마련되고 유통과 징세의 허점이 점검됐다. 지원을 받은 이들은 재정이 어떻게 쓰이는지 논의할 통로도 요구했다."},{"title":"반대 세력과 함께 조약 파기를 선언한다","desc":"반대 상소를 올리던 세력은 조약을 파기하면 군량과 인력을 모으겠다고 장담합니다. 그 지지를 받아 서명을 거두십시오. 군중의 열기가 전쟁을 지속할 보급과 지휘를 대신할 수 있는지는 별개의 문제입니다.","next":"ganghwa_incident","delta":[-5,7,5,-2,6,0],"flags":["treaty_broken"],"when":null,"result":"조정은 조약의 효력을 인정하지 않겠다고 선언했다. 국내의 환호 뒤에 일본 측의 항의와 군사적 압박이 이어졌고 분쟁은 해안으로 번졌다."},{"title":"신식 군대에 투자해 조약 개정을 준비한다","desc":"지금 조약을 뒤집기보다 군대를 길러 다시 협상하자는 주장이 나옵니다. 신식 훈련과 무기에 예산을 배정하십시오. 새 군대에만 혜택이 돌아가면 기존 군인들은 개혁을 자신들의 생계를 빼앗는 일로 받아들일 것입니다.","next":"army_split","delta":[-6,-2,10,6,1,3],"flags":[],"when":null,"result":"신식 부대의 편성과 장비 구입이 승인됐다. 얼마 뒤 구식 군영에서 체불 급료와 차별 대우를 호소하는 탄원이 올라왔다."}],"ending":null,"fact":null},"army_split":{"id":"army_split","year":1881,"title":"두 군대, 하나의 나라","story":"신식 부대가 생기자 급료를 받지 못한 구식 군인들이 반발한다. 여기서 갈등을 해소하면 군란은 발생하지 않는다.","choices":[{"title":"체불 급료를 지급하고 합동 훈련을 실시한다","desc":"군인 대표는 신식 훈련에 반대하는 것이 아니라 굶으면서 버려지는 일이 두렵다고 말합니다. 밀린 급료를 먼저 지급하고 기존 군인을 합동 훈련에 참여시키십시오. 당장 많은 돈이 들지만 두 군대가 서로를 적으로 보지 않게 할 수 있습니다.","next":"coast","delta":[-10,10,8,5,0,-2],"flags":["army_united","trained"],"when":null,"result":"창고의 곡식과 급료가 구식 군영에 지급됐고 합동 훈련 명령이 내려졌다. 군인들이 복귀하면서 봉기의 고리가 끊어졌고 통합된 부대가 연안에 배치됐다."},{"title":"신식 군대만 지원하고 구식 군영을 해산한다","desc":"일부 장수는 낡은 군영을 유지하는 비용 때문에 개혁이 늦어진다고 주장합니다. 신식 부대에 자원을 모으고 구식 군영을 해산하십시오. 종이 위의 군제는 간결해져도 급료와 생계를 잃은 군인들은 도성에 남습니다.","next":"mutiny","delta":[3,-12,7,3,0,3],"flags":["army_split"],"when":null,"result":"구식 군영에 해산 명령이 전달됐다. 신식 부대는 장비를 더 받았지만 밀린 급료를 받지 못한 군인들이 모여 관청으로 향했다."}],"ending":null,"fact":null},"mutiny":{"id":"mutiny","year":1882,"title":"군영의 봉기","story":"해산된 군인들이 도성으로 향한다. 앞선 차별 정책이 봉기를 불렀다. 책임을 인정할 것인가, 외국군의 도움을 구할 것인가?","choices":[{"title":"책임자를 처벌하고 군인 대표와 협상한다","desc":"도성의 관리들은 군인들이 왕조를 뒤엎기보다 억울함을 풀어 줄 사람을 찾고 있다고 보고합니다. 부패한 책임자를 처벌하고 대표를 만나십시오. 왕실이 임명한 관리의 잘못을 인정해야 하는 정치적 부담이 따릅니다.","next":"congress","delta":[-9,10,-3,6,3,-8],"flags":["negotiated_mutiny"],"when":null,"result":"책임 관리가 파면되고 군인 대표에게 급료 정리 계획이 제시됐다. 거리의 긴장은 줄었지만 군제와 재정을 누가 감독할 것인지까지 논의해야 했다."},{"title":"외국군의 개입을 요청한다","desc":"궁궐의 안전을 걱정한 측근들은 외국군만이 즉시 질서를 회복할 수 있다고 말합니다. 원병을 요청하십시오. 빠른 진압의 대가로 조정의 안위가 타국의 판단에 달리는 선례를 남기게 됩니다.","next":"protectorate","delta":[-3,-5,5,0,-12,8],"flags":["foreign_intervention"],"when":null,"result":"원병을 청하는 문서가 보내졌고 외국군이 도성의 질서 회복에 관여했다. 사태가 가라앉은 뒤에도 철군과 비용, 주둔 권한에 관한 요구는 남았다."}],"ending":null,"fact":null},"coast":{"id":"coast","year":1883,"title":"무장한 해안, 새로운 압박","story":"군사적 대비가 쌓이자 외국 함대와의 대치에서 선택의 폭이 달라졌다. 그러나 준비된 군대가 곧 전쟁의 필요성을 뜻하지는 않는다.","choices":[{"title":"군사력을 배경으로 다자 회담을 제안한다","desc":"해안의 장수들은 이제 상대가 쉽게 상륙하기는 어렵다고 보고합니다. 이 힘을 전쟁의 명분이 아닌 회담의 배경으로 삼으십시오. 군함을 움직이는 대신 사절들을 움직여 긴장을 줄일 기회입니다.","next":"alliance","delta":[-4,3,0,5,5,0],"flags":[],"when":null,"result":"포대는 경계를 유지하되 도발적인 이동은 삼갔다. 조정은 여러 교섭 상대에게 회담을 제안하며 연안에서 해결하지 못할 조건들을 외교의 의제로 옮겼다."},{"title":"보급과 요새를 점검하고 침입 저지에 나선다","desc":"장비 목록이 늘었다고 전쟁 준비가 끝난 것은 아닙니다. 군량이 포대까지 닿는지, 요새의 빈틈은 없는지 직접 점검하게 하십시오. 비용과 시간이 들지만 실전에서 견딜 준비를 갖춘 뒤 침입 저지에 나설 수 있습니다.","next":"ganghwa_incident","delta":[-7,2,5,0,3,2],"flags":["fortified","supplied"],"when":null,"result":"병조와 지방관이 수송로와 요새를 함께 점검했다. 준비를 마친 부대가 전개되자 해안의 대치는 더욱 팽팽해졌고 조정에는 확전 여부가 물어졌다."}],"ending":null,"fact":null},"ganghwa_incident":{"id":"ganghwa_incident","year":1884,"title":"강화 사변","story":"가상 역사에서 강화의 무력 충돌이 확전 위기로 번졌다. 조정은 자국의 준비 상태를 확인하며 협상과 전쟁 사이에서 결정해야 한다.","choices":[{"title":"전면전을 각오하고 병력을 동원한다","desc":"현장의 교전을 수습할 조건에 양측이 합의하지 못했습니다. 병력을 모아 싸울 의지를 보이십시오. 왕명 한 장으로 군사는 움직일 수 있지만 그들을 먹이고 돌려보낼 계획은 지금부터 마련해야 합니다.","next":"war","delta":[-5,-2,6,0,3,4],"flags":["war"],"when":null,"result":"동원령이 내려지고 군영별 병력 보고가 모였다. 병조는 작전보다 먼저 군량과 수송, 지휘 체계에 대한 재가를 청했다."},{"title":"최후통첩을 받아 들고 협상을 다시 연다","desc":"사절이 상대의 요구를 적은 문서를 들고 돌아왔습니다. 굴복인지 협상인지 서둘러 단정하지 말고 조건을 다시 검토하십시오. 왕실의 위신과 전쟁의 피해 가운데 어느 부담을 감당할지 결정해야 합니다.","next":"ultimatum","delta":[-3,0,0,0,-2,0],"flags":[],"when":null,"result":"조정은 최후통첩의 조항을 하나씩 읽었다. 배상과 권리 양도 요구를 받아들일지, 문서를 돌려보내고 전쟁을 택할지 마지막 판단만 남았다."},{"title":"휴전선을 제안하고 피해부터 수습한다","desc":"지방관은 해안의 백성이 배를 띄우지 못하고 논밭을 떠나고 있다고 보고합니다. 서로의 주장을 남겨 둔 채 우선 충돌을 멈추자고 제안하십시오. 승전의 명예는 없지만 더 큰 전쟁을 피할 여지는 있습니다.","next":"armistice","delta":[-4,4,-2,0,0,-2],"flags":["ceasefire"],"when":null,"result":"현장의 병력을 물리고 충돌을 멈추는 안이 전달됐다. 상호 철수에 합의하면서 포성은 잦아들었지만 불신과 피해까지 해소되지는 않았다."}],"ending":null,"fact":null},"ultimatum":{"id":"ultimatum","year":1885,"title":"포성 앞의 최후통첩","story":"상대는 배상금과 추가 권리를 요구한다. 수용하면 전투는 멈출 수 있지만, 국가의 결정권이 줄어든다.","choices":[{"title":"배상 조건을 수용하고 전쟁을 피한다","desc":"호조는 배상금도 무겁지만 장기간의 전쟁은 그보다 큰 부담이 될 수 있다고 아룁니다. 요구를 받아들이고 병력을 물리십시오. 살아남은 백성을 보호하는 결정이라 해도 권리 양도와 왕실의 체면 손상은 피하기 어렵습니다.","next":"defeat","delta":[-8,-5,-2,0,-10,-4],"flags":["conceded"],"when":null,"result":"배상 조건의 수용이 통보되면서 당장의 전투 위험은 줄었다. 조정에는 전쟁 대신 배상 재원과 피해 수습을 둘러싼 어려운 장부가 남았다."},{"title":"요구를 거부하고 조일전쟁에 돌입한다","desc":"신하들은 한 번의 양보가 다음 요구를 부를 것이라 경고합니다. 최후통첩을 거부하고 전쟁 준비를 명하십시오. 조정의 결의를 뒷받침할 힘이 실제 군영과 창고에 있는지 확인해야 합니다.","next":"war","delta":[-4,3,5,0,2,3],"flags":["war"],"when":null,"result":"거부의 국서가 보내지고 군영에 동원령이 전달됐다. 병조는 전쟁의 지속을 위해 무엇부터 준비할지 국왕의 결정을 기다렸다."}],"ending":null,"fact":null},"war":{"id":"war","year":1885,"title":"조일전쟁 · 싸움을 지속할 힘","story":"해안 전투만 이겨서는 전쟁을 끝낼 수 없다. 조정은 군량, 수송, 훈련 가운데 어디에 집중할지 결정해야 한다.","choices":[{"title":"군량과 수송을 먼저 확보한다","desc":"장수가 아룁니다. “포를 쏠 군사도 굶으면 진지를 버리옵니다.” 창고를 연결하고 군량선과 운송 인력을 확보하십시오. 눈에 띄는 승전 보고는 늦어지겠지만 오래 버틸 수 있는 군대를 만들 수 있습니다.","next":"battle","delta":[-8,3,8,0,0,-2],"flags":["supplied"],"when":null,"result":"군량의 적재와 호송, 창고의 책임자가 정해졌다. 부대에 식량과 탄약이 도착하면서 지휘관은 준비된 보급을 전제로 작전을 검토할 수 있게 됐다."},{"title":"훈련과 포병 지휘를 통합한다","desc":"서로 다른 군영이 각자의 명령을 따르면 새 무기도 힘을 내기 어렵습니다. 포병과 보병의 지휘를 합치고 집중 훈련을 명하십시오. 훈련 기간 동안 적의 움직임을 지켜봐야 하며 군량 부족까지 해결되는 것은 아닙니다.","next":"battle","delta":[-8,0,10,3,0,2],"flags":["trained"],"when":null,"result":"지휘 계통이 정리되고 합동 훈련이 실시됐다. 사격과 이동은 나아졌지만 장수들은 보급 상태도 함께 고려해 작전을 선택해야 한다고 보고했다."},{"title":"준비를 줄이고 즉시 총공세를 명한다","desc":"성급한 승전을 바라는 이들은 적이 자리를 잡기 전에 밀어붙이자고 외칩니다. 준비 기간을 줄이고 즉시 공세를 명하십시오. 동원 비용은 아낄 수 있으나 흩어진 지휘와 빈 수송로는 전투가 시작된 뒤 고치기 어렵습니다.","next":"battle","delta":[3,-4,-5,0,0,5],"flags":["rushed"],"when":null,"result":"진격 명령이 훈련과 보급 계획보다 먼저 전달됐다. 부대는 움직였지만 지휘관에게 돌아온 보고에는 준비 미비와 병력의 피로가 섞여 있었다."}],"ending":null,"fact":null},"battle":{"id":"battle","year":1886,"title":"조일전쟁 · 결정적인 작전","story":"전쟁의 결과는 여기까지 갖춘 준비와 작전의 조합으로 정해진다. 기적적인 승리는 없다. 국정 현황과 준비 기록을 확인한 뒤 명령을 내려야 한다.","choices":[{"title":"요새를 지키며 상대의 전쟁 비용을 높인다","desc":"장수들은 바다의 적을 모두 격멸하려 하기보다 상륙을 막아 오래 머물 수 없게 하자고 건의합니다. 요새와 보급을 갖췄다면 상대의 수송 부담이 커집니다. 준비가 부족한 포대는 백성을 지키는 방패가 아니라 고립된 진지가 될 수 있습니다.","next":[{"ifAll":["fortified","supplied"],"min":{"2":55},"to":"victory","result":"요새와 보급이 맞물려 상륙을 막았다. 상대가 철수하며 유리한 강화 회담이 열린다."},{"ifAny":["fortified","supplied"],"min":{"2":40},"to":"pyrrhic","result":"방어에는 성공했지만 전쟁이 길어져 국토와 재정에 큰 상처가 남았다."},{"to":"defeat","result":"보급과 방어 체계가 버티지 못했다. 불리한 조건의 강화가 요구된다."}],"delta":[-5,-2,-3,0,0,0],"flags":[],"when":null,"ruleHint":"요새화·보급·군사 55 이상이면 큰 승리. 준비가 일부뿐이면 소모전.","result":"왕명은 성급한 추격을 금하고 요새와 수송로의 유지를 우선하도록 했다."},{"title":"훈련된 부대로 상륙군의 보급선을 차단한다","desc":"상륙군은 배로 들어오는 군량과 탄약에 의지합니다. 훈련된 부대를 움직여 그 연결을 끊으십시오. 지휘와 보급이 맞물리면 철수를 압박할 수 있으나 준비 없이 흩어진 병력은 오히려 각개격파될 위험이 있습니다.","next":[{"ifAll":["trained","supplied"],"min":{"2":60},"to":"victory","result":"통합된 지휘와 군수 준비로 상대의 수송로를 차단했다. 철수를 끌어냈다."},{"ifAll":["trained"],"min":{"2":45},"to":"pyrrhic","result":"보급로를 흔들었지만 조선군도 큰 손실을 입었다. 상처뿐인 승리가 남았다."},{"to":"defeat","result":"분산된 병력과 부족한 보급 탓에 차단 작전이 무너졌다."}],"delta":[-6,-3,-4,0,0,0],"flags":[],"when":null,"ruleHint":"훈련·보급·군사 60 이상이면 큰 승리. 일부 조건만 갖추면 소모전.","result":"훈련된 부대에 상대의 수송로를 겨냥한 명령이 내려갔다."},{"title":"회담을 제안하고 상호 철군을 교환한다","desc":"양측의 손실을 집계한 장계가 어전에 쌓입니다. 아직 싸울 여력이 있을 때 상호 철군을 제안하십시오. 전승의 영광을 포기한다는 비판을 받겠지만 살아 돌아올 군사와 백성의 수는 달라질 수 있습니다.","next":"armistice","delta":[-4,5,-2,0,0,-3],"flags":["ceasefire"],"when":null,"result":"군영에는 현 위치를 지키되 추가 공세를 멈추라는 명령이 전달됐다. 사절의 왕래 끝에 쌍방 철군이 합의되었고 승자 없는 휴전이 시작됐다."}],"ending":null,"fact":null},"victory":{"id":"victory","year":1887,"title":"압도적인 방어전의 승리","story":"가상 역사에서 충분한 준비가 상륙 저지와 적군 철수로 이어졌다. 승리의 범위는 국토 방어이며, 일본을 정복한 것은 아니다. 강화 조건을 정할 때다.","choices":[{"title":"부산에서 철군과 상호 주권 존중을 협상한다","desc":"장수들은 적이 물러나는 지금이 요구를 문서로 남길 때라고 아룁니다. 부산에서 철군과 상호 주권 존중을 협상하십시오. 전쟁을 끝낼 수 있는 승리와 상대국을 지배할 수 있는 힘은 같지 않음을 인정하는 결정입니다.","next":"busan","delta":[10,12,3,4,16,6],"flags":["victory"],"when":null,"result":"조정은 방어전의 성과를 강화 조건으로 바꾸었다. 철군과 주권 존중을 담은 가상의 부산 조약이 맺어졌고 승리 이후의 통치 방향이 새 의제로 떠올랐다."},{"title":"군대를 멈추지 않고 원정 계획을 요구한다","desc":"승전에 고무된 장수들은 바다 건너의 거점을 쥐어야 다시는 위협받지 않는다고 주장합니다. 원정 계획을 제출하게 하십시오. 육지에서 이긴 군대가 먼바다의 수송과 점령까지 감당할 수 있는지는 아직 증명되지 않았습니다.","next":"expansion","delta":[-8,-5,4,0,4,8],"flags":["victory","expansion"],"when":null,"result":"추격을 멈추는 대신 원정 가능성을 조사하라는 전교가 내려갔다. 병조는 새로운 거점의 이익과 함께 선박·보급·현지 통치에 필요한 비용을 보고하기 시작했다."}],"ending":null,"fact":null},"pyrrhic":{"id":"pyrrhic","year":1887,"title":"상처만 남은 승리","story":"적군은 물러났지만 마을과 군대가 큰 피해를 입었다. 유리한 강화 조건보다 전쟁을 다시 겪지 않을 방법이 시급하다.","choices":[{"title":"조선 평화 협약을 맺고 재건에 집중한다","desc":"승전 장계 뒤에 불탄 마을과 빈 창고의 보고가 따라옵니다. 재전을 막는 평화 협약을 우선 맺고 군대를 돌려보내십시오. 더 큰 배상을 받아야 한다는 주장보다 농사와 생계를 먼저 살피는 결정입니다.","next":"rebuild","delta":[-6,7,-8,2,6,-3],"flags":["peace"],"when":null,"result":"전쟁 재개를 막는 협약에 합의하고 동원 병력의 일부를 돌려보냈다. 조정의 관심은 적의 동향에서 무너진 마을과 복구 비용으로 옮겨 갔다."},{"title":"희생에 대한 책임을 물어 대표 의회를 연다","desc":"전사자의 가족과 납세자들은 누가 전쟁을 결정하고 군량을 관리했는지 묻습니다. 대표 회의를 열어 책임과 재정을 공개하십시오. 국왕과 측근의 판단도 조사 대상에서 예외가 될 수 없습니다.","next":"congress","delta":[-4,10,-5,8,3,-10],"flags":["accountability"],"when":null,"result":"각 지역과 군영의 대표가 전쟁 비용과 피해를 들고 모였다. 희생을 설명하는 회의는 앞으로 전쟁과 예산을 누가 결정할 것인지의 논의로 이어졌다."},{"title":"재건을 미루고 재무장한다","desc":"군부는 피해가 컸던 이유가 무장이 충분하지 않았기 때문이라고 주장합니다. 복구보다 재무장을 앞세우십시오. 다음 전투의 준비는 빨라지지만 이미 집과 가족을 잃은 백성에게 또 한 번의 인내를 요구하게 됩니다.","next":"strong_state","delta":[-10,-10,10,0,2,8],"flags":["hardline"],"when":null,"result":"재건 예산의 일부가 군영으로 옮겨졌다. 새 병기 계획은 승인됐지만 피해 지역에서는 나라가 무엇을 지키기 위해 싸우는지 묻는 목소리가 커졌다."}],"ending":null,"fact":null},"defeat":{"id":"defeat","year":1887,"title":"불리한 강화 조건","story":"전쟁 또는 외교적 굴복 뒤 배상과 권리 양도 요구가 남았다. 국왕의 체면과 백성의 생계, 다음 세대의 가능성 가운데 무엇을 먼저 지킬 것인가?","choices":[{"title":"배상과 피해 수습을 공개적으로 심의한다","desc":"패배의 책임을 숨긴 채 세금을 늘리면 조정의 명령은 더 이상 신뢰를 얻기 어렵습니다. 배상과 피해 장부를 공개하고 왕실도 부담을 나누십시오. 권위를 일부 내어놓더라도 다시 협력할 이유를 만들어야 합니다.","next":"rebuild","delta":[-8,10,-3,5,-5,-8],"flags":["defeated"],"when":null,"result":"배상 규모와 복구 비용이 공개됐고 왕실 지출도 심의 대상에 올랐다. 분노는 곧 사라지지 않았지만 나라를 다시 세울 부담을 나누는 논의가 시작됐다."},{"title":"왕실을 보장받는 대신 외국의 감독을 수용한다","desc":"상대는 왕실을 보전하는 대신 외교와 군사에 대한 감독을 요구합니다. 왕조의 존속을 먼저 확보하십시오. 백성을 다스리는 자리는 남아도 외부의 결정을 거부할 권한은 약해집니다.","next":"end_dependency","delta":[8,-8,0,0,-16,10],"flags":[],"when":null,"result":"왕실 보장과 외국의 감독을 맞바꾼 합의가 성립했다. 궁궐의 의례는 이어졌지만 중요한 국정 문서는 외국 측의 뜻을 확인한 뒤에야 처리됐다."},{"title":"학교와 언론에 남은 자원을 맡긴다","desc":"일부 신하는 지금 지키지 못한 것을 후대가 되찾으려면 사람과 글이 남아야 한다고 아룁니다. 학교와 언론, 지역의 협력에 남은 자원을 맡기십시오. 당장의 권세를 복구하기보다 다음 세대가 설 기반을 택하는 길입니다.","next":"end_legacy","delta":[-6,10,-3,12,-3,-6],"flags":[],"when":null,"result":"왕실과 군영에 남길 자금의 일부가 학교와 인쇄, 지역의 모임에 돌아갔다. 조정의 힘은 줄었지만 후대가 서로 배우고 뜻을 모을 통로가 남았다."}],"ending":null,"fact":null},"armistice":{"id":"armistice","year":1887,"title":"승자 없는 휴전","story":"쌍방의 철군으로 포성은 멈췄다. 전쟁을 피하거나 중단했으므로 부산의 승전 조약은 열리지 않는다. 대신 불안한 휴전을 어떻게 지탱할지 결정해야 한다.","choices":[{"title":"피해 마을과 농지를 먼저 복구한다","desc":"휴전 문서가 도착해도 떠난 농민이 저절로 돌아오지는 않습니다. 농지와 수로를 복구하고 종자와 식량을 지급하십시오. 군부가 요구하는 재무장 예산을 미뤄야 한다는 부담이 따릅니다.","next":"rebuild","delta":[-6,10,0,5,2,-2],"flags":[],"when":null,"result":"군영의 추가 요구를 보류하고 피해 지역에 복구 자원을 보냈다. 귀향하는 주민이 늘면서 지방의 세금과 자치에 관한 문제도 다시 논의되었다."},{"title":"다자 보장과 통상을 통해 휴전을 지탱한다","desc":"양측만의 약속은 정세가 바뀌면 흔들릴 수 있습니다. 여러 나라의 통상 이익을 평화 유지에 연결하십시오. 그들의 관심을 끌 수는 있어도 어느 나라의 보장도 무조건적인 보호는 아닙니다.","next":"alliance","delta":[-4,2,0,5,4,0],"flags":[],"when":null,"result":"휴전 조건을 교섭 상대들에게 알리고 통상 확대를 타진했다. 조정은 각국이 원하는 대가를 비교하며 협력의 한계를 정해야 했다."},{"title":"다음 전쟁을 대비해 상비군을 확대한다","desc":"장수들은 상대가 다시 돌아오기 전에 병력을 늘려야 한다고 주장합니다. 상비군과 군수 시설을 확대하십시오. 불안은 줄 수 있지만 휴전 뒤에도 동원과 징세가 계속되면 백성에게 평화의 이익은 돌아가지 않습니다.","next":"strong_state","delta":[-8,-4,12,2,0,6],"flags":[],"when":null,"result":"휴전 뒤에도 군비 지출이 줄지 않았다. 병력과 시설은 늘어났지만 징세를 견디기 어려운 지역에서 군사 우선 정책에 대한 반발이 나왔다."}],"ending":null,"fact":null},"busan":{"id":"busan","year":1888,"title":"부산 조약, 그다음의 나라","story":"가상의 부산 조약으로 철군과 상호 주권 존중에 합의했다. 승전의 정당성을 누구의 손에 맡길 것인가? 여기서부터 네 개의 국가 구상이 갈라진다.","choices":[{"title":"민주주의를 위해 대표 정치를 연다","desc":"전쟁에 곡식과 세금을 보탠 이들이 나라의 일을 함께 의논하자고 요구합니다. 지역 대표를 모아 권한과 예산을 나누십시오. 승리로 높아진 군주의 권위를 스스로 제한해야 더 넓은 정치적 기반을 만들 수 있습니다.","next":"congress","delta":[-3,12,0,10,2,-10],"flags":["democratic"],"when":null,"result":"승전의 공을 왕실에만 돌리지 않는다는 교지가 내려졌다. 각계 대표가 모이자 자문의 범위를 넘어 통치의 권한을 어떻게 나눌지가 논의되었다."},{"title":"새로운 동맹을 결성한다","desc":"사절들은 한 번의 승리로 바다의 세력 관계가 영원히 바뀌지는 않는다고 경고합니다. 승전국의 지위를 활용해 새로운 협력 관계를 만드십시오. 동맹의 보호뿐 아니라 동맹이 요구할 의무까지 따져야 합니다.","next":"alliance","delta":[-4,3,3,5,5,0],"flags":["allied"],"when":null,"result":"강화 조건을 알리는 사절이 각국으로 향했다. 이전보다 유리한 지위에서 교섭이 열렸지만 상대가 바라는 항구와 군사 협력의 조건도 함께 제시됐다."},{"title":"더 강한 국가를 위해 군사·산업을 통합한다","desc":"장수와 기술 관료들은 전쟁에서 드러난 약점을 중앙에서 한꺼번에 고쳐야 한다고 말합니다. 군사와 산업 계획을 통합하십시오. 효율은 높아질 수 있으나 지방과 민간이 중앙의 필요에 얼마나 희생될지 정해야 합니다.","next":"strong_state","delta":[-6,-2,10,7,2,8],"flags":["strong"],"when":null,"result":"군수와 산업의 계획이 중앙의 통일된 지휘 아래 묶였다. 생산과 군비는 확대됐지만 동원과 세금의 부담을 둘러싼 국내 논쟁도 커졌다."},{"title":"대한의 영광을 위한 팽창을 추구한다","desc":"승전의 열기 속에서 위협을 막으려면 조선 역시 세력권을 가져야 한다는 주장이 나옵니다. 해외 거점과 원정 계획을 검토하십시오. 스스로의 독립을 지킨 나라가 다른 지역의 자율성을 침해할 위험을 떠안는 결정입니다.","next":"expansion","delta":[-7,-5,8,0,-2,10],"flags":["expansion"],"when":null,"result":"조정은 승전 뒤의 국력을 해외 진출로 연결하는 계획을 받았다. 장수들이 거점의 가치를 말하는 동안 호조는 수송과 점령의 끝나지 않을 비용을 계산했다."}],"ending":null,"fact":null},"rebuild":{"id":"rebuild","year":1889,"title":"다시 세우는 마을","story":"전쟁과 협상의 부담은 농민과 상인에게 돌아갔다. 복구 비용을 누가 부담하고, 누가 정책을 감독할지 결정해야 한다.","choices":[{"title":"왕실 지출과 특권을 줄여 구휼 재원을 만든다","desc":"호조는 백성에게 더 거두기 전에 궁중의 지출과 면세 특권부터 줄여야 한다고 보고합니다. 왕실과 유력 가문이 복구의 몫을 먼저 부담하게 하십시오. 재원과 신뢰를 얻을 수 있지만 가까운 지지자들이 등을 돌릴 수 있습니다.","next":"congress","delta":[10,12,0,6,2,-10],"flags":["relief"],"when":null,"result":"궁중의 지출과 특권에서 마련한 재원이 구휼에 배정됐다. 부담의 공정성을 논의하던 대표들은 앞으로도 재정을 감시할 제도가 필요하다고 요구했다."},{"title":"외국 차관을 받아 기반 시설을 재건한다","desc":"도로와 수로를 빨리 고치려면 현재의 세입만으로는 부족합니다. 외국 자금을 빌려 복구를 앞당기십시오. 장래의 세금과 통상 수입을 담보로 삼는 순간 다음 위기는 장부에서 시작될 수 있습니다.","next":"debt","delta":[12,3,0,5,-6,0],"flags":["loan"],"when":null,"result":"차관으로 복구 공사를 시작하면서 물자와 사람의 이동이 되살아났다. 호조는 그 성과와 함께 이자와 상환 기일이 적힌 장부를 올렸다."},{"title":"지방 자치와 상업 회복을 우선한다","desc":"지방관은 도성의 일률적인 명령보다 현지 주민이 복구 순서를 정하게 해 달라고 청합니다. 지방에 권한을 나누고 상업을 회복시키십시오. 중앙의 위엄보다 각 고을이 스스로 일어설 힘을 택하는 길입니다.","next":"end_rebuild","delta":[5,10,0,8,3,-5],"flags":[],"when":null,"result":"고을마다 복구의 우선순위를 의논하게 하고 상업의 재개를 도왔다. 중앙이 모든 결정을 쥐려 하지 않자 지역의 자금과 노동이 조금씩 돌아오기 시작했다."}],"ending":null,"fact":null},"congress":{"id":"congress","year":1890,"title":"누가 나라의 주인이 되는가","story":"상인·군인·지방 대표가 모였다. 왕권의 제한과 대표 선출 방식을 논의한다. 이 합의는 단순한 자문 기구로 끝날 수도, 통치 체제를 바꿀 수도 있다.","choices":[{"title":"헌법으로 군주와 대표 의회의 권한을 나눈다","desc":"대표들은 군주를 몰아내기보다 누구도 법 위에 서지 못하게 하자고 제안합니다. 군주의 권한과 의회의 예산·입법 권한을 헌법에 적으십시오. 왕명이 관습과 위엄만으로 법을 넘어설 수 없게 되는 결정입니다.","next":"constitution","delta":[-3,10,0,12,3,-14],"flags":["constitution"],"when":null,"result":"군주와 대표 기구의 권한을 나눈 헌법이 공포됐다. 그러나 군비와 특권을 줄이는 첫 예산안 앞에서 군부와 구귀족의 반발이 터져 나왔다."},{"title":"왕정 폐지 여부를 제헌 회의에 맡긴다","desc":"일부 대표는 국정의 책임이 세습되어야 하는지부터 물어야 한다고 주장합니다. 왕정의 존폐를 제헌 회의의 의제로 허용하십시오. 이는 관청 하나를 바꾸는 일이 아니라 자신과 왕실의 통치 근거를 심판에 올리는 결정입니다.","next":"republic","delta":[-5,8,-3,12,2,-20],"flags":["republic"],"when":null,"result":"국왕은 제헌 회의가 왕정의 존폐까지 논의하도록 허용했다. 격론 끝에 공화정 수립이 결의되었지만 군대와 반대파가 새 질서를 받아들일지는 별도의 과제로 남았다."},{"title":"자문만 허용하고 최종 결정은 군주가 내린다","desc":"보수적인 대신들은 국정이 분열되지 않으려면 마지막 판단은 임금 한 사람에게 있어야 한다고 아룁니다. 대표들에게 건의할 자리는 주되 결정권은 넘기지 마십시오. 기대했던 참여가 자문에 그치면 개혁을 지지하던 이들도 실망할 것입니다.","next":"strong_state","delta":[3,-5,5,4,0,10],"flags":["royal_council"],"when":null,"result":"대표 기구는 자문에 한정되고 최종 결정은 군주에게 남았다. 국정은 중앙의 명령으로 움직였지만 참여를 바랐던 세력의 불신도 커졌다."}],"ending":null,"fact":null},"constitution":{"id":"constitution","year":1892,"title":"헌법의 첫 시험","story":"헌법이 공포됐지만 군부와 구귀족은 예산 삭감에 반발한다. 위기를 넘기는 방식이 헌법의 실제 의미를 결정한다.","choices":[{"title":"의회의 조사와 법에 따라 분쟁을 해결한다","desc":"장수들이 군비 삭감을 거부하며 예외를 요구합니다. 의회의 조사와 법이 정한 절차를 따르게 하십시오. 왕실이 중재를 명분으로 법을 넘어서면 갓 세운 헌법은 첫 위기에서 무너집니다.","next":"end_constitution","delta":[-5,8,-3,10,5,-4],"flags":[],"when":null,"result":"군부의 청원은 의회의 심의와 법정 절차로 넘겨졌다. 군주도 예외를 만들지 않자 예산과 지휘의 분쟁은 점차 제도 안에서 다뤄지기 시작했다."},{"title":"비상대권으로 의회를 정지한다","desc":"측근들은 지금의 혼란이 끝날 때까지만 의회를 멈추자고 건의합니다. 비상대권으로 결정을 다시 궁궐에 모으십시오. 오늘의 임시 조치가 내일도 필요하다는 주장을 막을 장치는 약해집니다.","next":"strong_state","delta":[3,-12,7,-7,0,12],"flags":["emergency"],"when":null,"result":"의회가 정지되고 비상 명령으로 예산이 집행됐다. 당장의 저항은 눌렸지만 헌법의 보장보다 군주의 판단과 군대의 협력이 국정을 좌우하게 됐다."}],"ending":null,"fact":null},"republic":{"id":"republic","year":1892,"title":"왕관 이후의 권력","story":"제헌 회의가 공화정 수립을 결의했다. 권력을 내려놓는 일이 곧 안정적인 공화국의 탄생은 아니다. 군대의 충성과 반대파의 권리를 어떻게 다룰 것인가?","choices":[{"title":"반대파의 참여를 보장하고 군대를 민간 통제에 둔다","desc":"왕정에 충성한 군인과 반대파를 모두 배제하면 새 나라는 시작부터 적을 안게 됩니다. 참여의 길을 열고 군대의 명령권을 민간 정부에 두십시오. 불편한 반론을 견뎌야 권력 이양이 새 지배자의 교체에 그치지 않습니다.","next":"end_republic","delta":[-6,10,-3,12,3,-10],"flags":[],"when":null,"result":"새 제도에 반대한 이들에게도 합법적인 참여가 허용됐다. 군대는 민간의 예산과 명령에 따르도록 재편되었고 권력 이양은 점진적으로 제도에 뿌리를 내렸다."},{"title":"과도 군사정부에 질서 유지를 맡긴다","desc":"혼란을 우려한 군 지휘관들은 질서가 잡힐 때까지 정치를 맡겠다고 합니다. 과도 군사정부에 전권을 주십시오. 무장한 통치자가 언제 권력을 돌려줄지 강제할 수단은 부족합니다.","next":"end_military","delta":[4,-8,10,-6,0,6],"flags":[],"when":null,"result":"군 지휘관들이 과도 정부의 핵심 직책을 맡았다. 질서 유지를 이유로 정치 활동이 제한됐고 민간으로 권력을 넘기는 시점은 계속 미뤄졌다."}],"ending":null,"fact":null},"alliance":{"id":"alliance","year":1890,"title":"동맹인가, 새로운 의존인가","story":"서로 다른 이해관계를 가진 나라들이 회담에 응했다. 조선은 한 나라의 우산 아래 들어갈 수도, 제한적인 협력망을 만들 수도 있다.","choices":[{"title":"항구·지휘권을 지키는 제한적 방어 협력을 맺는다","desc":"사절들은 지원을 받더라도 항구와 군령권을 넘기는 조항만은 막아야 한다고 보고합니다. 협력의 대상을 방어에 한정하십시오. 문서가 성립해도 동맹국이 더 큰 희생을 요구할 때 다시 거절할 용기가 필요합니다.","next":"alliance_test","delta":[-4,3,8,4,5,0],"flags":["limited_alliance"],"when":null,"result":"항구의 관할과 군령권을 남겨 둔 제한적 방어 협정이 체결됐다. 몇 해 뒤 동맹국은 조선의 방어와 관계없는 분쟁에 지원을 요청했다."},{"title":"어느 진영에도 가담하지 않고 무장 중립을 추진한다","desc":"어느 진영의 전쟁에도 끌려가지 않으려면 중립이 필요하다는 주장이 나옵니다. 대외 선언과 자체 방위를 함께 준비하십시오. 중립은 약속만으로 완성되지 않으며 항구를 원하는 함대 앞에서 시험받을 것입니다.","next":"neutrality","delta":[-6,3,5,4,5,0],"flags":["neutral"],"when":null,"result":"조정은 군사적 중립을 알리고 방위 체계를 정비했다. 그러나 외국 함대가 항구의 군사 이용을 요구하면서 선언을 행동으로 지킬 순간이 찾아왔다."},{"title":"강국의 상주 군대와 전면적 보호를 받아들인다","desc":"한 강국의 확실한 보호를 받는 편이 복잡한 균형 외교보다 안전하다는 의견이 우세합니다. 상주 군대와 전면적인 보호를 허용하십시오. 외부의 위협은 줄어들 수 있지만 독자적인 외교와 군사 정책의 공간도 함께 줄어듭니다.","next":"end_dependency","delta":[8,-5,8,0,-18,6],"flags":[],"when":null,"result":"주둔과 보호의 조건이 받아들여졌다. 왕실은 안정을 얻었지만 다른 나라와의 교섭이나 군사 정책을 결정할 때 후원국의 뜻을 먼저 확인해야 했다."}],"ending":null,"fact":null},"alliance_test":{"id":"alliance_test","year":1893,"title":"동맹국의 전쟁 요청","story":"동맹국이 조선의 방어와 관계없는 전쟁에 지원을 요구한다. 동맹을 맺은 선택이 새로운 의무로 돌아왔다.","choices":[{"title":"방어 협정의 범위를 근거로 참전을 거절한다","desc":"동맹국은 우의를 말하지만 사절이 가져온 요청은 협정의 방어 범위를 넘어섭니다. 문서의 한계를 근거로 참전을 거절하십시오. 보복과 냉대를 감수하더라도 조선의 군사를 어디에 보낼지 스스로 결정하는 선례를 남깁니다.","next":"end_alliance","delta":[-4,7,-2,4,8,-2],"flags":[],"when":null,"result":"조정은 협정의 조문을 들어 원정 참여를 거절했다. 외교적 불편은 남았지만 동맹이 조선의 군사를 마음대로 움직일 수 없다는 경계가 세워졌다."},{"title":"원정군을 보내 동맹의 신뢰를 얻는다","desc":"외교를 맡은 대신은 이번에 돕지 않으면 조선이 위기에 처할 때도 외면당할 수 있다고 말합니다. 원정군을 보내 관계를 유지하십시오. 먼 전장의 성패와 무관하게 비용과 전사자의 책임은 조정에 돌아옵니다.","next":"end_entangled","delta":[-12,-10,-10,2,-5,4],"flags":[],"when":null,"result":"원정군이 파견되고 군량과 자금이 해외로 흘러갔다. 동맹국의 감사와 함께 도착한 것은 병력 손실과 추가 지원을 요청하는 문서였다."}],"ending":null,"fact":null},"neutrality":{"id":"neutrality","year":1894,"title":"중립을 시험하는 함대","story":"외국 함대가 항구의 군사적 사용을 요구한다. 종이에 쓴 중립 선언을 무엇으로 뒷받침할 것인가?","choices":[{"title":"무력시위를 억제하며 입항을 거절한다","desc":"항구를 한 번 군사 기지로 내주면 다른 나라가 조선의 중립을 믿지 않을 것입니다. 경계를 유지하며 입항을 거부하십시오. 준비된 방위력과 외교적 자율성이 없다면 거부의 말만으로 함대를 돌려세우기 어렵습니다.","next":[{"min":{"2":55,"4":55},"to":"end_neutral","result":"준비된 방위력과 외교적 자율성으로 항구의 군사적 사용을 거부했다."},{"to":"end_concession","result":"거부 의사를 지탱할 역량이 부족했다. 항구 사용권을 양보하며 중립이 훼손됐다."}],"delta":[-5,4,-2,0,2,0],"flags":[],"when":null,"ruleHint":"군사 55·자주 55 이상이면 중립 유지, 부족하면 압박에 굴복한다.","result":"조정은 군사적 사용을 허용할 수 없다는 답신을 보내고 해안 경계 태세를 유지했다."},{"title":"군사 사용 대신 민간 통상 확대를 중재한다","desc":"통상을 맡은 관리들은 군함의 거점 대신 상선의 교역 이익을 제안하자고 말합니다. 상대가 무력시위보다 거래에서 얻을 몫을 보게 하십시오. 타협으로 긴장을 낮출 수 있으나 통상에서 추가 양보를 요구받을 수 있습니다.","next":"end_trade","delta":[8,3,0,5,-3,0],"flags":[],"when":null,"result":"군사적 사용 대신 민간 통상의 확대가 제안됐다. 일정한 경제적 양보로 갈등을 낮췄고 조정은 원정과 진영 대립보다 교역의 기반을 넓히는 방향으로 나아갔다."}],"ending":null,"fact":null},"strong_state":{"id":"strong_state","year":1892,"title":"강한 국가의 가격","story":"공장과 군대를 한 지휘 아래 묶었다. 성과가 쌓이는 만큼 징세와 동원에 대한 주민의 불만도 커졌다. 국가의 힘을 누구에게 책임지게 할 것인가?","choices":[{"title":"군비에 상한을 두고 민생·교육에 투자한다","desc":"호조는 군비가 계속 늘면 군대를 먹이는 백성부터 지칠 것이라 경고합니다. 지출에 상한을 두고 교육과 민생에 몫을 돌리십시오. 장수들의 반발을 누르고 국가의 힘이 지킬 대상을 다시 정하는 결정입니다.","next":"end_strength","delta":[-4,10,0,10,4,-5],"flags":[],"when":null,"result":"군비의 증가에 한도가 설정되고 학교와 민생에 예산이 배정됐다. 군대의 요구가 늘 우선하지 않게 되면서 자강의 목적도 방어와 사회의 유지로 좁혀졌다."},{"title":"반대 운동을 진압하고 군사 우선 정책을 고수한다","desc":"강경한 신하들은 전쟁의 위험 앞에서 반대 운동은 사치라고 주장합니다. 집회와 비판을 억누르고 군사 우선 정책을 유지하십시오. 군영은 강해지겠지만 충성의 말이 많아지는 만큼 실제 불만은 드러나기 어려워집니다.","next":"end_military","delta":[-5,-14,10,-3,0,10],"flags":[],"when":null,"result":"반대 운동이 진압되고 군영의 요구가 예산을 이끌었다. 공개적인 비판은 줄었으나 국가의 힘을 통제할 민간의 통로도 좁아졌다."},{"title":"군비를 원정으로 돌려 해외 진출을 추진한다","desc":"늘어난 병력과 군수 시설을 해외 진출에 쓰자는 계획이 올라옵니다. 군비의 성과를 원정으로 증명하게 하십시오. 국경 안의 방위를 위해 만든 체제가 타국의 땅을 다스리는 비용까지 견딜지는 알 수 없습니다.","next":"expansion","delta":[-6,-5,5,0,-2,6],"flags":["expansion"],"when":null,"result":"해외 거점과 원정에 관한 조사가 명령되었다. 군부는 진출의 이익을 내세웠지만 보급과 현지 통치에 관한 비용은 기존 군비 계획을 넘어섰다."}],"ending":null,"fact":null},"expansion":{"id":"expansion","year":1893,"title":"대한의 영광을 위해","story":"승전 또는 군비 확장을 발판으로 해외 거점과 세력권을 요구하는 목소리가 커졌다. 원정은 다른 지역 사람들의 저항과 열강의 반발을 불러온다.","choices":[{"title":"무력 확장 대신 통상과 기술 교류에 집중한다","desc":"상인과 일부 대신들은 군대로 얻은 거점보다 거래를 통해 얻은 시장이 오래갈 수 있다고 말합니다. 원정의 열기를 누르고 기술과 통상을 넓히십시오. 눈에 보이는 영토의 성과를 요구하던 이들은 국왕이 기회를 놓쳤다고 비판할 것입니다.","next":"end_trade","delta":[8,8,-3,10,4,-6],"flags":[],"when":null,"result":"원정 계획이 중지되고 사절과 상인의 활동에 지원이 돌아갔다. 조정은 거점을 무력으로 다스리는 부담 대신 거래와 기술 교류의 이해관계를 선택했다."},{"title":"해외 거점을 확보하기 위한 원정을 강행한다","desc":"군부는 해외 거점을 선점하지 않으면 다시 강국에 둘러싸일 것이라고 주장합니다. 원정과 거점 확보를 명하십시오. 그곳에 사는 사람에게 조선군이 구원자가 아니라 침입자로 보일 가능성까지 책임져야 합니다.","next":"occupation","delta":[-14,-8,-6,0,-4,10],"flags":["expedition"],"when":null,"result":"원정군이 파견되어 거점을 확보했다. 승전의 보고가 올라온 뒤에는 수송비 증가와 현지 주민의 저항, 추가 병력을 청하는 장계가 이어졌다."}],"ending":null,"fact":null},"occupation":{"id":"occupation","year":1895,"title":"점령지에서 돌아온 보고","story":"보급비는 예상보다 크고 현지 주민은 군정에 저항한다. 제국의 영광이라는 구호가 누구의 희생 위에 서 있는지 드러난다.","choices":[{"title":"철군과 배상을 협상하고 내정으로 돌아온다","desc":"현지의 보고는 더 많은 병력을 보내도 저항의 이유가 사라지지 않을 것이라 말합니다. 철군과 배상을 협상하고 소모를 멈추십시오. 국왕이 앞선 판단의 잘못을 인정해야 하지만 손실이 더 커지는 것은 막을 수 있습니다.","next":"end_rebuild","delta":[-8,7,-5,5,3,-10],"flags":[],"when":null,"result":"철군 일정과 배상이 협상되었다. 군대가 돌아오자 조정은 원정의 책임과 남은 재원을 살피며 국내의 회복에 힘을 돌렸다."},{"title":"병력과 세금을 더 동원해 점령을 유지한다","desc":"강경파는 여기서 물러나면 이미 치른 희생이 헛된 일이 된다고 주장합니다. 추가 동원과 징세로 점령을 계속하십시오. 과거의 손실을 정당화하려는 결정이 새로운 손실을 끝없이 요구할 수 있습니다.","next":"end_overreach","delta":[-12,-14,-8,-4,-8,8],"flags":[],"when":null,"result":"추가 병력과 세금이 동원되었다. 점령지의 저항과 국내의 불만이 동시에 커지면서 원정은 국력을 과시하는 수단이 아니라 소모하는 부담이 되었다."}],"ending":null,"fact":null},"end_dependency":{"id":"end_dependency","year":1898,"title":"보호 아래 남은 왕좌","story":"왕실의 자리는 남았지만 외교와 재정의 결정권을 후원국에 내주었다. 수교 상대와 군사 의존을 둘러싼 선택이 종속을 만들었다.","choices":[],"ending":true,"fact":null},"end_concession":{"id":"end_concession","year":1898,"title":"성장의 그늘, 잃어버린 권리","story":"공장과 교역은 유지됐으나 항구나 세관의 통제권이 외국에 넘어갔다. 경제 규모와 국가의 자율성이 같은 것은 아니었다.","choices":[],"ending":true,"fact":null},"end_legacy":{"id":"end_legacy","year":1898,"title":"다음 세대의 불씨","story":"당대의 국권을 온전히 지키지 못했지만 학교·언론·사회적 연대를 남겼다. 다음 세대는 그 기반 위에서 새로운 길을 찾게 된다.","choices":[],"ending":true,"fact":null},"end_rebuild":{"id":"end_rebuild","year":1898,"title":"전쟁 뒤에 다시 세운 나라","story":"팽창과 위신보다 마을의 복구와 지방의 자치를 택했다. 조선의 새로운 과제는 전쟁을 이기는 일이 아니라 평화를 유지하는 일이 됐다.","choices":[],"ending":true,"fact":null},"end_constitution":{"id":"end_constitution","year":1898,"title":"헌법 아래의 왕관","story":"군주와 의회가 법으로 권한을 나누고 군대에 대한 통제를 세웠다. 가상 역사 속 조선은 입헌국가의 길로 나아갔다.","choices":[],"ending":true,"fact":null},"end_republic":{"id":"end_republic","year":1898,"title":"왕관 없는 새 나라","story":"권력을 대표자들에게 이양하고 군대를 민간의 통제 아래 두었다. 공화국의 앞날은 한 사람의 교지가 아닌 시민과 제도의 선택에 달려 있다.","choices":[],"ending":true,"fact":null},"end_military":{"id":"end_military","year":1898,"title":"군대가 지배하는 국가","story":"군사력과 질서는 강화됐지만 정치적 참여가 좁아졌다. 전쟁에서 얻거나 개혁으로 키운 국가의 힘은 군부의 권력이 됐다.","choices":[],"ending":true,"fact":null},"end_alliance":{"id":"end_alliance","year":1898,"title":"자율성을 지킨 동맹","story":"협력의 범위를 분명히 하고 타국의 원정 요구를 거절했다. 외교 관계를 넓히면서도 정책의 최종 결정권을 지켜냈다.","choices":[],"ending":true,"fact":null},"end_entangled":{"id":"end_entangled","year":1898,"title":"동맹의 전쟁에 묶이다","story":"동맹의 신뢰를 위해 파병했지만 병력과 재정의 손실은 조선이 떠안았다. 협력의 이름으로 들어간 전쟁이 국가의 선택을 제약했다.","choices":[],"ending":true,"fact":null},"end_neutral":{"id":"end_neutral","year":1898,"title":"무장 중립의 길","story":"방위력과 자주성을 쌓아 항구의 군사 이용을 막았다. 가상 역사에서 조선은 중립을 유지했지만 그 질서를 지킬 부담도 떠안았다.","choices":[],"ending":true,"fact":null},"end_trade":{"id":"end_trade","year":1898,"title":"대포보다 교역을 택한 나라","story":"세력권 확대보다 통상·교육·기술 교류를 택했다. 주변국과의 갈등은 남았지만 번영을 추구하는 방식은 달라졌다.","choices":[],"ending":true,"fact":null},"end_strength":{"id":"end_strength","year":1898,"title":"자강으로 향한 힘","story":"군사 우선의 유혹을 억제하고 민생과 교육에 자원을 나누었다. 방위력은 국가의 목적이 아닌 사회를 지탱하는 수단으로 남았다.","choices":[],"ending":true,"fact":null},"end_overreach":{"id":"end_overreach","year":1898,"title":"제국의 꿈, 소진된 나라","story":"점령을 유지하려는 추가 동원이 국내외의 저항을 키웠다. 더 넓은 세력권을 원했던 정책이 정작 나라의 기반을 소모했다.","choices":[],"ending":true,"fact":null}};

let state=initial(),seen=new Set(['start']),showMap=false,showAll=false,zoom=.8,storageOK=true,notice='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matches(rule,s){return(!rule.ifAll||rule.ifAll.every(f=>s.flags.includes(f)))&&(!rule.ifAny||rule.ifAny.some(f=>s.flags.includes(f)))&&(!rule.min||Object.entries(rule.min).every(([i,v])=>s.stats[i]>=v))}
function resolve(choice,s){return typeof choice.next==='string'?{to:choice.next,result:null}:choice.next.find(r=>matches(r,s))}
function applyChoice(s,index){const node=NODES[s.node];if(s.pending||node.ending||!Number.isInteger(index)||!node.choices[index])return false;const choice=node.choices[index];const route=resolve(choice,s);if(!route||!NODES[route.to])throw Error('Invalid branch');const before=[...s.stats];s.stats=s.stats.map((v,i)=>Math.max(0,Math.min(100,v+choice.delta[i])));s.flags=[...new Set([...s.flags,...choice.flags])];const to=NODES[route.to];const nextYear=Math.max(to.year,s.year+1);s.history.push({node:s.node,year:s.year,choice:index,to:route.to,nextYear,delta:s.stats.map((v,i)=>v-before[i]),result:route.result?`${choice.result} ${route.result}`:(choice.result||to.story)});s.pending=true;return true}
function advance(s){if(!s.pending)return false;const last=s.history.at(-1);s.node=last.to;s.year=last.nextYear;s.pending=false;return true}
function restore(raw){if(!raw||raw.version!==2||!Array.isArray(raw.decisions)||raw.decisions.length>80||typeof raw.pending!=='boolean'||!Array.isArray(raw.seen)||raw.seen.some(id=>typeof id!=='string'||!NODES[id]))throw Error('Invalid save');const restored=initial();for(let i=0;i<raw.decisions.length;i++){const d=raw.decisions[i];if(!d||d.node!==restored.node||!Number.isInteger(d.choice)||!applyChoice(restored,d.choice))throw Error('Invalid history');if(i<raw.decisions.length-1||!raw.pending)advance(restored)}if(raw.pending&&!raw.decisions.length)throw Error('Invalid pending');return restored}
function snapshot(){return{version:2,decisions:state.history.map(h=>({node:h.node,choice:h.choice})),pending:state.pending,seen:[...seen]}}
try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const data=JSON.parse(raw);state=restore(data);seen=new Set(['start',...data.seen,...state.history.flatMap(h=>[h.node,h.to]),state.node])}else if(localStorage.getItem(OLD_KEY)){notice='새 분기형 이야기입니다. 기존 버전의 저장은 보존되며, 이번 버전은 1873년부터 새로 시작합니다.'}}catch(e){notice='저장된 진행을 읽지 못해 새 회차로 시작합니다.'}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));storageOK=true}catch{storageOK=false}document.getElementById('save-note').textContent=storageOK?' · 이 기기에 자동 저장됨':' · 저장할 수 없습니다. 창을 닫으면 이번 진행이 사라질 수 있습니다.'}
function choose(index){if(!applyChoice(state,index))return;const h=state.history.at(-1);seen.add(h.node);seen.add(h.to);save();render(true)}
function goNext(){if(!advance(state))return;seen.add(state.node);save();render(true)}
function startOver(){state=initial();notice='';document.getElementById('confirm').close();save();render(true)}
function render(focus=false){const node=NODES[state.node];const last=state.history.at(-1);const over=node.ending&&!state.pending;const visited=state.history.map(h=>h.node);if(!state.pending)visited.push(state.node);let body=`<div class="chapter">${over?'도달한 결말':'당신의 역사'}<span></span>${over?'회차 종료':`${state.history.length+(state.pending?0:1)}번째 사건`}</div><h1 tabindex="-1">${esc(node.title)}</h1><p class="story">${esc(node.story)}</p>`;
if(state.pending){body+=`<section class="result" aria-label="선택 결과"><p class="eyebrow">내린 결정</p><h2>${esc(node.choices[last.choice].title)}</h2><p>${esc(last.result)}</p><div class="deltas">${last.delta.map((v,i)=>v?`<span class="delta ${v>0?'positive':'negative'}">${LABELS[i]} ${v>0?'+':''}${v}</span>`:'').join('')}</div><div class="transition"><p class="eyebrow">이어지는 ${NODES[last.to].ending?'결말':'사건'} · ${last.nextYear}</p><strong>${esc(NODES[last.to].title)}</strong><br><button class="primary" id="next">${NODES[last.to].ending?'결말 확인':'이 사건으로 진행'} →</button></div></section>`}
else if(over){body+=`<p class="context">${state.history.length}번의 결정으로 이 결말에 도달했습니다. 수교 상대·국내 정책·전쟁 준비에 따라 다른 사건과 결말을 만날 수 있습니다.</p><div class="actions"><button class="primary" id="again">다른 역사 시작하기</button><button class="small" id="ending-map">내 분기표 보기</button></div>`}
else{body+=`<p class="context">${state.node==='battle'?'작전 조건은 선택 직전의 수치와 준비 기록으로 판정합니다. 조건과 결과는 공개되며 무작위로 결정되지 않습니다.':'어전에 올라온 방책입니다. 어느 명분을 세우고, 누구의 부담을 감수하게 할지 결정하십시오.'}</p><div class="choices">${node.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span><strong>${esc(c.title)}</strong><small class="proposal">${esc(c.desc)}</small>${c.ruleHint?`<small class="rule-hint">판정 조건 · ${esc(c.ruleHint)}</small>`:''}</span></button>`).join('')}</div><p class="hint">선택 즉시 적용 · 현재 기기·브라우저에 자동 저장</p>`}
body+=`<details><summary>이번 회차의 선택 기록 · ${state.history.length}개</summary>${state.history.length?state.history.map(h=>`<div class="history-entry"><strong>${h.year} · ${esc(NODES[h.node].title)}</strong><p>${esc(NODES[h.node].choices[h.choice].title)}</p><p>→ ${esc(NODES[h.to].title)}</p></div>`).join(''):'<p>첫 선택을 내리면 기록이 시작됩니다.</p>'}</details><details><summary>역사와 가상의 구분</summary><p>${esc(node.fact||'이 사건의 시기·선택·결과는 대체 역사 게임을 위한 창작입니다. 다른 경로에서 이 사건에 합류하면 발생 연도도 지나온 시간에 맞춰 조정됩니다.')}</p><p>실제 역사에서 운요호 사건은 1875년, 강화도 조약은 1876년에 일어났습니다. 게임의 조기 수교, 원산 항구 소요, 강화 사변, 조일전쟁, 부산 조약과 정치 체제 변화는 실제 사건의 재현이 아닙니다.</p><p><a href="https://contents.history.go.kr/front/hm/view.do?levelId=hm_115_0010" target="_blank" rel="noopener noreferrer">우리역사넷 — 실제 강화도 조약 읽기 ↗</a></p></details>`;
document.getElementById('notice').textContent=notice;
document.getElementById('app').innerHTML=`<div class="layout"><aside><p class="eyebrow">${over?'이 경로의 마지막 해':'갈라지는 연대기'}</p><span class="year">${state.year}</span><p class="era">${over?'당신이 남긴 나라':'조선 · 대체 역사의 한 장면'}</p><div class="stats">${LABELS.map((l,i)=>`<div><div class="stathead"><span>${l}</span><strong>${state.stats[i]}</strong></div><div class="track" role="meter" aria-label="${l}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.stats[i]}"><div class="fill ${state.stats[i]<25?'low':''}" style="width:${state.stats[i]}%"></div></div></div>`).join('')}</div><p class="side-note">현재 준비와 관계</p><div class="chips">${state.flags.filter(f=>FLAG_NAMES[f]).map(f=>`<span class="chip">${FLAG_NAMES[f]}</span>`).join('')||'<span class="hint">아직 결정된 정책이 없습니다.</span>'}</div><p class="side-note">수치는 정책의 누적 효과입니다. 전쟁·중립 판정에는 군사력과 준비 기록이 함께 쓰입니다. 결말은 수치의 합계가 아닌 선택한 경로로 결정됩니다.</p><p class="hint">발견한 사건 ${seen.size} / ${Object.keys(NODES).length}</p></aside><article>${body}</article></div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));const next=document.getElementById('next');if(next)next.onclick=goNext;const again=document.getElementById('again');if(again)again.onclick=()=>document.getElementById('confirm').showModal();const endMap=document.getElementById('ending-map');if(endMap)endMap.onclick=()=>toggleMap(true);if(showMap)renderMap();if(focus){document.querySelector('h1').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function targets(node){return [...new Set(node.choices.flatMap(c=>typeof c.next==='string'?[c.next]:c.next.map(r=>r.to)))]}
function graphLayout(){const indegree=Object.fromEntries(Object.keys(NODES).map(id=>[id,0]));for(const n of Object.values(NODES))for(const to of targets(n))indegree[to]++;const queue=Object.keys(indegree).filter(id=>indegree[id]===0),depth=Object.fromEntries(Object.keys(NODES).map(id=>[id,0]));let processed=0;while(queue.length){const id=queue.shift();processed++;for(const to of targets(NODES[id])){depth[to]=Math.max(depth[to],depth[id]+1);if(--indegree[to]===0)queue.push(to)}}if(processed!==Object.keys(NODES).length)throw Error('Cyclic graph');const cols=[];for(const id of Object.keys(NODES)){const d=depth[id];(cols[d]||=[]).push(id)}const maxRows=Math.max(...cols.map(c=>c.length)),positions={};cols.forEach((ids,d)=>ids.forEach((id,row)=>positions[id]={x:30+d*260,y:35+row*110+(maxRows-ids.length)*55}));return{positions,width:cols.length*260+40,height:maxRows*110+70}}
const graph=graphLayout();
function renderMap(){const path=new Set(state.history.map(h=>`${h.node}:${h.to}`));const visits=new Set(['start',...state.history.flatMap(h=>[h.node,h.to])]);const current=state.pending?state.history.at(-1).to:state.node;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${graph.width*zoom}" height="${graph.height*zoom}" viewBox="0 0 ${graph.width} ${graph.height}" role="img" aria-label="역사 선택 분기표" lang="ko"><title>역사 선택 분기표. 자세한 이동 기록은 아래 이번 회차를 글로 보기에서 확인할 수 있습니다.</title>`;
for(const node of Object.values(NODES)){const a=graph.positions[node.id];for(const to of targets(node)){const b=graph.positions[to],taken=path.has(`${node.id}:${to}`),mx=(a.x+220+b.x)/2;svg+=`<path class="edge ${taken?'taken':''}" d="M${a.x+220} ${a.y+35} C${mx} ${a.y+35} ${mx} ${b.y+35} ${b.x} ${b.y+35}"/>`}}
for(const node of Object.values(NODES)){const p=graph.positions[node.id],known=showAll||seen.has(node.id),title=known?node.title:'미발견 사건',words=title.length>16?[title.slice(0,16),title.slice(16)]:[title];svg+=`<g id="map-node-${node.id}" class="${visits.has(node.id)?'visited':''} ${node.id===current?'current':''} ${known?'':'unseen'}"><title>${esc(title)}</title><rect x="${p.x}" y="${p.y}" width="220" height="70" rx="5"/><text class="tiny" x="${p.x+12}" y="${p.y+18}">${node.id===current?'현재 경로':visits.has(node.id)?'이번 회차':known?'다른 경로':'???'}${known&&node.ending?' · 결말':''}</text>${words.map((w,i)=>`<text x="${p.x+12}" y="${p.y+40+i*18}">${esc(w)}</text>`).join('')}</g>`}svg+='</svg>';document.getElementById('map-scroll').innerHTML=svg;document.getElementById('path-list').innerHTML=state.history.map(h=>`<li>${h.year} · ${esc(NODES[h.node].title)} — ${esc(NODES[h.node].choices[h.choice].title)} → ${esc(NODES[h.to].title)}</li>`).join('')||'<li>1873 · 친정, 첫 번째 갈림길</li>';document.getElementById('spoilers').setAttribute('aria-pressed',String(showAll));document.getElementById('spoilers').textContent=showAll?'미발견 사건 숨기기':'미발견 사건 공개';document.getElementById('zoom-out').disabled=zoom<=.45;document.getElementById('zoom-in').disabled=zoom>=1.25}
function centerMap(){const current=state.pending?state.history.at(-1).to:state.node,p=graph.positions[current],box=document.getElementById('map-scroll');box.scrollTo({left:(p.x+110)*zoom-box.clientWidth/2,top:(p.y+35)*zoom-box.clientHeight/2,behavior:'instant'})}
function toggleMap(force){showMap=typeof force==='boolean'?force:!showMap;document.getElementById('map-panel').hidden=!showMap;document.getElementById('map-toggle').setAttribute('aria-expanded',String(showMap));if(showMap){renderMap();centerMap();document.getElementById('map-panel').scrollIntoView({block:'start',behavior:'instant'})}}
document.getElementById('restart').onclick=()=>document.getElementById('confirm').showModal();document.getElementById('cancel-reset').onclick=()=>document.getElementById('confirm').close();document.getElementById('confirm-reset').onclick=startOver;document.getElementById('map-toggle').onclick=()=>toggleMap();document.getElementById('spoilers').onclick=()=>{showAll=!showAll;renderMap()};document.getElementById('zoom-out').onclick=()=>{zoom=Math.max(.45,Math.round((zoom-.15)*100)/100);renderMap();centerMap()};document.getElementById('zoom-in').onclick=()=>{zoom=Math.min(1.25,Math.round((zoom+.15)*100)/100);renderMap();centerMap()};document.getElementById('map-current').onclick=centerMap;render();save();
</script></body></html>
