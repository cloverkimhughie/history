'use strict';
const NODES={"start":{"id":"start","year":1873,"title":"친정, 첫 번째 갈림길","story":"새벽 문안이 끝났지만 어전의 대신들은 물러가지 않는다. 대원군이 떠난 자리에는 군영의 낡은 무기 목록, 지방의 세금 체납 장부, 바다에 나타난 이양선의 보고가 함께 놓여 있다. 이제 이 문서 끝에 찍힐 옥새는 누구의 뜻도 아닌 당신의 결정이어야 한다.\n\n한 대신은 “먼저 안을 다스리셔야 하옵니다”라고 말한다. 다른 이는 외국의 사정을 모르고 문을 닫으면 상대가 문을 두드릴 때 대답할 말조차 없을 것이라 반박한다. 국고로 모든 일을 할 수는 없다. 당신의 첫 명령은 조선이 무엇을 가장 두려워하고 무엇부터 바꾸려 하는지 드러낼 것이다.","choices":[{"title":"먼저 수교할 나라를 찾는다","desc":"예조의 관리가 아룁니다. “바다 밖 사정을 알아야 저들의 요구도 가릴 수 있사옵니다.” 역관과 사절을 보내 조선이 먼저 교섭의 문을 두드리십시오. 다만 조정의 유생들은 선왕의 뜻을 저버린다며 상소를 올릴 것입니다.","next":"diplomacy","delta":[-3,0,0,5,0,0],"flags":[],"when":null,"result":"예조에 각국의 사정과 통상 조건을 조사하라는 전교가 내려갔다. 역관들이 불려 왔고, 조정은 어느 나라에 첫 국서를 보낼지를 두고 갈라졌다.\n\n궁중에서는 외국 서적을 읽는 역관을 찾기 시작했고 보수적인 대신들은 교섭의 한계를 미리 정하라고 요구했다. 사절을 보내겠다는 뜻은 섰지만, 누구에게 무엇을 청할지를 놓고 첫 번째 외교 논쟁이 벌어졌다.","resultTitle":"닫힌 문 앞에 세운 사절"},{"title":"수교를 미루고 해안을 요새화한다","desc":"병조는 낡은 포대와 비어 있는 군량 창고를 먼저 가리킵니다. 외교의 문을 잠시 닫고 강화의 진보와 수송로를 정비하십시오. 적이 오기 전에 대비할 수 있으나 공사와 징발의 부담은 연안 백성에게 돌아갑니다.","next":"unyo","delta":[-8,0,12,0,3,3],"flags":["fortified"],"when":null,"result":"강화의 진보를 수리하고 해안 지형을 조사하라는 명령이 전달됐다. 군량과 자재를 실은 배가 움직이는 동안, 외국 선박의 접근을 알리는 보고가 올라왔다.\n\n연안 주민들은 돌과 목재를 나르며 당장의 부담을 치렀다. 포대의 빈틈은 줄었지만 새 방어 시설을 시험할 일이 없는 것이 최선이었다. 얼마 뒤 파발은 바다에 나타난 낯선 군함의 움직임을 전했다.","resultTitle":"바다보다 먼저 움직인 사람들"},{"title":"문을 닫고 왕실의 통제력을 강화한다","desc":"측근들은 새로 친정을 시작한 임금의 명령부터 바로 세워야 한다고 주장합니다. 궁중 인사와 군영을 장악하고 대외 교섭을 엄금하십시오. 조정은 조용해지겠지만 바다 밖의 변화는 궁궐의 명령을 기다리지 않습니다.","next":"unyo","delta":[5,-5,0,-3,2,12],"flags":["closed"],"when":null,"result":"요직에 측근이 배치되고 외국과의 사사로운 접촉을 금하는 교지가 반포됐다. 조정의 복종은 얻었지만 연안 군영의 낡은 장비는 그대로 남았다.\n\n신하들은 왕명을 거스르는 말을 삼갔지만 지방의 물자 부족까지 해결되지는 않았다. 군영에서 올라오는 장비 수리 요청은 뒤로 밀렸다. 조정이 안정을 보고하던 때에 외국 군함의 접근을 알리는 파발이 도착했다.","resultTitle":"조용해진 어전, 달라지지 않은 바다"}],"ending":null,"fact":"고종은 1873년 친정을 시작했다. 이 뒤의 조기 수교·전쟁 경로는 사용자가 제안한 가상 역사다."},"diplomacy":{"id":"diplomacy","year":1874,"title":"누구와 먼저 손을 잡을 것인가","story":"역관들이 여러 나라의 지리와 통상 관행을 적은 책자를 펼쳐 놓는다. 독일의 기계, 미국 상인의 항로, 러시아의 북방 거점, 일본의 새 군제가 차례로 거론된다. 어느 보고에도 조선을 아무 대가 없이 돕겠다는 약속은 없다.\n\n사절을 보내는 데 그치지 않고 무엇을 얻고 무엇을 내주지 않을지 훈령을 정해야 한다. 군영은 무기를, 호조는 관세 수입을, 연안의 지방관은 충돌 없는 항구를 원한다. 첫 수교 상대를 고르는 일은 앞으로 조선의 어느 문제를 누구와 함께 다룰지 정하는 일이다.","choices":[{"title":"독일과 기술·통상 교섭을 시작한다","desc":"역관은 유럽에서 강대국으로 떠오른 독일의 기계와 군사 제도를 보고합니다. 청이나 일본의 독점을 견제할 기술 상대를 찾으십시오. 다만 먼 나라의 상인이 이익을 본다고 해서 군함까지 조선을 지켜 주리라 기대할 수는 없습니다.","next":"german","delta":[-3,0,0,6,0,0],"flags":[],"when":null,"result":"독일 측과 접촉할 역관에게 기술자 초빙과 통상 조건을 적은 훈령을 내렸다. 군사적 보호가 아닌 계약의 내용을 놓고 교섭이 시작됐다.\n\n역관은 장비의 값뿐 아니라 교사를 고용하고 제자를 기를 비용도 묻도록 지시받았다. 조정에서는 군사적 보호를 기대하는 말이 나왔지만 훈령에는 아직 그런 약속이 없었다. 첫 회담의 쟁점은 기술을 들이는 조건이었다.","resultTitle":"기계를 청하는 국서"},{"title":"미국에 수교 사절을 보낸다","desc":"일부 신하는 태평양 건너의 미국을 새로운 교역 상대가 될 나라로 봅니다. 사절에게 관세와 국법을 존중하는 관계를 타진하게 하십시오. 왕실은 우호를 원하지만 상대가 약속할 수 있는 것은 통상인지 보호인지부터 가려야 합니다.","next":"american","delta":[-3,0,0,4,2,0],"flags":[],"when":null,"result":"미국 측에 전달할 국서가 봉해졌다. 돌아온 첫 답신은 통상에 관심을 보였지만, 조선이 위기에 처했을 때 병력을 보내겠다는 약속은 담지 않았다.\n\n군부는 답신에서 보호의 약속을 찾으려 했고 통상 담당자는 항구와 관세 조항을 살폈다. 같은 국서를 두고도 신하들이 기대한 바는 달랐다. 조선이 원하는 우호가 어느 범위의 관계인지를 정해야 했다.","resultTitle":"태평양을 건너는 기대"},{"title":"러시아와 북방 협정을 협상한다","desc":"북방의 관리들은 국경을 맞댄 러시아와 먼저 뜻을 맞춰야 한다고 말합니다. 육상 교역과 군사 지원을 얻을 수 있으나 러시아가 원하는 항구의 사용권은 결코 가벼운 대가가 아닙니다.","next":"russian","delta":[-3,0,4,0,-2,0],"flags":[],"when":null,"result":"북방 교섭을 맡은 관리에게 국서를 보냈다. 러시아 측은 교역과 교관 파견을 논의하자며 동해 항구에 관한 조건을 함께 제시했다.\n\n군수품의 공급을 기대한 장수들은 협상을 반겼다. 그러나 항구의 사용 구역을 그린 문서가 따라오자 예조와 지방관의 표정은 달라졌다. 지원을 얻는 일과 영토의 관할권을 지키는 일이 같은 협상장에 놓였다.","resultTitle":"북방에서 온 대가"},{"title":"일본과 직접 국교를 협상한다","desc":"왜학 역관은 가까운 일본과의 관계를 더는 미룰 수 없다고 아룁니다. 직접 사절을 맞아 충돌의 구실을 줄이십시오. 그러나 회담장에서는 예법보다 개항과 관할권을 둘러싼 요구가 더 무겁게 다뤄질 것입니다.","next":"ganghwa","delta":[0,0,0,3,0,0],"flags":[],"when":null,"result":"접견 사절에게 회담의 전권과 한계를 적어 주었다. 일본 측은 친교의 말과 함께 항구 개방 및 자국민의 재판 문제를 의제로 올렸다.\n\n접견을 준비하던 관원들의 관심은 의전에서 조약문으로 옮겨 갔다. 역관은 같은 표현도 양측이 다른 뜻으로 이해할 수 있다고 경고했다. 사절에게 어느 조항까지 양보할 권한을 줄지 왕실의 재가가 필요했다.","resultTitle":"예법 너머의 조문"}],"ending":null,"fact":null},"german":{"id":"german","year":1875,"title":"조독 통상 협상","story":"독일 측의 제안서가 역관의 번역을 거쳐 어전에 올라온다. 기술자와 교관의 고용료, 장비의 운송비, 통상을 허용할 범위가 항목별로 적혀 있다. 기계를 사는 비용보다 그것을 계속 움직이게 할 사람과 부품의 비용이 더 오래 남는다.\n\n병조는 새 포를 먼저 주문하자고 재촉한다. 호조는 수입품이 늘 때 세금을 누가 거둘지부터 확실히 해야 한다고 맞선다. 유럽의 기술을 들이는 계약이 조선의 권한을 넘기는 계약이 되지 않도록, 당신이 교섭의 선을 그어야 한다.","choices":[{"title":"기술자와 교사를 들이고 관세권을 지킨다","desc":"호조와 예조는 기술을 배우되 세금까지 외국인의 손에 맡기지는 말자고 의견을 모읍니다. 교사·기술자를 기간을 정해 고용하고 세관은 조선이 관리하게 하십시오. 당장의 비용은 크지만 기계를 스스로 돌릴 인재를 남길 수 있습니다.","next":"workshop","delta":[-8,2,5,12,4,0],"flags":["german","technical"],"when":null,"result":"관세 징수는 조선 관리가 맡고 기술자는 계약 기간 동안 교육을 담당하도록 합의했다. 기계가 도착하자 이제 누구를 가르치고 어떤 공장을 세울지가 새 과제가 됐다.\n\n세관의 인장을 조선 관리가 쥐게 되자 호조는 최소한의 세입 권한을 확보했다고 보고했다. 다만 기계를 받아 놓아도 운용할 장인이 없다는 문제가 곧 드러났다. 계약서 뒤에는 기술학교와 생산 계획이라는 새 장부가 붙었다.","resultTitle":"기계를 사는 대신 사람을 기르다"},{"title":"군사 교관과 무기 구매에 집중한다","desc":"병조는 학교의 성과를 기다리다가는 다음 함대를 막지 못한다고 재촉합니다. 교관과 무기를 먼저 들여 정예 부대를 만드십시오. 빠른 전력 보강은 가능하나 탄약·부품의 수입이 끊기면 새 군대도 멈출 수 있습니다.","next":"coast","delta":[-10,-2,15,3,0,3],"flags":["german","trained"],"when":null,"result":"외국 교관이 훈련을 맡고 새 포와 소총이 군영에 들어왔다. 병조는 개선된 사격 보고와 함께 탄약 구입비를 추가로 청했다.\n\n훈련장에서는 이전과 다른 사격 보고가 올라왔고 장수들의 자신감도 커졌다. 그러나 부품과 탄약을 들여올 자금은 매년 필요했다. 조정은 개선된 군사력을 바탕으로 연안의 압박에 어떻게 대응할지 논의하기 시작했다.","resultTitle":"새 소총의 긴 그림자"},{"title":"불리한 조건을 거절하고 미국과 교섭한다","desc":"사절의 요구가 조정에서 정한 한도를 넘었습니다. 왕명으로 교섭을 중단하고 다른 상대를 찾으십시오. 조건을 지키는 선례를 세울 수 있지만 이미 쓴 사행 비용과 시간은 돌려받을 수 없습니다.","next":"american","delta":[-3,0,0,2,3,0],"flags":[],"when":null,"result":"역관에게 협상을 중지시키고 미국과의 접촉을 준비하게 했다. 독일의 기술 도입은 미뤄졌고 새 상대에게 조선의 조건을 처음부터 설명해야 했다.\n\n이미 마련한 사행 비용은 손실로 남았고 군부는 장비 도입이 늦어졌다고 불만을 보였다. 다른 대신들은 조건을 넘는 요구에는 물러설 수 있다는 선례를 평가했다. 미국과의 새 교섭은 그 손실과 기대를 함께 안고 시작됐다.","resultTitle":"서명하지 않은 계약"}],"ending":null,"fact":null},"workshop":{"id":"workshop","year":1877,"title":"기계를 돌릴 사람들","story":"공장 마당에 도착한 기계가 아직 풀지 못한 나무 상자 안에 놓여 있다. 외국 기술자의 손이 닿으면 장치가 움직이지만 조선의 장인들은 도면의 기호와 작동 순서를 배우는 중이다. 공사에 돈을 댄 상인들은 언제 제품이 나오는지 묻는다.\n\n군영에서는 수리할 총과 포의 명세를 보내 왔다. 기술 교육을 넓히면 성과는 늦게 나타나고, 군수품에 집중하면 민간의 주문은 밀린다. 당신이 도입한 기계가 국가 전체의 새로운 기술이 될지, 군영만을 위한 설비가 될지 정할 차례다.","choices":[{"title":"기술학교를 세우고 민간 상인을 참여시킨다","desc":"기술을 외국인 몇 사람에게만 맡기면 계약이 끝나는 날 공장도 멈춥니다. 신분보다 재주를 보고 학생을 뽑고 상인들의 출자를 허용하십시오. 새로운 인재와 부가 자라는 만큼 이들은 국정에서도 발언권을 요구할 것입니다.","next":"customs","delta":[-6,8,2,12,3,-4],"flags":["school"],"when":null,"result":"공장 곁에 강습소가 마련되고 역관과 장인, 상인의 자제가 함께 배웠다. 출자한 상인들은 수익뿐 아니라 관청의 지출과 세금에도 관심을 보이기 시작했다.\n\n처음에는 통역 없이 도면을 읽는 일조차 어려웠지만 학생들은 장인의 작업을 보며 기술을 익혔다. 상인들은 투자한 돈이 관청의 임의 지출로 사라지지 않도록 장부를 보여 달라고 요구했다. 교육의 확대가 재정의 공개라는 문제를 데려왔다.","resultTitle":"공장 곁의 교실"},{"title":"공장을 군수 시설로 전환한다","desc":"군영은 민간 제품보다 탄약과 수리 부속이 급하다고 호소합니다. 공장의 생산을 병조의 주문에 집중하십시오. 전쟁 준비는 빨라지지만 장인과 상인의 기대는 국가의 군수 계획에 종속됩니다.","next":"coast","delta":[-6,-3,13,5,0,5],"flags":["trained"],"when":null,"result":"공장에 내려가는 주문서가 군수품 중심으로 바뀌었다. 포와 소총의 수리는 빨라졌지만 민간 주문이 밀리면서 상인들의 불만도 쌓였다.\n\n공장의 생산 일정은 군영의 요구에 따라 바뀌었다. 장인들은 더 안정적인 주문을 얻었지만 민간 상인들은 자신들의 차례가 오지 않는다고 항의했다. 군사적 준비를 갖춘 조정에는 그 힘을 외교에 쓸지 현장에 쓸지라는 과제가 남았다.","resultTitle":"군영으로 향하는 생산물"}],"ending":null,"fact":null},"american":{"id":"american","year":1875,"title":"조미 수교 협상","story":"미국 측과 접촉한 역관이 답신을 읽는다. 통상과 사절의 왕래에는 관심을 보이지만 조선에 전쟁이 일어날 때 병력을 보낸다는 조항은 찾을 수 없다. 어전에서는 ‘우호’라는 말을 어디까지 믿어야 하는지를 두고 논쟁이 벌어진다.\n\n통상 담당자는 장래의 세입을 계산하고, 군사 담당자는 보호 약속 없는 개항의 위험을 말한다. 서로 기대하는 관계가 다르다는 사실을 인정한 채 얻을 수 있는 권리를 확보할 것인가, 아니면 더 확실한 약속을 받아낼 때까지 기다릴 것인가?","choices":[{"title":"군사 보장보다 관세와 교육 교류를 확보한다","desc":"군사 지원에 관한 모호한 말보다 문서에 남는 권리를 확보하라는 상소가 올라옵니다. 관세 징수와 교육 교류를 우선 협상하십시오. 외국군의 보호는 얻지 못해도 새 교역을 조선의 제도 안에서 다룰 여지는 생깁니다.","next":"ports","delta":[6,2,0,7,3,0],"flags":["american","open_trade"],"when":null,"result":"군사 보장 요구를 접고 통상과 교육 조항을 구체화했다. 항구로 새로운 물자가 들어오기 시작하자 조정에는 교역의 이익과 피해가 함께 보고됐다.\n\n병조는 확실한 보호를 얻지 못했다고 아쉬워했지만 통상 담당자들은 집행할 조항을 정리할 수 있게 됐다. 항구에서는 새로운 거래가 시작됐다. 몇 달의 기대 뒤, 교역의 수혜와 피해를 함께 적은 지방관의 보고가 올라왔다.","resultTitle":"약속할 수 있는 것부터"},{"title":"군사적 보호를 조건으로 끝까지 재협상한다","desc":"대신들은 통상의 문을 열기 전에 침략을 막을 약속부터 받아야 한다고 주장합니다. 군사 보호를 끝까지 요구하십시오. 다만 상대가 거절하면 조약도 지원도 얻지 못한 채 다음 위기를 맞을 수 있습니다.","next":"unyo","delta":[-5,0,0,2,0,-2],"flags":["american_contact"],"when":null,"result":"사절은 보호 약속 없이는 서명할 수 없다는 훈령을 전했다. 교섭은 길어졌고, 조정이 답신을 기다리는 사이 강화 해역의 긴급 장계가 도착했다.\n\n사절은 같은 요구를 거듭 설명했지만 보호 약속은 문서에 들어오지 않았다. 조정은 협상이 끝나기 전에 국내의 대비를 얼마나 진행해야 할지 결정하지 못했다. 강화의 긴급 장계가 도착하면서 외교의 시간과 군영의 시간이 충돌했다.","resultTitle":"회답을 기다린 시간"},{"title":"여러 나라에 항구를 개방해 독점을 막는다","desc":"어느 한 나라가 항구를 독차지하면 가격과 운송까지 좌우할 수 있습니다. 여러 나라 상인에게 같은 문을 열어 경쟁을 유도하십시오. 세입은 늘 수 있으나 외국 물품과 겨뤄야 할 국내 장인들은 보호책을 요구할 것입니다.","next":"customs","delta":[10,-3,0,8,-3,0],"flags":["open_trade"],"when":null,"result":"여러 나라 상인에게 통상의 길이 열렸다. 세관의 장부는 두꺼워졌지만 값싼 수입품에 밀린 장인들이 지방 관아에 탄원서를 내기 시작했다.\n\n상인들은 한 나라만을 상대하지 않아도 된다는 점을 반겼다. 그러나 물품이 많아질수록 세관의 인력과 분쟁 처리 능력도 모자라졌다. 늘어난 수입을 군비에 쓸지 피해 업종과 제도 정비에 쓸지 다시 결정해야 했다.","resultTitle":"여러 깃발이 들어온 항구"}],"ending":null,"fact":null},"russian":{"id":"russian","year":1875,"title":"조러 북방 협상","story":"북방에서 올라온 문서에는 국경 교역과 교관 파견, 동해 항구의 이용 문제가 한데 묶여 있다. 러시아 측은 지원을 말하지만 함경도의 지방관은 외국 경비가 항구에 들어오면 주민의 통행과 징세를 누가 다스릴지 먼저 물어야 한다고 보고한다.\n\n병조는 가까운 곳에서 군수품을 받을 수 있다는 점에 주목한다. 예조의 일부 관원은 배를 들이는 문은 있어도 돌려보내는 문은 계약에 쓰지 않으면 생기지 않는다고 경고한다. 군사적 여유를 얻기 위해 해안의 권한을 얼마나 허용할 것인지 결정해야 한다.","choices":[{"title":"원산의 제한적 사용권과 군사 지원을 교환한다","desc":"러시아 측은 항구를 쓸 수 있다면 교관과 군수 지원을 제공하겠다고 말합니다. 사용 구역과 기간을 정해 군사적 여유를 얻으십시오. 그러나 조약의 작은 글씨를 모르는 주민들에게는 외국 병사의 초소 자체가 영토 양도로 보일 수 있습니다.","next":"wonsan","delta":[8,-7,12,2,-10,3],"flags":["russian","lease"],"when":null,"result":"항구의 일부 구역에 외국 경비가 배치되고 교관이 도착했다. 어민과 상인은 새 통행 규칙에 반발했고, 원산의 지방관은 소요의 조짐을 보고했다.\n\n장수들은 새 교관의 도착을 보고했지만 원산의 주민들은 부두의 검문부터 경험했다. 계약에 적힌 제한적인 권리와 현장에서 느끼는 외국의 권력 사이에 간극이 생겼다. 그 간극은 상인의 항의와 체포자 가족의 탄원으로 궁궐에 돌아왔다.","resultTitle":"도움이 들어온 자리"},{"title":"항구 양도를 거절하고 육상 교역만 허용한다","desc":"함경도의 보고에 따르면 육상 교역만으로도 곡물과 물자의 교환을 늘릴 수 있습니다. 항구는 내주지 않고 국경 시장과 통행 규칙을 협상하십시오. 군사 지원의 규모는 줄겠지만 해안의 관할권은 온전히 남습니다.","next":"border","delta":[6,3,3,4,4,0],"flags":["russian","limited"],"when":null,"result":"항구 사용 요구는 거절하고 육상 교역의 범위만 정했다. 국경 왕래가 늘어나자 세금 징수와 순찰 구역을 둘러싼 새로운 협의가 필요해졌다.\n\n러시아 측은 지원의 범위를 줄였지만 국경의 거래 자체는 이어졌다. 시장이 커지자 허가와 세금, 순찰 구역을 둘러싼 다툼이 잦아졌다. 항구의 관할권을 지킨 선택 뒤에는 국경의 질서를 함께 정할 일이 남았다.","resultTitle":"항구를 남겨 둔 거래"},{"title":"협상을 중단하고 독일에 접근한다","desc":"항구를 둘러싼 요구는 조정이 허락한 범위를 넘어섭니다. 당장의 군사 지원을 포기하고 독일의 기술을 들이는 길을 찾으십시오. 가까운 강국을 자극하는 부담과 먼 나라와 다시 협상할 비용을 감수해야 합니다.","next":"german","delta":[-3,0,0,2,2,0],"flags":[],"when":null,"result":"항구 양도에 응할 수 없다는 답신을 보냈다. 조정은 러시아의 반응을 살피며 독일 측에 기술·통상 교섭을 타진했다.\n\n지원 계획을 기대했던 북방의 장수들은 다른 재원을 마련해야 했다. 조정은 러시아와의 불편한 관계를 관리하면서 먼 나라의 교섭 절차를 새로 배웠다. 군사적 의존을 줄인 대신 시간과 비용을 더 치르는 길이었다.","resultTitle":"가까운 힘에서 한 걸음 물러서다"}],"ending":null,"fact":null},"wonsan":{"id":"wonsan","year":1877,"title":"원산의 항구 소요","story":"원산의 장계에는 세관과 부두 앞에 모인 주민들의 모습이 적혀 있다. 어민은 익숙하던 물길에서 검문을 받았고, 상인은 새 통행 규칙 때문에 짐을 옮기지 못했다. 외국 경비와의 실랑이가 체포로 이어지자 항구를 넘겼다는 소문이 고을 전체로 번졌다.\n\n외국 측은 계약에 따른 조치라고 주장하고 지방관은 병력 없이 소요를 막기 어렵다고 호소한다. 그러나 군대를 보내면 당신이 지키는 것이 백성인지 계약 상대의 편의인지 묻게 될 것이다. 항구에서 맺은 약속을 도성에서 다시 책임져야 할 순간이다.","choices":[{"title":"주민 대표와 협의하고 항구 사용권을 회수한다","desc":"지방관은 주민들이 외국 경비보다 조정의 침묵에 더 분노한다고 보고합니다. 대표를 만나 피해를 조사하고 항구 사용권의 회수를 명하십시오. 국내 신뢰를 되찾을 수 있으나 보상 요구와 지원 중단을 감당해야 합니다.","next":"customs","delta":[-10,12,-4,4,10,-3],"flags":["lease_revoked"],"when":null,"result":"주민 대표가 관아에 들어왔고 조정은 사용권을 회수하겠다고 통보했다. 외국 측의 배상 요구가 남았지만 주민들은 다시 조선 관리의 명령을 따르기 시작했다.\n\n외국 경비와 조선 관원의 권한을 둘러싼 마찰은 즉시 사라지지 않았다. 그래도 주민들은 자신들의 호소가 국정의 결정에 반영됐다는 사실을 확인했다. 조정은 회수에 드는 비용을 감당하면서 항구의 세입과 운영 방식을 다시 정해야 했다.","resultTitle":"왕명이 다시 닿은 부두"},{"title":"러시아 경비와 함께 소요를 진압한다","desc":"군영에서는 항구가 마비되면 교역과 군수품 반입이 함께 끊긴다고 주장합니다. 외국 경비와 합동으로 질서를 회복하십시오. 길은 빨리 열릴 수 있으나 백성은 자신들을 누른 군대 뒤에서 누구의 명령이 움직였는지 기억할 것입니다.","next":"protectorate","delta":[0,-14,5,0,-12,7],"flags":["repressed"],"when":null,"result":"합동 경비가 거리를 장악하며 항구의 업무는 재개됐다. 그러나 체포자 가족의 탄원이 쌓였고 조정은 질서 유지를 위해 외국 병력에 더 의존하게 됐다.\n\n부두의 짐은 다시 움직였지만 주민들은 관아에 불만을 전하기를 꺼렸다. 지방관은 조용해진 거리를 안정이라고 보고했다. 정작 다음 소요가 일어났을 때 누구의 병력을 부를 것인지에 대한 답은 더 외국군 쪽으로 기울었다.","resultTitle":"열린 길 위에 남은 침묵"},{"title":"공동 관리 기구와 사용 기한을 재협상한다","desc":"상인들은 항구를 닫는 것도 군대를 더 들이는 것도 원하지 않습니다. 조선 관리가 참여하는 공동 관리와 명확한 만료일을 요구하십시오. 타협이 성립해도 외국 경비의 권한을 둘러싼 다툼까지 사라지지는 않습니다.","next":"border","delta":[-4,5,2,5,3,-2],"flags":["joint_port"],"when":null,"result":"조선 관리의 입회와 사용 기한을 명문화하는 재협상이 시작됐다. 통행 규칙이 완화되면서 소요는 잦아들었지만 북방 협력의 범위를 다시 정해야 했다.\n\n검문과 통행에 관한 기준이 알려지면서 거래가 조금씩 돌아왔다. 다만 어느 쪽 관리의 판단이 우선하는지 다투는 일은 계속됐다. 조정은 항구에서 마련한 절충을 북방 전체의 군사·통상 관계에서도 유지할 수 있을지 살펴야 했다.","resultTitle":"계약에 그은 경계"}],"ending":null,"fact":null},"border":{"id":"border","year":1879,"title":"북방 국경의 협정","story":"국경 시장에는 곡물과 직물을 실은 짐이 늘었고 순찰병의 보고도 함께 많아졌다. 양측 관리들은 통행 허가와 세금의 기준을 달리 해석한다. 러시아 측은 질서 유지를 위한 더 긴밀한 군사 협의가 필요하다고 제안해 왔다.\n\n북방의 장수는 도움을 받으면 부족한 병력을 메울 수 있다고 말한다. 다른 대신은 군대가 머문 뒤에는 통상 문제도 군사 문제로 변한다고 지적한다. 국경의 안정을 한 나라와의 깊은 관계에서 구할지, 여러 관계를 통해 지킬지 판단해야 한다.","choices":[{"title":"국경 방어 협정을 맺되 지휘권은 조선이 갖는다","desc":"국경을 지키는 장수는 교관과 물자를 받을 수 있어도 명령권까지 넘겨서는 안 된다고 아룁니다. 지원 범위를 문서로 한정하고 작전 지휘는 조선 관원이 맡게 하십시오. 상대는 더 많은 권리를 요구하며 지원 속도를 늦출 수 있습니다.","next":"coast","delta":[-5,2,10,3,4,2],"flags":["trained"],"when":null,"result":"지원 물자의 인도와 교관의 임무를 구분하고 군령권은 조정에 남겼다. 훈련을 마친 부대가 배치되자 연안 방위에서도 전보다 넓은 선택이 가능해졌다.\n\n훈련 현장에서는 외국 교관이 가르쳤지만 이동과 배치의 최종 명령은 조선 지휘관을 거쳤다. 그 경계를 확인하는 과정에서 지원은 때때로 늦어졌다. 그래도 새로 훈련한 병력을 조정이 독자적으로 운용할 기반이 남았다.","resultTitle":"교관의 말과 조선의 군령"},{"title":"독일·미국에도 사절을 보내 균형을 만든다","desc":"한 나라의 호의에 기대면 그 나라의 뜻이 바뀌는 날 국정도 흔들립니다. 독일과 미국에도 사절을 보내 교역과 기술의 통로를 나누십시오. 균형을 만드는 외교에는 비용이 들며 서로 다른 약속을 관리할 관원이 필요합니다.","next":"alliance","delta":[-6,3,0,7,7,0],"flags":["balanced"],"when":null,"result":"여러 나라에 사절과 훈령이 나뉘어 보내졌다. 교섭 상대는 늘었지만 각국이 원하는 조건을 한자리에서 조정할 필요도 커졌다.\n\n사절마다 가져온 제안이 달라 역관과 관원들의 업무는 늘었다. 한 나라의 요구를 그대로 받아들이지 않을 여지는 넓어졌지만 서로 양립하기 어려운 약속을 걸러야 했다. 조정은 여러 관계를 하나의 외교 방침으로 정리하려 했다.","resultTitle":"여러 문을 가진 나라"},{"title":"러시아의 상주 군대를 받아들인다","desc":"북방의 장수들은 당장 쓸 수 있는 병력이 부족하다고 보고합니다. 러시아군의 주둔을 허용해 공백을 메우십시오. 국경은 안정될 수 있으나 그 군대를 언제, 어떤 조건으로 돌려보낼 수 있을지가 다음 문제입니다.","next":"protectorate","delta":[8,-6,9,0,-14,5],"flags":["garrison"],"when":null,"result":"외국군의 주둔지가 정해지고 국경 순찰이 강화됐다. 얼마 뒤 그 지휘관은 군항 운영과 군수 비용에 관한 협의를 조정에 요구했다.\n\n순찰이 늘자 국경의 불안은 줄었다. 그러나 외국군에 필요한 시설과 비용이 늘면서 지방관은 독자적으로 처리하지 못하는 사안을 도성에 올렸다. 지원을 받는 관계가 그 지원 없이는 움직이기 어려운 관계로 바뀌기 시작했다.","resultTitle":"돌려보낼 조건 없는 군대"}],"ending":null,"fact":null},"protectorate":{"id":"protectorate","year":1881,"title":"보호의 대가","story":"외국군의 초소가 생긴 곳에서는 길이 다시 열리고 관청의 업무도 돌아간다. 그러나 군수 비용과 항구 운영에 관한 문서는 조선 관청보다 외국 지휘관에게 먼저 전달되는 일이 늘었다. 조정이 내린 명령도 그들의 협조가 있어야 시행되는 경우가 생긴다.\n\n측근들은 왕실의 안위가 보장됐다는 사실을 강조한다. 반면 상인과 지방의 유생들은 누가 나라의 일을 결정하는지 묻기 시작했다. 병력을 내보내려면 비어 있는 치안과 재정을 스스로 채워야 한다. 남겨 둔다면 왕좌와 국권의 거리는 더 멀어질 수 있다.","choices":[{"title":"철수를 요구하고 국내 연대를 조직한다","desc":"외국군이 떠나면 질서가 무너질 것이라는 주장이 궁궐에 가득합니다. 상인·지방관·군인 대표를 묶어 자체 치안과 재정을 마련한 뒤 철수를 요구하십시오. 국왕이 권한을 나눠야 얻을 수 있는 독립의 기반입니다.","next":"congress","delta":[-12,12,-8,7,14,-5],"flags":["independence"],"when":null,"result":"조정은 각계 대표에게 치안과 군비 분담을 논의하게 하고 철수 요구를 전달했다. 지원의 공백을 누가 메울지 결정하기 위해 보다 넓은 국정 협의가 소집됐다.\n\n외국의 지원이 끊길 경우를 대비해 상인들은 자금, 지역 대표들은 치안의 부담을 논의했다. 그들은 협력을 약속하는 대신 결정 과정에 참여할 자리를 요구했다. 자주성을 회복하려는 명령이 왕권을 나눠야 하는 문제로 이어졌다.","resultTitle":"빈자리를 함께 메우는 협약"},{"title":"주둔을 인정하고 왕실의 지위를 보장받는다","desc":"측근들은 적어도 왕실만은 보전해야 훗날을 도모할 수 있다고 말합니다. 주둔과 외교 감독을 인정하는 대신 왕위의 보장을 얻으십시오. 옥새는 남아도 그 옥새로 결정할 수 있는 일은 줄어들 것입니다.","next":"end_dependency","delta":[6,-5,0,0,-12,8],"flags":[],"when":null,"result":"왕실의 지위를 인정하는 문서가 도착했다. 그러나 대외 교섭과 군사 지출에는 후원국의 동의가 필요해졌고, 국왕의 재가는 이미 정해진 일을 확인하는 절차가 되어 갔다.\n\n신하들은 왕실을 지켰다는 성과를 보고했지만 외교와 군사의 중요한 안건은 밖에서 정해졌다. 지방에 내려가는 문서는 여전히 국왕의 이름을 썼다. 그 이름으로 무엇을 거부할 수 있는지 묻는 사람들에게 조정은 명확한 답을 주기 어려웠다.","resultTitle":"남은 옥새의 무게"}],"ending":null,"fact":null},"ports":{"id":"ports","year":1877,"title":"열린 항구의 두 얼굴","story":"새로 들어온 직물과 기구 앞에 사람들이 모인다. 세관에는 전에 없던 수입이 잡히지만, 근처 장인들의 주문 장부는 얇아진다. 항구의 번영을 알리는 보고와 생계를 잃었다는 탄원이 같은 날 어전에 도착한다.\n\n상인들은 길과 창고를 고쳐 달라 하고 관원들은 운영할 인력과 자금이 부족하다고 말한다. 외국 상사는 자신들이 시설을 맡겠다는 제안서를 내민다. 열린 문으로 들어온 이익을 누구에게, 어떤 조건으로 나눌지 정하지 않으면 개항의 기쁨은 새로운 원망으로 바뀔 것이다.","choices":[{"title":"관세 수입을 학교와 피해 업종에 투자한다","desc":"세관에는 은이 들어오지만 장인의 작업장에는 일감이 줄고 있습니다. 세입을 기술 교육과 업종 전환에 돌려 개항의 피해를 줄이십시오. 궁중과 군영에 돌아갈 몫을 줄여야 하므로 조정 안의 반발을 피하기 어렵습니다.","next":"customs","delta":[-5,9,0,12,2,-2],"flags":["school"],"when":null,"result":"기술 강습과 피해 업종 지원에 관세 수입이 배정됐다. 지원을 받은 상인과 장인들은 그 돈이 제대로 쓰이는지 확인할 창구도 요구했다.\n\n장인들은 지원만으로 경쟁이 쉬워지지는 않는다고 말하면서도 새 기술을 배울 기회를 얻었다. 관청의 지출을 놓고 궁중과 군영은 불만을 제기했다. 서로 다른 몫을 조정하려면 장부의 쓰임을 더 넓게 설명할 필요가 생겼다.","resultTitle":"세금이 돌아온 작업장"},{"title":"항구 운영을 외국 상사에 맡겨 세입을 확보한다","desc":"외국 상사는 항구를 맡기면 시설을 정비하고 정액의 수입을 보장하겠다고 제안합니다. 관리 부담을 덜고 급한 국고를 채우십시오. 대신 부두와 창고, 운송료에 관한 결정은 계약 상대의 손으로 넘어갑니다.","next":"debt","delta":[14,-6,0,4,-8,0],"flags":["concession"],"when":null,"result":"항구 운영 계약으로 국고에 자금이 들어왔다. 하지만 시설 투자금의 회수 조건이 붙으면서 장래의 세입과 관리권도 협상의 대상이 됐다.\n\n시설 정비는 빨라졌지만 창고와 운송료를 조정하는 과정에서 외국 상사의 뜻이 강해졌다. 조정은 계약을 유지하기 위해 장래의 수입까지 검토해야 했다. 당장의 세입을 얻은 결정이 다음 재정 협상의 범위를 좁혔다.","resultTitle":"부두의 주인과 나라의 장부"},{"title":"상인 대표를 국정 협의에 참여시킨다","desc":"상인들은 세금을 더 내더라도 자신들의 사정을 듣는 자리가 있어야 한다고 말합니다. 대표를 불러 통상과 지출을 함께 의논하십시오. 관직과 신분 밖의 사람이 국정에 참여하는 선례를 세우는 결정입니다.","next":"congress","delta":[3,10,0,8,2,-8],"flags":["merchant_voice"],"when":null,"result":"상인 대표가 관청의 회의에 참석했다. 처음에는 운송과 세금만 다루었으나 예산을 결정하는 권한이 누구에게 있는지까지 논의가 번졌다.\n\n상인 대표들은 관청의 설명에 질문을 덧붙이기 시작했다. 일부 대신은 생업에 종사하는 이들이 국정의 한계를 넘본다고 반발했다. 그러나 한 번 열린 회의는 누구의 세금으로 누구의 정책을 시행하는지 묻는 자리가 됐다.","resultTitle":"세금을 내는 사람들의 자리"}],"ending":null,"fact":null},"customs":{"id":"customs","year":1880,"title":"누가 세금을 결정하는가","story":"호조가 새 세입 장부를 펴자 군영과 공사 담당 관원들이 각각 예산을 청한다. 궁중의 지출도 줄지 않았고 항구의 상인들은 자신들이 낸 세금이 어디로 가는지 알 수 없다고 말한다. 늘어난 돈이 조정의 모든 요구를 만족시키지는 못한다.\n\n지방에서는 대표를 보내 지출을 함께 의논하자는 청원이 올라온다. 일부 대신은 납세자가 군주의 씀씀이를 묻는 선례를 두려워한다. 세금을 더 잘 거두는 문제는 이제 누가 그 돈의 쓰임을 결정할 것인가의 문제로 변했다.","choices":[{"title":"예산을 공개하고 지역 대표를 선출한다","desc":"호조의 장부를 공개하자는 요구가 지방까지 퍼졌습니다. 지역 대표를 뽑아 세입과 지출을 심의하게 하십시오. 새로운 협력을 얻는 대신 왕실의 씀씀이도 백성 앞에서 설명해야 합니다.","next":"congress","delta":[6,10,0,10,3,-10],"flags":["public_budget"],"when":null,"result":"각 지역에서 대표를 천거하거나 선출하는 절차가 마련됐다. 장부를 들여다본 대표들은 자문을 넘어 정책에 책임 있게 참여할 제도를 요구했다.\n\n대표들은 지역마다 다른 부담을 들고 왔고 장부의 숫자만으로 설명되지 않는 사정을 말했다. 궁중의 씀씀이도 질문을 피하지 못했다. 재정을 함께 보자는 결정은 군주와 대표가 어떤 권한을 가져야 하는지의 논의로 넓어졌다.","resultTitle":"호조의 문이 열리다"},{"title":"세입을 군대에 집중하고 대표 요구는 미룬다","desc":"병조는 바다가 안전하지 않으면 시장의 번영도 하루아침에 사라진다고 경고합니다. 늘어난 세입을 포대와 상비군에 우선 배정하십시오. 국방의 성과가 나기 전까지 납세자의 불만을 견뎌야 합니다.","next":"coast","delta":[-4,-6,14,3,2,8],"flags":["mobilized"],"when":null,"result":"새 세입이 병기와 훈련비에 배정됐다. 군영의 보고는 개선됐지만 대표 선출을 요구하던 상인들은 납세의 대가로 무엇을 얻었는지 묻기 시작했다.\n\n군영은 계획을 앞당길 수 있었지만 납세자들은 당장의 생활에서 이익을 느끼지 못했다. 왕실은 국방의 성과로 이 부담을 설명해야 했다. 강화된 군사력이 보고되자 조정은 연안의 긴장에 더 적극적으로 대응할 수 있게 됐다.","resultTitle":"은이 포와 군복으로 바뀌다"},{"title":"외국 차관으로 공장과 철도를 동시에 확대한다","desc":"새 공장과 철길의 이익을 계산한 계획서가 올라왔습니다. 외국 자본을 들여 여러 사업을 한꺼번에 시작하십시오. 예상한 수익이 늦어져도 이자와 상환 기일은 기다려 주지 않습니다.","next":"debt","delta":[16,0,0,10,-7,0],"flags":["loan"],"when":null,"result":"차관 계약이 체결되고 여러 공사가 동시에 시작됐다. 호조는 장래의 수입을 담보로 자금을 얻었지만 곧 돌아올 상환 일정도 장부에 적어야 했다.\n\n공사 현장에는 일자리가 늘었고 조정은 개혁의 속도를 성과로 내세웠다. 하지만 시설이 완성되기 전부터 지급해야 할 비용이 있었다. 사업의 진척과 상환 일정이 어긋나자 호조는 다음 자금을 어디서 구할지 묻기 시작했다.","resultTitle":"미래의 수입을 먼저 쓰다"}],"ending":null,"fact":null},"debt":{"id":"debt","year":1882,"title":"장부 위의 주권","story":"호조의 장부에는 아직 들어오지 않은 사업 수익과 먼저 돌아오는 상환 기일이 나란히 적혀 있다. 공사를 멈추면 이미 들인 자금과 일자리를 잃고, 계속하려면 또 다른 돈이 필요하다. 채권자는 세관의 감독권을 넘기면 지급 기한을 늘려 주겠다고 말한다.\n\n대신들은 빚을 갚지 못하는 왕조라는 평판을 걱정한다. 세관의 관리들은 조세권을 넘긴 뒤 무엇으로 다음 예산을 짤 것이냐고 되묻는다. 장래의 번영을 위해 맺은 계약이 지금 당신의 결정을 제한하고 있다.","choices":[{"title":"사업을 줄이고 국내 자금으로 채무를 정리한다","desc":"호조는 사업 일부를 접고 국내 자금을 모으면 급한 채무를 줄일 수 있다고 보고합니다. 체면보다 장부의 건전성을 택하십시오. 공사 중단의 손실을 누가 부담할지 공정하게 설명하지 못하면 국내의 불만이 커집니다.","next":"congress","delta":[-14,4,-2,-3,12,-4],"flags":["debt_paid"],"when":null,"result":"수익이 늦어지는 사업을 정리하고 국내의 자금을 모았다. 큰 지출로 급한 채무를 줄였지만 출자자와 납세자들은 같은 일이 반복되지 않도록 재정 심의를 요구했다.\n\n중단된 현장의 사람들은 일감을 잃었고 투자자들은 손실을 항의했다. 조정은 같은 일이 반복되지 않도록 지출을 감독할 절차가 필요하다는 요구를 받았다. 빚을 줄인 결정 뒤에는 재정의 책임을 누구에게 물을지라는 문제가 남았다.","resultTitle":"공사를 멈추어 지킨 권한"},{"title":"세관 관리권을 넘겨 개발 사업을 유지한다","desc":"채권자는 세관을 직접 관리하게 해 주면 대출을 연장하겠다고 제안합니다. 공사와 지급을 계속할 수 있으나 국경에서 거두는 수입을 스스로 결정할 권리는 줄어듭니다. 잠시 맡긴 권한을 되찾는 일도 계약에 묶입니다.","next":"end_concession","delta":[8,-5,0,8,-16,2],"flags":[],"when":null,"result":"상환 유예와 세관 감독을 맞바꾸는 합의가 이루어졌다. 공사는 계속됐지만 조정이 예산을 짜기 전에 외국 관리가 세입의 몫을 먼저 정하게 됐다.\n\n채권자는 약정한 수입을 먼저 확인했고 조정은 남은 몫으로 예산을 짜야 했다. 공사가 이어진다는 사실만으로 정책의 여유가 커지지는 않았다. 미래를 위해 돈을 빌린 나라는 그 미래의 세입을 결정할 권한 일부를 잃었다.","resultTitle":"세관에 놓인 다른 장부"},{"title":"채권국들을 한 회담에 불러 조건을 재협상한다","desc":"각 채권국은 서로의 특혜를 경계하고 있습니다. 이들을 한 회담에 불러 상환 일정과 관리권을 함께 협상하십시오. 경쟁을 이용할 여지는 있지만 여러 나라가 공동으로 감독하자는 요구를 낼 수도 있습니다.","next":"alliance","delta":[-6,0,0,4,3,0],"flags":["debt_talks"],"when":null,"result":"조정은 개별 협상을 멈추고 공동 회담을 제안했다. 채권국들의 다른 이해관계가 드러나자 채무 조정은 더 넓은 외교 관계의 문제로 옮겨 갔다.\n\n각국은 다른 채권자에게만 유리한 조건이 생기지 않도록 서로의 요구를 살폈다. 조정은 그 틈에서 일정을 조정할 여지를 찾았지만 어느 쪽도 손실을 쉽게 양보하지 않았다. 채무 문제는 조선의 외교 노선을 정하는 회담으로 이어졌다.","resultTitle":"빚을 둘러싼 외교"}],"ending":null,"fact":null},"unyo":{"id":"unyo","year":1875,"title":"운요호, 강화 앞바다","story":"강화의 파발이 급히 어전에 들어온다. 낯선 군함의 접근에 해안 초소가 경계를 강화했고, 현장의 장수는 어디까지 접근을 허용해야 하는지 훈령을 청한다. 주민들은 배를 띄우기를 망설이고 상인들은 조운이 끊길까 걱정한다.\n\n조정이 보는 것은 불완전한 장계 몇 장이다. 발포하면 충돌이 커질 수 있고 물러나면 상대가 더 가까이 올 수 있다. 사절을 보낼지, 포대를 움직일지, 제삼국의 중재를 구할지에 따라 다음 보고는 회담장에서 올 수도 전장에서 올 수도 있다.","choices":[{"title":"대표를 보내 조약 조건을 협상한다","desc":"연안의 장계만으로 상대의 목적을 단정하기 어렵습니다. 사절을 보내 요구를 확인하고 회담의 범위를 정하십시오. 포성을 늦출 시간을 얻겠지만 협상장에는 함대의 위압도 함께 들어올 것입니다.","next":"ganghwa","delta":[-3,0,0,3,0,-2],"flags":[],"when":null,"result":"접견 사절이 강화로 떠났다. 충돌을 억제하라는 명령이 군영에 전달되는 동안 일본 측은 개항과 재판권에 관한 조건을 제시했다.\n\n군영에는 교섭 중의 충돌을 억제하라는 훈령이 전달됐다. 사절은 상대의 의도를 모두 알지는 못했지만 적어도 요구를 글로 받아 돌아올 수 있었다. 이제 조정은 해안의 거리 대신 조약의 문구를 놓고 다투어야 했다.","resultTitle":"포성 앞에 먼저 도착한 문서"},{"title":"상륙을 저지하고 해안 포대를 전개한다","desc":"수군의 장수는 가까이 다가온 배를 방치하면 다음에는 어디까지 내줄 것이냐고 묻습니다. 상륙을 저지하고 포대를 전개하십시오. 국토를 지키겠다는 뜻은 분명해지지만 한 차례의 교전이 더 큰 동원으로 이어질 수 있습니다.","next":"ganghwa_incident","delta":[-6,4,3,0,2,4],"flags":[],"when":null,"result":"해안 군영에 상륙 저지 명령이 내려졌다. 충돌 뒤 사태를 수습하려는 교섭이 이어졌으나 배상과 책임을 둘러싼 공방이 장기적인 무력 대치로 번졌다.\n\n해안 주민들은 포대의 전개를 보며 안도와 불안을 함께 느꼈다. 현장의 충돌을 둘러싼 책임과 배상 요구가 해결되지 않으면서 병력의 긴장도 이어졌다. 조정은 한 번의 발포를 넘어 오랫동안 버틸 방법을 찾아야 했다.","resultTitle":"포대가 대답한 날"},{"title":"제삼국의 중재를 요청하고 충돌을 피한다","desc":"역관들은 제삼국에 알리면 일본도 함부로 행동하기 어려울 것이라 주장합니다. 중재를 요청하며 현장의 발포를 억제하십시오. 그러나 회답이 올 때까지 항구와 백성을 지킬 책임은 여전히 조선에 있습니다.","next":"mediation","delta":[-4,-2,0,3,0,0],"flags":[],"when":null,"result":"중재를 청하는 문서가 여러 교섭 창구로 보내졌다. 확답은 늦었고 현장의 군영은 함대를 마주한 채 군량과 탄약을 소모했다.\n\n회답을 기다리는 동안 군영은 현 위치를 지켰고 연안의 거래는 위축됐다. 어떤 국가는 관심을 보였지만 실제로 함대를 움직이겠다는 약속은 없었다. 기다릴 시간도 조선의 곡식과 비용으로 마련해야 한다는 사실이 드러났다.","resultTitle":"바다 건너에 보낸 청원"}],"ending":null,"fact":null},"mediation":{"id":"mediation","year":1876,"title":"답을 기다리는 조정","story":"중재를 청한 문서는 떠났지만 확답은 돌아오지 않았다. 역관은 우호적인 말을 전하고 군영은 소모한 군량의 수량을 적어 보낸다. 교전이 멈춘 동안에도 배를 대기시키고 병사를 먹이는 비용은 매일 쌓인다.\n\n대신들은 조금만 더 기다리면 외교가 길을 열 것이라고 말한다. 현장의 장수는 기다릴 수 있는 시간도 창고에 남은 곡식으로 정해진다고 답한다. 외부의 회답을 기다리는 동안 조선이 직접 할 일을 결정해야 한다.","choices":[{"title":"중재를 기다리며 보급 체계를 먼저 정비한다","desc":"회답만 기다리는 사이에도 군영은 곡식을 먹습니다. 지방 창고와 조운선을 연결해 보급 체계를 점검하십시오. 협상이 성사되지 않더라도 버틸 힘은 남지만, 백성에게 추가 운송과 징발을 요구해야 합니다.","next":"ganghwa_incident","delta":[-8,2,7,3,0,0],"flags":["supplied"],"when":null,"result":"군량 창고와 운송 책임자가 지정됐다. 중재가 뚜렷한 성과를 내지 못한 가운데 조선은 준비된 보급망을 갖고 장기 대치에 들어갔다.\n\n운송 인력과 군량이 이동하면서 지방에는 추가 부담이 생겼다. 대신 부대는 회답이 늦어져도 곧바로 흩어질 처지는 피했다. 외교로 얻지 못한 시간을 자체 준비로 버틸 수 있게 되었지만 긴장 자체는 해소되지 않았다.","resultTitle":"기다림을 버틸 창고"},{"title":"일본과 직접 협상한다","desc":"중재국들은 우호적인 말만 되풀이하고 있습니다. 더 기다리지 말고 일본 사절과 직접 조건을 맞대십시오. 불리한 처지를 인정하는 듯 보이더라도 협상 내용을 스스로 확인할 수 있습니다.","next":"ganghwa","delta":[-2,0,0,2,-2,0],"flags":[],"when":null,"result":"중재의 회답을 기다리는 대신 직접 회담 일정을 잡았다. 조정은 사절에게 받아들일 수 있는 조건과 끝까지 다툴 권한을 구분해 보냈다.\n\n중재에 기대던 신하들은 실망했지만 사절은 자신이 전달할 구체적인 조건을 얻었다. 조선은 직접 상대의 조문을 확인하는 자리로 돌아갔다. 시간은 일부 잃었고 이제 어떤 양보로 무엇을 지킬지 더 분명히 정해야 했다.","resultTitle":"먼 회답보다 가까운 회담"}],"ending":null,"fact":null},"ganghwa":{"id":"ganghwa","year":1876,"title":"강화도 회담","story":"회담장에서는 우호와 통상이라는 말 뒤로 서로 다른 조문이 오간다. 항구를 여는 문제에 더해 일본인의 재판, 해안의 이용, 앞으로의 교섭 방식이 논의된다. 사절은 어떤 조항을 반드시 지키고 어디에서 양보할지 당신의 훈령을 기다린다.\n\n바깥의 무력시위는 회담과 무관한 배경이 아니다. 서명을 늦추는 만큼 준비할 시간을 얻지만 상대도 압박을 늘릴 수 있다. 평화를 위해 불리한 문서에 도장을 찍을지, 조건을 다투다 결렬의 위험을 감수할지 판단해야 한다.","choices":[{"title":"불리한 조항을 받아들이고 개항한다","desc":"대신들은 지금 전쟁을 치르면 항구보다 더 많은 것을 잃을 수 있다고 아룁니다. 불리한 조항에 서명해 무력 충돌을 늦추고 시간을 사십시오. 그 시간의 값은 재판과 통상에서 조선의 권한을 제한하는 조문으로 남습니다.","next":"treaty_aftermath","delta":[8,-5,0,7,-12,0],"flags":["unequal"],"when":null,"result":"사절이 조약에 서명했다. 함대의 압박은 줄었지만 불리한 조항이 알려지자 조정에는 반대 상소가, 항구에는 피해 보고가 쌓였다.\n\n도성에서는 당장의 전투를 피했다는 안도가 돌았다. 그러나 조문을 접한 유생들은 권리의 제한을 비판했고 항구의 관리들은 새 분쟁을 어떻게 다룰지 몰라 다시 훈령을 청했다. 평화를 산 문서가 국내의 새로운 갈등을 불러왔다.","resultTitle":"도장이 마른 뒤"},{"title":"관세·재판권 문제를 놓고 협상을 계속한다","desc":"역관이 조문의 표현마다 다른 법적 뜻이 숨어 있다고 지적합니다. 관세와 재판의 권한을 구분해 수정안을 제시하십시오. 다른 나라와의 접촉이 있다면 지렛대가 되겠지만 회담이 결렬될 위험도 커집니다.","next":"revision","delta":[-5,2,0,5,3,-2],"flags":[],"when":null,"result":"사절에게 조문별 수정 훈령을 다시 내려보냈다. 회담은 길어졌고 일본 측은 조선의 요구를 뒷받침할 외교적 수단이 무엇인지 떠보기 시작했다.\n\n역관들은 문장 하나를 고치기 위해 서로 다른 해석을 대조했다. 상대는 조선이 실제로 버틸 수 있는지 확인하듯 압박을 늦추지 않았다. 수정 요구를 반복하는 것만으로는 부족했고 그것을 지탱할 외교적 근거가 필요했다.","resultTitle":"붉은 표시가 늘어난 조약문"},{"title":"조약을 거부하고 군사적 대치에 들어간다","desc":"주권을 제한하는 조문에 옥새를 찍을 수 없다는 상소가 잇따릅니다. 서명을 거부하고 대치에 대비하십시오. 명분은 선명해지지만 그 명분을 지킬 군량과 포대가 실제로 준비되어 있는지 확인해야 합니다.","next":"ganghwa_incident","delta":[-4,4,3,0,4,3],"flags":[],"when":null,"result":"회담장에서 서명이 거부됐다. 외교 문서로 주고받던 요구는 해안의 병력 이동과 압박으로 바뀌었고 조정은 장기 대치에 들어갔다.\n\n강경한 신하들은 결정을 환영했지만 호조는 전쟁 대비 비용을 다시 계산했다. 지방관들은 주민의 피난과 조운의 안전을 걱정했다. 서명으로 끝내지 않은 분쟁은 병력과 군량으로 버텨야 할 대치가 됐다.","resultTitle":"옥새를 거둔 자리"}],"ending":null,"fact":null},"revision":{"id":"revision","year":1877,"title":"다시 쓰는 조약","story":"고쳐 쓴 조문에 다시 수정 표시가 붙었다. 일본 측은 조선이 요구하는 관세와 재판권의 범위를 받아들이기 어렵다고 말한다. 역관은 다른 나라와의 접촉을 보여 줄 수 있다면 교섭의 분위기를 바꿀 여지가 있다고 보고한다.\n\n국외의 관심을 실제 약속처럼 부풀려 말할 수는 없다. 이미 오간 사절과 문서가 있는지, 그 나라가 조선 문제에 관여할 이유가 있는지를 상대도 살필 것이다. 협상을 버틸 근거를 제시할 것인지, 일부 양보로 시간을 살 것인지 정해야 한다.","choices":[{"title":"여러 나라와의 교섭을 근거로 상호 통상안을 제시한다","desc":"역관은 다른 나라와의 교섭을 보여 주면 일본도 독점적인 조건만 고집하기 어렵다고 아룁니다. 실제로 이어 온 관계를 협상장에 내놓으십시오. 아직 문서와 사절의 왕래가 없다면 빈말로 간주될 수 있습니다.","next":[{"ifAny":["german","american","american_contact","russian"],"to":"revised_treaty","result":"역관은 이미 왕래한 사절과 문서를 제시해 조선이 한 나라와만 거래할 처지가 아님을 보였다. 상대는 요구 전부를 받아들이지는 않았지만 일부 조건을 조정했다. 고친 조약문이 마련되자 회담은 서명 이후의 통상과 집행 문제로 옮겨 갔다."},{"to":"ultimatum","result":"교섭을 뒷받침할 실제 접촉이 부족하다는 점이 드러나자 상대는 조선의 제안을 압박을 피하려는 말로 받아들였다. 수정안은 거절됐고 배상과 권리에 관한 더 강한 요구가 돌아왔다. 사절은 최후통첩을 들고 도성으로 향했다."}],"delta":[-4,0,0,4,2,0],"flags":[],"when":null,"ruleHint":"외교 접촉이 있으면 수정안, 없으면 압박이 이어진다.","result":"조선 사절은 기존의 외교 접촉과 상호 통상 원칙을 근거로 수정안을 내밀었다.","resultTitle":"조문의 뒤에 선 관계"},{"title":"개항 시기와 규모를 줄이는 절충안을 받는다","desc":"전면적인 조항 수정이 막히자 상대는 개항의 시기와 범위만 조정하자고 제안합니다. 권리의 문제를 남긴 채 시행을 늦춰 대비할 시간을 얻으십시오. 조정은 부분적인 양보를 성과로 설명해야 합니다.","next":"treaty_aftermath","delta":[4,-2,0,5,-7,0],"flags":["unequal"],"when":null,"result":"개항의 시행을 늦추고 규모를 줄이는 절충안에 합의했다. 하지만 핵심적인 권리 제한은 남아 국내의 반발과 통상 피해를 해소할 수는 없었다.\n\n조정은 준비할 여유를 얻었다고 설명했지만 반대파는 시행이 늦어졌을 뿐 권리는 돌아오지 않았다고 비판했다. 항구에서는 개방에 대비한 거래와 투기가 움직였다. 절충으로 남긴 문제를 국내의 제도와 재정으로 다뤄야 했다.","resultTitle":"완전한 권리 대신 얻은 시간"},{"title":"협상을 중단하고 군사적 저항을 선택한다","desc":"더 다투어도 조문이 바뀌지 않는다는 보고가 왔습니다. 사절을 철수시키고 해안 군영에 대비를 명하십시오. 교섭으로 얻지 못한 것을 군사적으로 지킬 수 있는지 이제 장수와 백성에게 답해야 합니다.","next":"ganghwa_incident","delta":[-3,3,3,0,3,2],"flags":[],"when":null,"result":"사절이 귀환했고 해안 군영에 비상 명령이 내려졌다. 협상에서 해결하지 못한 분쟁은 장기적인 무력 충돌의 구실이 됐다.\n\n교섭을 담당하던 역관이 물러난 자리에 군영의 보고가 쌓였다. 조정은 명분을 지켰다는 평가와 전쟁을 감당할 수 있느냐는 의심을 동시에 받았다. 이제 상대의 요구를 거절한 이유를 현장에서 지탱해야 했다.","resultTitle":"돌아온 사절, 떠나는 군령"}],"ending":null,"fact":null},"revised_treaty":{"id":"revised_treaty","year":1878,"title":"수정된 통상 조약","story":"사절이 돌아와 고친 조약문을 어전에 펼친다. 모든 요구를 얻지는 못했지만 조선이 행사할 권한과 상대가 받아들인 제한이 문서로 남았다. 관리들은 이를 외교의 성과라고 보고하고 상인들은 이제 어떤 물자를 어디로 내보낼 수 있는지 묻는다.\n\n협정에 적힌 권리를 실제로 쓰려면 세관과 통역, 운송과 분쟁 처리의 능력이 필요하다. 또한 상대가 약속을 어길 때 대응할 관계도 마련해야 한다. 서명은 국정의 문제를 끝내기보다 새로운 일을 시작하게 했다.","choices":[{"title":"교역 수입을 교육과 산업에 돌린다","desc":"고친 조약은 기회를 열었을 뿐 조선의 공장과 학교를 대신 세워 주지는 않습니다. 새 교역 수입을 기술과 인재에 투자하십시오. 성과가 나기 전에는 관청과 군영이 늘어난 세입을 양보해야 합니다.","next":"ports","delta":[8,3,0,8,3,0],"flags":["revised"],"when":null,"result":"통상 수입의 일부를 교육과 산업에 돌리는 계획이 승인됐다. 항구의 거래가 늘자 새로운 일자리와 기존 업종의 피해가 함께 드러났다.\n\n관청은 새 사업의 순서를 두고 다시 다투었고 상인들은 실제 지원을 기다렸다. 합의한 조항이 저절로 장인의 생계를 지켜 주지는 않았다. 교역이 늘면서 그 성과와 손해를 어떻게 나눌지가 다음 국정의 문제가 됐다.","resultTitle":"문서의 권리를 생활의 힘으로"},{"title":"외교 관계를 넓혀 조약 이행을 지탱한다","desc":"사절은 유리한 문서도 상대가 무시하면 지킬 방법이 필요하다고 보고합니다. 교역 상대와 외교 창구를 넓혀 조약을 어길 때의 부담을 키우십시오. 다만 어느 나라도 조선의 권익만을 위해 움직이지는 않습니다.","next":"alliance","delta":[-3,2,0,5,6,0],"flags":["balanced"],"when":null,"result":"조약 이행을 여러 교섭 창구에 알리고 통상 관계를 넓혔다. 서로 다른 나라의 이해를 조정하기 위해 다자 협력의 범위를 논의하게 됐다.\n\n사절들이 교섭 창구를 넓히자 조선의 사정을 듣는 상대는 늘었다. 그러나 각국의 관심을 유지하려면 통상과 협력에서 줄 수 있는 몫도 계산해야 했다. 조약의 성과를 지키는 일은 지속적인 외교의 비용을 요구했다.","resultTitle":"서명을 지탱하는 여러 문"}],"ending":null,"fact":null},"treaty_aftermath":{"id":"treaty_aftermath","year":1878,"title":"조약 뒤의 갈등","story":"조약이 체결됐다는 소식보다 불리한 조항의 소문이 더 빠르게 퍼졌다. 조정에는 서명을 거두라는 상소가 쌓이고, 항구에서는 물품 거래와 관할권을 둘러싼 다툼이 늘어난다. 일부는 개항의 기회를 말하지만 피해를 입은 주민에게 그 기회는 아직 보이지 않는다.\n\n군부는 군대를 키운 뒤 조건을 다시 다투자고 건의한다. 강경한 유생들은 기다리는 동안 권리를 더 잃을 것이라고 반박한다. 당신은 이미 한 약속을 집행하는 군주이면서 그 약속이 낳은 피해를 책임지는 통치자이기도 하다.","choices":[{"title":"피해를 보상하고 관세·유통 제도를 정비한다","desc":"항구의 지방관은 조약을 당장 없애지 못하더라도 피해를 방치하지는 말아 달라고 청합니다. 보상과 유통 질서를 정비하고 허용된 범위의 관세 권한을 활용하십시오. 재정 부담을 감수해야 개항이 왕실만을 위한 일이 아니라는 믿음을 줄 수 있습니다.","next":"customs","delta":[-6,8,0,8,2,-3],"flags":[],"when":null,"result":"피해 조사와 보상 절차가 마련되고 유통과 징세의 허점이 점검됐다. 지원을 받은 이들은 재정이 어떻게 쓰이는지 논의할 통로도 요구했다.\n\n주민들은 조정이 피해를 인정했다는 점을 평가했지만 보상의 대상과 규모를 놓고 다툼이 생겼다. 관청이 임의로 몫을 정하지 못하게 해 달라는 청원이 뒤따랐다. 통상 문제를 수습하려던 정책은 세금과 대표권의 논의로 넓어졌다.","resultTitle":"열린 문 아래의 상처를 돌보다"},{"title":"반대 세력과 함께 조약 파기를 선언한다","desc":"반대 상소를 올리던 세력은 조약을 파기하면 군량과 인력을 모으겠다고 장담합니다. 그 지지를 받아 서명을 거두십시오. 군중의 열기가 전쟁을 지속할 보급과 지휘를 대신할 수 있는지는 별개의 문제입니다.","next":"ganghwa_incident","delta":[-5,7,5,-2,6,0],"flags":["treaty_broken"],"when":null,"result":"조정은 조약의 효력을 인정하지 않겠다고 선언했다. 국내의 환호 뒤에 일본 측의 항의와 군사적 압박이 이어졌고 분쟁은 해안으로 번졌다.\n\n국내의 강경파는 기세를 얻었지만 약속한 자금과 인력을 실제로 모으는 일은 더디었다. 상대의 항의가 강해질수록 호조와 병조의 부담도 늘었다. 조약을 거두는 순간부터 조정은 권리를 회복할 전쟁 준비까지 책임져야 했다.","resultTitle":"서명을 뒤집은 왕명"},{"title":"신식 군대에 투자해 조약 개정을 준비한다","desc":"지금 조약을 뒤집기보다 군대를 길러 다시 협상하자는 주장이 나옵니다. 신식 훈련과 무기에 예산을 배정하십시오. 새 군대에만 혜택이 돌아가면 기존 군인들은 개혁을 자신들의 생계를 빼앗는 일로 받아들일 것입니다.","next":"army_split","delta":[-6,-2,10,6,1,3],"flags":[],"when":null,"result":"신식 부대의 편성과 장비 구입이 승인됐다. 얼마 뒤 구식 군영에서 체불 급료와 차별 대우를 호소하는 탄원이 올라왔다.\n\n신식 훈련장의 변화는 조정에 개혁의 성과로 보고됐다. 그러나 구식 군인들은 같은 국가가 자신들의 급료는 해결하지 않는다고 여겼다. 대외 교섭을 위해 키운 군대가 먼저 국내의 형평 문제를 드러냈다.","resultTitle":"훗날의 교섭을 위한 군대"}],"ending":null,"fact":null},"army_split":{"id":"army_split","year":1881,"title":"두 군대, 하나의 나라","story":"군영의 두 보고서가 어전에 놓인다. 신식 부대는 새 장비와 훈련비를 청하고, 구식 군영은 밀린 급료와 줄어든 배급을 호소한다. 같은 나라의 군인이면서 누구는 새 군복을 받고 누구는 가족의 끼니를 걱정하고 있다.\n\n기존 군영을 줄이면 장부의 지출은 가벼워진다. 그러나 해산된 병사들의 급료와 생계 문제가 함께 사라지는 것은 아니다. 군제를 바꾸는 속도와 군인들이 그 변화를 받아들일 수 있는 속도가 서로 어긋나기 시작했다.","choices":[{"title":"체불 급료를 지급하고 합동 훈련을 실시한다","desc":"군인 대표는 신식 훈련에 반대하는 것이 아니라 굶으면서 버려지는 일이 두렵다고 말합니다. 밀린 급료를 먼저 지급하고 기존 군인을 합동 훈련에 참여시키십시오. 당장 많은 돈이 들지만 두 군대가 서로를 적으로 보지 않게 할 수 있습니다.","next":"coast","delta":[-10,10,8,5,0,-2],"flags":["army_united","trained"],"when":null,"result":"창고의 곡식과 급료가 구식 군영에 지급됐고 합동 훈련 명령이 내려졌다. 군인들이 복귀하면서 봉기의 고리가 끊어졌고 통합된 부대가 연안에 배치됐다.\n\n병사들은 밀린 몫을 확인한 뒤 다시 명령을 따르기 시작했다. 오래된 부대와 새 부대의 불신이 모두 사라지지는 않았지만 서로의 생존을 빼앗는다는 인식은 약해졌다. 조정은 봉기를 수습하는 대신 통합된 전력을 어떻게 쓸지 논의할 수 있었다.","resultTitle":"두 군영에 함께 돌아간 곡식"},{"title":"신식 군대만 지원하고 구식 군영을 해산한다","desc":"일부 장수는 낡은 군영을 유지하는 비용 때문에 개혁이 늦어진다고 주장합니다. 신식 부대에 자원을 모으고 구식 군영을 해산하십시오. 종이 위의 군제는 간결해져도 급료와 생계를 잃은 군인들은 도성에 남습니다.","next":"mutiny","delta":[3,-12,7,3,0,3],"flags":["army_split"],"when":null,"result":"구식 군영에 해산 명령이 전달됐다. 신식 부대는 장비를 더 받았지만 밀린 급료를 받지 못한 군인들이 모여 관청으로 향했다.\n\n해산된 군인들은 가족을 먹일 일자리와 급료를 한꺼번에 잃었다. 관청은 그들을 정리된 지출로 계산했지만 거리에는 요구를 전할 사람들이 그대로 남아 있었다. 흩어진 탄원이 모인 항의로 바뀌면서 군제 개편은 도성의 위기가 됐다.","resultTitle":"장부에서 지운 군인들"}],"ending":null,"fact":null},"mutiny":{"id":"mutiny","year":1882,"title":"군영의 봉기","story":"구식 군영을 해산한 명령 뒤로 체불 급료를 요구하는 군인들이 도성에 모였다. 관청 앞의 항의는 관리들의 가옥을 향한 위협으로 번지고, 궁궐 문을 지키는 군사들 사이에도 동요가 보인다. 당신의 개혁이 만들어 낸 불만이 이제 당신의 안전을 흔든다.\n\n측근들은 외국군을 부르면 즉시 질서를 회복할 수 있다고 주장한다. 다른 대신은 불만의 원인을 인정하지 않은 진압은 상처를 더 깊게 할 것이라고 말한다. 왕실을 지킬 방법과 다시 통치할 신뢰를 만들 방법이 꼭 같지는 않다.","choices":[{"title":"책임자를 처벌하고 군인 대표와 협상한다","desc":"도성의 관리들은 군인들이 왕조를 뒤엎기보다 억울함을 풀어 줄 사람을 찾고 있다고 보고합니다. 부패한 책임자를 처벌하고 대표를 만나십시오. 왕실이 임명한 관리의 잘못을 인정해야 하는 정치적 부담이 따릅니다.","next":"congress","delta":[-9,10,-3,6,3,-8],"flags":["negotiated_mutiny"],"when":null,"result":"책임 관리가 파면되고 군인 대표에게 급료 정리 계획이 제시됐다. 거리의 긴장은 줄었지만 군제와 재정을 누가 감독할 것인지까지 논의해야 했다.\n\n군인들은 처음에는 조정의 약속을 의심했지만 책임자가 물러나는 것을 보고 대표를 보냈다. 왕실이 잘못을 인정했다는 불만이 일부 대신들 사이에서 나왔다. 도성을 진정시킨 대가는 더 공개적인 군제와 재정 논의를 받아들이는 일이었다.","resultTitle":"궁문 밖의 목소리를 들이다"},{"title":"외국군의 개입을 요청한다","desc":"궁궐의 안전을 걱정한 측근들은 외국군만이 즉시 질서를 회복할 수 있다고 말합니다. 원병을 요청하십시오. 빠른 진압의 대가로 조정의 안위가 타국의 판단에 달리는 선례를 남기게 됩니다.","next":"protectorate","delta":[-3,-5,5,0,-12,8],"flags":["foreign_intervention"],"when":null,"result":"원병을 청하는 문서가 보내졌고 외국군이 도성의 질서 회복에 관여했다. 사태가 가라앉은 뒤에도 철군과 비용, 주둔 권한에 관한 요구는 남았다.\n\n관청의 업무는 돌아왔고 측근들은 왕실의 안전을 확보했다고 보고했다. 하지만 외국 지휘관이 철수할 조건을 논의하기 시작하자 군란보다 오래갈 문제가 드러났다. 질서를 되찾은 조정은 그 질서를 스스로 유지할 수 있는지 다시 질문받았다.","resultTitle":"궁궐을 지킨 다른 나라의 군사"}],"ending":null,"fact":null},"coast":{"id":"coast","year":1883,"title":"무장한 해안, 새로운 압박","story":"연안 군영에서 전보다 정돈된 보고가 올라온다. 병력 배치와 포의 상태, 수송 가능한 물자가 장부에 구분되어 있다. 이제 조선은 상대의 모든 요구를 즉시 받아들여야 할 만큼 무방비하지는 않다.\n\n장수들은 준비된 힘을 어떻게 쓸지 묻는다. 병력을 움직여 맞설 수도 있고, 그 존재를 배경으로 회담을 열 수도 있다. 다만 장부에 적힌 군사력과 비바람 속에서 실제로 버티는 군대는 다르다. 당신이 다음에 내릴 명령이 그 차이를 드러낼 것이다.","choices":[{"title":"군사력을 배경으로 다자 회담을 제안한다","desc":"해안의 장수들은 이제 상대가 쉽게 상륙하기는 어렵다고 보고합니다. 이 힘을 전쟁의 명분이 아닌 회담의 배경으로 삼으십시오. 군함을 움직이는 대신 사절들을 움직여 긴장을 줄일 기회입니다.","next":"alliance","delta":[-4,3,0,5,5,0],"flags":[],"when":null,"result":"포대는 경계를 유지하되 도발적인 이동은 삼갔다. 조정은 여러 교섭 상대에게 회담을 제안하며 연안에서 해결하지 못할 조건들을 외교의 의제로 옮겼다.\n\n상대 사절은 조선의 방위 상태를 확인하면서도 외교적 요구를 거두지는 않았다. 그래도 대화를 거부했을 때 치를 부담은 이전보다 커졌다. 군사 준비는 포를 쏘는 능력뿐 아니라 협상 시간을 확보하는 수단이 되었다.","resultTitle":"움직이지 않는 군대의 힘"},{"title":"보급과 요새를 점검하고 침입 저지에 나선다","desc":"장비 목록이 늘었다고 전쟁 준비가 끝난 것은 아닙니다. 군량이 포대까지 닿는지, 요새의 빈틈은 없는지 직접 점검하게 하십시오. 비용과 시간이 들지만 실전에서 견딜 준비를 갖춘 뒤 침입 저지에 나설 수 있습니다.","next":"ganghwa_incident","delta":[-7,2,5,0,3,2],"flags":["fortified","supplied"],"when":null,"result":"병조와 지방관이 수송로와 요새를 함께 점검했다. 준비를 마친 부대가 전개되자 해안의 대치는 더욱 팽팽해졌고 조정에는 확전 여부가 물어졌다.\n\n점검 과정에서 빠진 물자와 늦은 수송이 드러났고 지방관들은 보완을 독촉받았다. 병력은 이전보다 갖춰진 상태로 전개됐지만 상대도 이를 의식해 움직였다. 실전 준비가 국정의 선택지를 넓히는 동시에 확전의 결정을 눈앞에 가져왔다.","resultTitle":"명령보다 먼저 닿는 군량"}],"ending":null,"fact":null},"ganghwa_incident":{"id":"ganghwa_incident","year":1884,"title":"강화 사변","story":"해안의 충돌을 둘러싼 항의와 배상 요구가 오가며 긴장이 장기화됐다. 이 가상 연대기의 조정은 뒤에 이를 ‘강화 사변’이라 부르게 된다. 현장의 장수는 증원을, 지방관은 주민의 귀환과 어업 재개를 청한다.\n\n궁궐에서는 타협을 굴복이라 부르는 목소리와 확전을 무모하다 비판하는 목소리가 맞선다. 아직 정해지지 않은 것은 전쟁의 승패뿐 아니라 전쟁 자체를 치를 것인가이다. 회담과 동원, 휴전 중 어느 길에 국력을 걸지 정해야 한다.","choices":[{"title":"전면전을 각오하고 병력을 동원한다","desc":"현장의 교전을 수습할 조건에 양측이 합의하지 못했습니다. 병력을 모아 싸울 의지를 보이십시오. 왕명 한 장으로 군사는 움직일 수 있지만 그들을 먹이고 돌려보낼 계획은 지금부터 마련해야 합니다.","next":"war","delta":[-5,-2,6,0,3,4],"flags":["war"],"when":null,"result":"동원령이 내려지고 군영별 병력 보고가 모였다. 병조는 작전보다 먼저 군량과 수송, 지휘 체계에 대한 재가를 청했다.\n\n지방관은 군량을 모으고 가족들은 떠나는 병사를 배웅했다. 출정의 명분은 분명했지만 언제 돌아올 수 있는지 누구도 약속하지 못했다. 조정은 전쟁의 결의를 실제 보급과 지휘로 바꾸는 일을 시작해야 했다.","resultTitle":"동원령 아래의 고을"},{"title":"최후통첩을 받아 들고 협상을 다시 연다","desc":"사절이 상대의 요구를 적은 문서를 들고 돌아왔습니다. 굴복인지 협상인지 서둘러 단정하지 말고 조건을 다시 검토하십시오. 왕실의 위신과 전쟁의 피해 가운데 어느 부담을 감당할지 결정해야 합니다.","next":"ultimatum","delta":[-3,0,0,0,-2,0],"flags":[],"when":null,"result":"조정은 최후통첩의 조항을 하나씩 읽었다. 배상과 권리 양도 요구를 받아들일지, 문서를 돌려보내고 전쟁을 택할지 마지막 판단만 남았다.\n\n강경파는 문서를 받는 것부터 굴욕이라 했고 호조는 검토 없이 전쟁을 택할 수는 없다고 맞섰다. 당신 앞에는 배상 장부와 동원 보고가 함께 놓였다. 다음 재가는 교섭의 연장이 아니라 나라가 감당할 부담의 종류를 정하게 됐다.","resultTitle":"꺼내 놓은 마지막 조건"},{"title":"휴전선을 제안하고 피해부터 수습한다","desc":"지방관은 해안의 백성이 배를 띄우지 못하고 논밭을 떠나고 있다고 보고합니다. 서로의 주장을 남겨 둔 채 우선 충돌을 멈추자고 제안하십시오. 승전의 명예는 없지만 더 큰 전쟁을 피할 여지는 있습니다.","next":"armistice","delta":[-4,4,-2,0,0,-2],"flags":["ceasefire"],"when":null,"result":"현장의 병력을 물리고 충돌을 멈추는 안이 전달됐다. 상호 철수에 합의하면서 포성은 잦아들었지만 불신과 피해까지 해소되지는 않았다.\n\n일부 장수는 더 유리한 조건을 얻을 수 있었다며 아쉬워했다. 그러나 연안의 주민들은 병력 이동이 멈춘 사실을 먼저 느꼈다. 조정에는 축하할 전승보다 돌아온 사람들의 생계와 불안한 휴전을 지탱할 일이 남았다.","resultTitle":"승전 대신 돌아온 사람들"}],"ending":null,"fact":null},"ultimatum":{"id":"ultimatum","year":1885,"title":"포성 앞의 최후통첩","story":"사절이 최후통첩을 읽는 동안 어전이 조용해진다. 배상과 추가 권리 요구는 명분만으로 거절하기에도, 아무 설명 없이 수용하기에도 무겁다. 호조는 당장 지급할 수 있는 자금을 계산하고 병조는 실제 동원 가능한 병력을 헤아린다.\n\n전쟁을 피하면 굴욕과 재정 부담이 남고, 거부하면 더 큰 손실을 감수해야 할 수 있다. 서명과 동원령은 모두 당신의 이름으로 나간다. 무엇을 지키기 위해 무엇을 잃을 수 있는지 스스로 정해야 한다.","choices":[{"title":"배상 조건을 수용하고 전쟁을 피한다","desc":"호조는 배상금도 무겁지만 장기간의 전쟁은 그보다 큰 부담이 될 수 있다고 아룁니다. 요구를 받아들이고 병력을 물리십시오. 살아남은 백성을 보호하는 결정이라 해도 권리 양도와 왕실의 체면 손상은 피하기 어렵습니다.","next":"defeat","delta":[-8,-5,-2,0,-10,-4],"flags":["conceded"],"when":null,"result":"배상 조건의 수용이 통보되면서 당장의 전투 위험은 줄었다. 조정에는 전쟁 대신 배상 재원과 피해 수습을 둘러싼 어려운 장부가 남았다.\n\n군사들은 당장 출전하지 않아도 되었지만 세금을 내는 고을의 부담은 남았다. 조정은 양보가 누구를 위해 필요했는지 설명해야 했다. 나라를 지키겠다는 결정은 이제 배상과 회복의 책임을 어떻게 나누느냐로 평가받게 됐다.","resultTitle":"싸움 없이 치른 패배의 값"},{"title":"요구를 거부하고 조일전쟁에 돌입한다","desc":"신하들은 한 번의 양보가 다음 요구를 부를 것이라 경고합니다. 최후통첩을 거부하고 전쟁 준비를 명하십시오. 조정의 결의를 뒷받침할 힘이 실제 군영과 창고에 있는지 확인해야 합니다.","next":"war","delta":[-4,3,5,0,2,3],"flags":["war"],"when":null,"result":"거부의 국서가 보내지고 군영에 동원령이 전달됐다. 병조는 전쟁의 지속을 위해 무엇부터 준비할지 국왕의 결정을 기다렸다.\n\n최후통첩이 돌아가자 협상의 여지는 좁아졌고 병력 집결이 본격화됐다. 결의를 칭송하는 상소보다 더 긴 군량 명세가 올라왔다. 전쟁을 택한 국왕은 승리의 구호뿐 아니라 싸움을 지속할 방법을 재가해야 했다.","resultTitle":"돌려보낸 문서의 다음 장"}],"ending":null,"fact":null},"war":{"id":"war","year":1885,"title":"조일전쟁 · 싸움을 지속할 힘","story":"각 군영에서 동원된 병사들이 집결한다. 깃발은 모였지만 훈련 방식과 지휘 계통은 아직 다르고 군량 수송의 속도도 일정하지 않다. 출정의 열기 속에서 병조의 실무 관원들은 말과 배, 창고의 수용량을 계산하고 있다.\n\n장수들은 첫 전투에 앞서 우선순위를 물어 온다. 보급을 갖출지, 훈련을 통합할지, 지금의 기세로 바로 밀어붙일지 결정해야 한다. 전쟁을 시작하라는 명령보다 오래 버틸 군대를 만드는 명령이 더 많은 돈과 시간을 요구한다.","choices":[{"title":"군량과 수송을 먼저 확보한다","desc":"장수가 아룁니다. “포를 쏠 군사도 굶으면 진지를 버리옵니다.” 창고를 연결하고 군량선과 운송 인력을 확보하십시오. 눈에 띄는 승전 보고는 늦어지겠지만 오래 버틸 수 있는 군대를 만들 수 있습니다.","next":"battle","delta":[-8,3,8,0,0,-2],"flags":["supplied"],"when":null,"result":"군량의 적재와 호송, 창고의 책임자가 정해졌다. 부대에 식량과 탄약이 도착하면서 지휘관은 준비된 보급을 전제로 작전을 검토할 수 있게 됐다.\n\n군사들은 정해진 때에 식량이 온다는 사실에서 지휘 체계의 변화를 느꼈다. 추가 운송을 맡은 주민들의 부담도 커졌지만 병력이 보급을 찾아 흩어질 위험은 줄었다. 장수는 이제 단기적인 돌격 외의 작전도 검토할 수 있었다.","resultTitle":"총성보다 오래 버티는 것"},{"title":"훈련과 포병 지휘를 통합한다","desc":"서로 다른 군영이 각자의 명령을 따르면 새 무기도 힘을 내기 어렵습니다. 포병과 보병의 지휘를 합치고 집중 훈련을 명하십시오. 훈련 기간 동안 적의 움직임을 지켜봐야 하며 군량 부족까지 해결되는 것은 아닙니다.","next":"battle","delta":[-8,0,10,3,0,2],"flags":["trained"],"when":null,"result":"지휘 계통이 정리되고 합동 훈련이 실시됐다. 사격과 이동은 나아졌지만 장수들은 보급 상태도 함께 고려해 작전을 선택해야 한다고 보고했다.\n\n합동 훈련에서 어긋나던 신호가 정리되고 장수들은 서로의 배치를 알게 됐다. 다만 탄약과 군량이 제때 도착할지는 별도로 확인해야 했다. 훈련의 성과를 어떤 작전에서 쓸지 당신의 명령을 기다렸다.","resultTitle":"하나의 명령을 듣는 군영"},{"title":"준비를 줄이고 즉시 총공세를 명한다","desc":"성급한 승전을 바라는 이들은 적이 자리를 잡기 전에 밀어붙이자고 외칩니다. 준비 기간을 줄이고 즉시 공세를 명하십시오. 동원 비용은 아낄 수 있으나 흩어진 지휘와 빈 수송로는 전투가 시작된 뒤 고치기 어렵습니다.","next":"battle","delta":[3,-4,-5,0,0,5],"flags":["rushed"],"when":null,"result":"진격 명령이 훈련과 보급 계획보다 먼저 전달됐다. 부대는 움직였지만 지휘관에게 돌아온 보고에는 준비 미비와 병력의 피로가 섞여 있었다.\n\n일부 부대는 준비를 마쳤지만 다른 부대는 뒤처졌고 보고가 일정하게 모이지 않았다. 병사들은 출정의 열기보다 피로를 먼저 쌓았다. 다음 작전은 이렇게 줄어든 여유 위에서 선택해야 했다.","resultTitle":"너무 빨리 내려간 명령"}],"ending":null,"fact":null},"battle":{"id":"battle","year":1886,"title":"조일전쟁 · 결정적인 작전","story":"파발이 가져온 지도에 해안의 진지와 상대의 수송로가 표시된다. 바다를 건너온 군대는 보급선에 의지하고 조선군은 각지의 창고와 길에 의지한다. 어느 쪽도 병사의 의지만으로 전투를 지속할 수 없다.\n\n당신이 앞서 마련한 요새, 군량, 훈련이 이제 작전의 범위를 정한다. 준비된 조건에 맞춰 싸우면 상대를 물러나게 할 수 있지만, 갖추지 못한 능력을 명령으로 만들어 낼 수는 없다. 아래의 준비 기록과 판정 조건을 확인한 뒤 마지막 군령을 내려야 한다.","choices":[{"title":"요새를 지키며 상대의 전쟁 비용을 높인다","desc":"장수들은 바다의 적을 모두 격멸하려 하기보다 상륙을 막아 오래 머물 수 없게 하자고 건의합니다. 요새와 보급을 갖췄다면 상대의 수송 부담이 커집니다. 준비가 부족한 포대는 백성을 지키는 방패가 아니라 고립된 진지가 될 수 있습니다.","next":[{"ifAll":["fortified","supplied"],"min":{"2":55},"to":"victory","result":"적의 상륙 시도가 이어졌지만 미리 정비한 진지와 지속적인 군량 수송이 방어선을 지탱했다. 조선군은 무리하게 바다까지 추격하지 않고 상대가 머무를 비용을 높였다. 결국 상대가 병력을 물리면서 조선은 유리한 강화 조건을 제시할 기회를 얻었다."},{"ifAny":["fortified","supplied"],"min":{"2":40},"to":"pyrrhic","result":"진지는 끝내 유지됐지만 교대와 보급이 충분하지 않은 곳에서 손실이 쌓였다. 적이 물러났을 때 장수들은 승전을 보고했으나 고을의 창고와 농지는 큰 부담을 치른 뒤였다. 조정은 승리의 축하보다 재건과 부상병의 수습을 먼저 논의해야 했다."},{"to":"defeat","result":"명령은 진지를 지키라는 것이었지만 현장에서는 부족한 방어 준비와 수송의 한계가 드러났다. 일부 부대가 버텨도 끊어진 구간을 메우기는 어려웠다. 전선을 유지하지 못한 조정에 불리한 배상과 권리 양도를 요구하는 강화 조건이 전달됐다."}],"delta":[-5,-2,-3,0,0,0],"flags":[],"when":null,"ruleHint":"요새화·보급·군사 55 이상이면 큰 승리. 준비가 일부뿐이면 소모전.","result":"왕명은 성급한 추격을 금하고 요새와 수송로의 유지를 우선하도록 했다.","resultTitle":"성급히 쫓지 않는 싸움"},{"title":"훈련된 부대로 상륙군의 보급선을 차단한다","desc":"상륙군은 배로 들어오는 군량과 탄약에 의지합니다. 훈련된 부대를 움직여 그 연결을 끊으십시오. 지휘와 보급이 맞물리면 철수를 압박할 수 있으나 준비 없이 흩어진 병력은 오히려 각개격파될 위험이 있습니다.","next":[{"ifAll":["trained","supplied"],"min":{"2":60},"to":"victory","result":"같은 신호로 움직인 부대들이 적의 수송로를 압박했고 조선군의 자체 보급도 유지됐다. 상륙군은 병력을 유지하기 어려워졌고 더 큰 손실을 피하려 물러났다. 조정은 추격보다 철수와 주권 존중을 문서로 확인할 수 있는 유리한 위치를 얻었다."},{"ifAll":["trained"],"min":{"2":45},"to":"pyrrhic","result":"훈련된 부대가 수송을 방해하는 데는 성공했지만 작전을 지속할 보급과 여유가 충분하지 않았다. 조선군도 큰 손실을 입으며 싸움을 이어 갔다. 상대의 철수 뒤에 남은 것은 손쉬운 승전이 아니라 피해를 수습해야 할 고단한 평화였다."},{"to":"defeat","result":"흩어진 부대의 움직임이 맞지 않았고 적의 수송로를 계속 압박할 준비도 부족했다. 일부 공격은 성과를 냈지만 전황을 바꾸지 못한 채 손실이 늘었다. 조정은 작전을 중단하고 불리한 조건의 강화를 검토해야 했다."}],"delta":[-6,-3,-4,0,0,0],"flags":[],"when":null,"ruleHint":"훈련·보급·군사 60 이상이면 큰 승리. 일부 조건만 갖추면 소모전.","result":"훈련된 부대에 상대의 수송로를 겨냥한 명령이 내려갔다.","resultTitle":"수송로를 둘러싼 승부"},{"title":"회담을 제안하고 상호 철군을 교환한다","desc":"양측의 손실을 집계한 장계가 어전에 쌓입니다. 아직 싸울 여력이 있을 때 상호 철군을 제안하십시오. 전승의 영광을 포기한다는 비판을 받겠지만 살아 돌아올 군사와 백성의 수는 달라질 수 있습니다.","next":"armistice","delta":[-4,5,-2,0,0,-3],"flags":["ceasefire"],"when":null,"result":"군영에는 현 위치를 지키되 추가 공세를 멈추라는 명령이 전달됐다. 사절의 왕래 끝에 쌍방 철군이 합의되었고 승자 없는 휴전이 시작됐다.\n\n군영에는 승전의 기쁨보다 살아남았다는 안도와 싸움을 멈춘 데 대한 불만이 섞였다. 마을에서는 철수 소식을 듣고 돌아올 준비를 했다. 어느 쪽의 뜻도 완전히 이룬 휴전은 아니었지만 다음 희생을 막을 시간이 생겼다.","resultTitle":"끝내지 않은 전쟁을 멈추다"}],"ending":null,"fact":null},"victory":{"id":"victory","year":1887,"title":"압도적인 방어전의 승리","story":"적의 철수를 알리는 장계가 도성에 도착한다. 마을에서는 소식을 전하는 사람 주위로 군중이 모이고 장수들은 전공을 보고한다. 이번 승리는 상륙을 막고 전쟁을 지속할 상대의 부담을 키워 얻은 것이지, 바다 건너의 영토를 장악한 승리는 아니다.\n\n강화에 응할 사절의 움직임이 확인되자 조정은 유리한 조건을 문서로 남기자는 쪽과 더 밀어붙이자는 쪽으로 나뉜다. 적을 물러나게 한 준비가 원정과 점령에도 충분한지 살펴야 한다. 승리 뒤에는 싸움을 멈출 때를 정하는 또 다른 판단이 남는다.","choices":[{"title":"부산에서 철군과 상호 주권 존중을 협상한다","desc":"장수들은 적이 물러나는 지금이 요구를 문서로 남길 때라고 아룁니다. 부산에서 철군과 상호 주권 존중을 협상하십시오. 전쟁을 끝낼 수 있는 승리와 상대국을 지배할 수 있는 힘은 같지 않음을 인정하는 결정입니다.","next":"busan","delta":[10,12,3,4,16,6],"flags":["victory"],"when":null,"result":"조정은 방어전의 성과를 강화 조건으로 바꾸었다. 철군과 주권 존중을 담은 가상의 부산 조약이 맺어졌고 승리 이후의 통치 방향이 새 의제로 떠올랐다.\n\n장수들은 전공을 인정받았고 사절은 전투에서 얻은 협상력을 활용했다. 그러나 전쟁 비용을 보탠 지역과 상인들은 승전의 이익이 자신들에게도 돌아와야 한다고 말했다. 조약 뒤에는 승리를 누구의 권력과 어떤 제도로 바꿀지라는 문제가 남았다.","resultTitle":"전장의 성과를 종이에 남기다"},{"title":"군대를 멈추지 않고 원정 계획을 요구한다","desc":"승전에 고무된 장수들은 바다 건너의 거점을 쥐어야 다시는 위협받지 않는다고 주장합니다. 원정 계획을 제출하게 하십시오. 육지에서 이긴 군대가 먼바다의 수송과 점령까지 감당할 수 있는지는 아직 증명되지 않았습니다.","next":"expansion","delta":[-8,-5,4,0,4,8],"flags":["victory","expansion"],"when":null,"result":"추격을 멈추는 대신 원정 가능성을 조사하라는 전교가 내려갔다. 병조는 새로운 거점의 이익과 함께 선박·보급·현지 통치에 필요한 비용을 보고하기 시작했다.\n\n승전의 열기 속에서 원정을 반대하는 목소리는 작아졌지만 수송을 담당할 관원들은 계산을 멈추지 않았다. 국토를 방어한 병력을 바다 건너에서 유지하는 일은 다른 능력을 요구했다. 조정은 승리로 생긴 자신감과 실제 역량의 차이를 마주했다.","resultTitle":"철수하는 적을 넘어 바라본 바다"}],"ending":null,"fact":null},"pyrrhic":{"id":"pyrrhic","year":1887,"title":"상처만 남은 승리","story":"상대는 물러났지만 승전 장계와 함께 부상병 명단, 불탄 창고, 비어 있는 고을의 보고가 도착한다. 귀향한 병사들은 농기구를 잡기 전에 가족의 생계부터 확인한다. 도성의 축하와 지방의 현실 사이에는 긴 거리가 있다.\n\n군부는 희생이 컸던 만큼 다시는 이런 일을 겪지 않도록 더 강하게 무장하자고 주장한다. 피해 지역의 대표들은 이번 전쟁의 책임과 복구 비용부터 밝혀 달라고 요구한다. 당신은 승리의 명분으로 무엇을 더 요구할지, 어디서 멈출지 결정해야 한다.","choices":[{"title":"조선 평화 협약을 맺고 재건에 집중한다","desc":"승전 장계 뒤에 불탄 마을과 빈 창고의 보고가 따라옵니다. 재전을 막는 평화 협약을 우선 맺고 군대를 돌려보내십시오. 더 큰 배상을 받아야 한다는 주장보다 농사와 생계를 먼저 살피는 결정입니다.","next":"rebuild","delta":[-6,7,-8,2,6,-3],"flags":["peace"],"when":null,"result":"전쟁 재개를 막는 협약에 합의하고 동원 병력의 일부를 돌려보냈다. 조정의 관심은 적의 동향에서 무너진 마을과 복구 비용으로 옮겨 갔다.\n\n고을로 돌아온 병사들은 무너진 집과 비어 있는 밭을 확인했다. 군부의 추가 요구를 미룬 조정에는 복구를 청하는 문서가 쌓였다. 당신의 다음 명령은 적을 향하기보다 백성이 다시 살아갈 기반을 향해야 했다.","resultTitle":"축하보다 먼저 보낸 귀향 명령"},{"title":"희생에 대한 책임을 물어 대표 의회를 연다","desc":"전사자의 가족과 납세자들은 누가 전쟁을 결정하고 군량을 관리했는지 묻습니다. 대표 회의를 열어 책임과 재정을 공개하십시오. 국왕과 측근의 판단도 조사 대상에서 예외가 될 수 없습니다.","next":"congress","delta":[-4,10,-5,8,3,-10],"flags":["accountability"],"when":null,"result":"각 지역과 군영의 대표가 전쟁 비용과 피해를 들고 모였다. 희생을 설명하는 회의는 앞으로 전쟁과 예산을 누가 결정할 것인지의 논의로 이어졌다.\n\n대표들은 숫자로 집계되지 않은 가족의 손실과 징발의 부담을 말했다. 군부와 왕실은 전쟁의 명분만으로 그 질문을 막기 어려웠다. 책임을 공개하는 자리는 앞으로 국정을 결정할 권한을 나누자는 요구로 발전했다.","resultTitle":"희생을 장부 밖으로 꺼내다"},{"title":"재건을 미루고 재무장한다","desc":"군부는 피해가 컸던 이유가 무장이 충분하지 않았기 때문이라고 주장합니다. 복구보다 재무장을 앞세우십시오. 다음 전투의 준비는 빨라지지만 이미 집과 가족을 잃은 백성에게 또 한 번의 인내를 요구하게 됩니다.","next":"strong_state","delta":[-10,-10,10,0,2,8],"flags":["hardline"],"when":null,"result":"재건 예산의 일부가 군영으로 옮겨졌다. 새 병기 계획은 승인됐지만 피해 지역에서는 나라가 무엇을 지키기 위해 싸우는지 묻는 목소리가 커졌다.\n\n군영은 장비를 보충했지만 피해 지역은 지원이 늦어진 이유를 납득하지 못했다. 나라를 지키기 위한 지출이라는 설명만 반복될수록 민심과 군부의 거리는 벌어졌다. 강한 군대를 만든 선택이 내부의 통치 문제를 더 날카롭게 했다.","resultTitle":"상처 위에 쌓은 병기"}],"ending":null,"fact":null},"defeat":{"id":"defeat","year":1887,"title":"불리한 강화 조건","story":"불리한 조건을 받아들여야 한다는 보고가 어전에 올라온다. 무력으로 버티지 못했거나 더 큰 전투를 피하기 위해 양보한 결과가 이제 배상과 권리 제한의 문서로 나타났다. 관원들은 누구의 재원으로 이를 감당할지 당신의 결정을 기다린다.\n\n도성에는 왕실이 먼저 책임져야 한다는 소문과 왕조라도 보전해야 한다는 주장이 함께 돈다. 외국의 감독을 받아 안정을 살 수도 있고, 남은 자원을 백성과 다음 세대에 돌릴 수도 있다. 잃은 것을 모두 되찾을 수 없는 순간에도 무엇을 남길지는 아직 정해지지 않았다.","choices":[{"title":"배상과 피해 수습을 공개적으로 심의한다","desc":"패배의 책임을 숨긴 채 세금을 늘리면 조정의 명령은 더 이상 신뢰를 얻기 어렵습니다. 배상과 피해 장부를 공개하고 왕실도 부담을 나누십시오. 권위를 일부 내어놓더라도 다시 협력할 이유를 만들어야 합니다.","next":"rebuild","delta":[-8,10,-3,5,-5,-8],"flags":["defeated"],"when":null,"result":"배상 규모와 복구 비용이 공개됐고 왕실 지출도 심의 대상에 올랐다. 분노는 곧 사라지지 않았지만 나라를 다시 세울 부담을 나누는 논의가 시작됐다.\n\n관원과 대표들은 국가의 부담을 누구에게 먼저 돌릴지 다투었다. 왕실이 예외를 고집하지 않자 복구에 협력할 명분이 조금씩 생겼다. 신뢰가 완전히 돌아온 것은 아니지만 적어도 손실을 숨기지 않고 다룰 출발점이 마련됐다.","resultTitle":"왕실도 함께 펼친 장부"},{"title":"왕실을 보장받는 대신 외국의 감독을 수용한다","desc":"상대는 왕실을 보전하는 대신 외교와 군사에 대한 감독을 요구합니다. 왕조의 존속을 먼저 확보하십시오. 백성을 다스리는 자리는 남아도 외부의 결정을 거부할 권한은 약해집니다.","next":"end_dependency","delta":[8,-8,0,0,-16,10],"flags":[],"when":null,"result":"왕실 보장과 외국의 감독을 맞바꾼 합의가 성립했다. 궁궐의 의례는 이어졌지만 중요한 국정 문서는 외국 측의 뜻을 확인한 뒤에야 처리됐다.\n\n측근들은 왕실이 보전됐다는 사실을 구원의 증거로 내세웠다. 그러나 앞으로의 조세와 군사에 외국이 관여할 여지가 넓어졌다. 궁궐은 안정을 얻었지만 그 밖의 사람들은 나라가 누구의 뜻으로 움직이는지 더 자주 묻게 됐다.","resultTitle":"위태로운 왕조의 안식"},{"title":"학교와 언론에 남은 자원을 맡긴다","desc":"일부 신하는 지금 지키지 못한 것을 후대가 되찾으려면 사람과 글이 남아야 한다고 아룁니다. 학교와 언론, 지역의 협력에 남은 자원을 맡기십시오. 당장의 권세를 복구하기보다 다음 세대가 설 기반을 택하는 길입니다.","next":"end_legacy","delta":[-6,10,-3,12,-3,-6],"flags":[],"when":null,"result":"왕실과 군영에 남길 자금의 일부가 학교와 인쇄, 지역의 모임에 돌아갔다. 조정의 힘은 줄었지만 후대가 서로 배우고 뜻을 모을 통로가 남았다.\n\n학교에서는 지금의 일을 기록하고 배워야 할 지식을 토론하기 시작했다. 지역의 모임은 흩어진 사람들의 소식을 이어 주었다. 왕실이 당장 회복할 권력은 적었지만 다음 세대가 스스로 나라를 생각할 자리는 남았다.","resultTitle":"남길 수 있는 나라"}],"ending":null,"fact":null},"armistice":{"id":"armistice","year":1887,"title":"승자 없는 휴전","story":"현장의 병력이 물러나고 서로의 사격이 멈춘다. 조정은 승전을 알리는 교지 대신 휴전의 범위와 철수 일정을 지방에 보낸다. 파괴된 마을에서는 안도의 기색이 돌지만 주민들이 모두 돌아오지는 못했다.\n\n상대의 군사적 압력도 조선의 불신도 사라지지 않았다. 승전 뒤의 부산 조약은 이 경로에서 열리지 않는다. 대신 당신에게는 피해를 복구할지, 외교로 휴전을 지탱할지, 재전을 준비할지의 문제가 남아 있다.","choices":[{"title":"피해 마을과 농지를 먼저 복구한다","desc":"휴전 문서가 도착해도 떠난 농민이 저절로 돌아오지는 않습니다. 농지와 수로를 복구하고 종자와 식량을 지급하십시오. 군부가 요구하는 재무장 예산을 미뤄야 한다는 부담이 따릅니다.","next":"rebuild","delta":[-6,10,0,5,2,-2],"flags":[],"when":null,"result":"군영의 추가 요구를 보류하고 피해 지역에 복구 자원을 보냈다. 귀향하는 주민이 늘면서 지방의 세금과 자치에 관한 문제도 다시 논의되었다.\n\n구휼과 복구가 시작되자 돌아오는 주민이 늘었지만 고을마다 피해의 크기는 달랐다. 중앙이 정한 우선순위를 두고 지역끼리도 다툼이 생겼다. 군사적 충돌을 멈춘 뒤의 정치는 그 서로 다른 사정을 조정하는 일이 됐다.","resultTitle":"포대보다 먼저 고친 수로"},{"title":"다자 보장과 통상을 통해 휴전을 지탱한다","desc":"양측만의 약속은 정세가 바뀌면 흔들릴 수 있습니다. 여러 나라의 통상 이익을 평화 유지에 연결하십시오. 그들의 관심을 끌 수는 있어도 어느 나라의 보장도 무조건적인 보호는 아닙니다.","next":"alliance","delta":[-4,2,0,5,4,0],"flags":[],"when":null,"result":"휴전 조건을 교섭 상대들에게 알리고 통상 확대를 타진했다. 조정은 각국이 원하는 대가를 비교하며 협력의 한계를 정해야 했다.\n\n각국은 평화를 지지한다는 말과 함께 자신들이 얻을 통상 조건을 제시했다. 조정은 지원을 청하면서도 새로운 독점을 만들지 않도록 주의해야 했다. 휴전을 유지하려던 외교가 더 넓은 협력 질서의 선택으로 이어졌다.","resultTitle":"휴전문 밖의 이해관계"},{"title":"다음 전쟁을 대비해 상비군을 확대한다","desc":"장수들은 상대가 다시 돌아오기 전에 병력을 늘려야 한다고 주장합니다. 상비군과 군수 시설을 확대하십시오. 불안은 줄 수 있지만 휴전 뒤에도 동원과 징세가 계속되면 백성에게 평화의 이익은 돌아가지 않습니다.","next":"strong_state","delta":[-8,-4,12,2,0,6],"flags":[],"when":null,"result":"휴전 뒤에도 군비 지출이 줄지 않았다. 병력과 시설은 늘어났지만 징세를 견디기 어려운 지역에서 군사 우선 정책에 대한 반발이 나왔다.\n\n병사와 시설은 늘었지만 고을의 부담도 전쟁 전 수준으로 돌아가지 않았다. 주민들은 무엇이 되어야 더는 희생을 요구받지 않는지 묻기 시작했다. 조정은 재전의 가능성을 말하는 것만으로 이 불만을 풀기 어려웠다.","resultTitle":"전쟁은 멎고 동원은 남다"}],"ending":null,"fact":null},"busan":{"id":"busan","year":1888,"title":"부산 조약, 그다음의 나라","story":"부산에서 합의한 조약문이 도성에 도착한다. 철군과 상호 주권 존중을 적은 이 문서는 가상 역사 속 조선이 방어전의 승리를 외교적 성과로 바꾼 기록이다. 장수들은 포상을 기다리고 전쟁 비용을 보탠 상인과 지방은 자신들의 기여를 인정해 달라고 요구한다.\n\n높아진 왕실의 권위로 더 많은 일을 할 수 있지만, 누구의 뜻을 나라의 방향으로 삼을지는 여전히 당신의 몫이다. 대표 정치, 동맹, 군사와 산업의 집중, 해외 팽창이라는 서로 다른 청사진이 같은 어전에 놓였다.","choices":[{"title":"민주주의를 위해 대표 정치를 연다","desc":"전쟁에 곡식과 세금을 보탠 이들이 나라의 일을 함께 의논하자고 요구합니다. 지역 대표를 모아 권한과 예산을 나누십시오. 승리로 높아진 군주의 권위를 스스로 제한해야 더 넓은 정치적 기반을 만들 수 있습니다.","next":"congress","delta":[-3,12,0,10,2,-10],"flags":["democratic"],"when":null,"result":"승전의 공을 왕실에만 돌리지 않는다는 교지가 내려졌다. 각계 대표가 모이자 자문의 범위를 넘어 통치의 권한을 어떻게 나눌지가 논의되었다.\n\n대표를 보내라는 소식은 지역마다 다른 기대로 받아들여졌다. 상인은 지출을, 군인은 대우를, 지방은 징세의 공정을 이야기하려 했다. 승전의 높은 왕권을 더 넓은 협력의 제도로 바꾸는 협상이 시작됐다.","resultTitle":"함께 싸운 사람들의 정치"},{"title":"새로운 동맹을 결성한다","desc":"사절들은 한 번의 승리로 바다의 세력 관계가 영원히 바뀌지는 않는다고 경고합니다. 승전국의 지위를 활용해 새로운 협력 관계를 만드십시오. 동맹의 보호뿐 아니라 동맹이 요구할 의무까지 따져야 합니다.","next":"alliance","delta":[-4,3,3,5,5,0],"flags":["allied"],"when":null,"result":"강화 조건을 알리는 사절이 각국으로 향했다. 이전보다 유리한 지위에서 교섭이 열렸지만 상대가 바라는 항구와 군사 협력의 조건도 함께 제시됐다.\n\n각국은 이전보다 조선의 뜻을 주의 깊게 들었지만 그만큼 협력의 대가도 구체적으로 제시했다. 장수들은 동맹의 실익을 묻고 역관들은 의무의 범위를 읽었다. 좋은 위치에서 협상한다는 사실이 어려운 선택을 없애지는 않았다.","resultTitle":"승전국의 사절"},{"title":"더 강한 국가를 위해 군사·산업을 통합한다","desc":"장수와 기술 관료들은 전쟁에서 드러난 약점을 중앙에서 한꺼번에 고쳐야 한다고 말합니다. 군사와 산업 계획을 통합하십시오. 효율은 높아질 수 있으나 지방과 민간이 중앙의 필요에 얼마나 희생될지 정해야 합니다.","next":"strong_state","delta":[-6,-2,10,7,2,8],"flags":["strong"],"when":null,"result":"군수와 산업의 계획이 중앙의 통일된 지휘 아래 묶였다. 생산과 군비는 확대됐지만 동원과 세금의 부담을 둘러싼 국내 논쟁도 커졌다.\n\n여러 관청의 계획이 한곳에 모이면서 중복은 줄었지만 지방의 재량도 좁아졌다. 생산과 동원의 성과가 빨리 보이는 만큼 그 부담을 다르게 겪는 사람들의 목소리도 커졌다. 승전 뒤의 질서는 새로 커진 국가의 힘을 어떻게 통제할지 시험했다.","resultTitle":"강한 중앙의 첫 장부"},{"title":"대한의 영광을 위한 팽창을 추구한다","desc":"승전의 열기 속에서 위협을 막으려면 조선 역시 세력권을 가져야 한다는 주장이 나옵니다. 해외 거점과 원정 계획을 검토하십시오. 스스로의 독립을 지킨 나라가 다른 지역의 자율성을 침해할 위험을 떠안는 결정입니다.","next":"expansion","delta":[-7,-5,8,0,-2,10],"flags":["expansion"],"when":null,"result":"조정은 승전 뒤의 국력을 해외 진출로 연결하는 계획을 받았다. 장수들이 거점의 가치를 말하는 동안 호조는 수송과 점령의 끝나지 않을 비용을 계산했다.\n\n팽창을 주장하는 이들은 승전이 조선의 역량을 증명했다고 말했다. 하지만 국내의 기반을 더 다져야 한다는 반론도 이어졌다. 국경을 지킨 성과가 국경 밖에서 무엇을 요구할 권리를 주는지 조정은 답해야 했다.","resultTitle":"승리의 다음을 요구하는 사람들"}],"ending":null,"fact":null},"rebuild":{"id":"rebuild","year":1889,"title":"다시 세우는 마을","story":"지방에서 보낸 복구 목록에는 무너진 수로와 돌아오지 않은 주민, 거래가 끊긴 장터가 적혀 있다. 전쟁과 교섭, 국정의 혼란을 수습했다는 말만으로 밭에 종자가 생기지는 않는다. 호조가 계산한 복구 비용은 현재의 세입을 넘어선다.\n\n왕실과 유력 가문의 부담을 늘릴지, 외국 자금을 빌릴지, 지역에 권한을 나누어 회복을 맡길지 결정해야 한다. 같은 고을도 국가가 다시 명령하러 오는지, 살 길을 함께 찾으러 오는지에 따라 다르게 반응할 것이다.","choices":[{"title":"왕실 지출과 특권을 줄여 구휼 재원을 만든다","desc":"호조는 백성에게 더 거두기 전에 궁중의 지출과 면세 특권부터 줄여야 한다고 보고합니다. 왕실과 유력 가문이 복구의 몫을 먼저 부담하게 하십시오. 재원과 신뢰를 얻을 수 있지만 가까운 지지자들이 등을 돌릴 수 있습니다.","next":"congress","delta":[10,12,0,6,2,-10],"flags":["relief"],"when":null,"result":"궁중의 지출과 특권에서 마련한 재원이 구휼에 배정됐다. 부담의 공정성을 논의하던 대표들은 앞으로도 재정을 감시할 제도가 필요하다고 요구했다.\n\n특권을 잃은 가문들은 반발했지만 지역에서는 조정이 부담을 나눴다는 평가가 나왔다. 구휼의 대상과 집행을 살피려는 요구도 커졌다. 재원을 마련하는 개혁이 그 재원을 함께 감독할 대표 정치의 논의로 이어졌다.","resultTitle":"궁중에서 먼저 줄인 몫"},{"title":"외국 차관을 받아 기반 시설을 재건한다","desc":"도로와 수로를 빨리 고치려면 현재의 세입만으로는 부족합니다. 외국 자금을 빌려 복구를 앞당기십시오. 장래의 세금과 통상 수입을 담보로 삼는 순간 다음 위기는 장부에서 시작될 수 있습니다.","next":"debt","delta":[12,3,0,5,-6,0],"flags":["loan"],"when":null,"result":"차관으로 복구 공사를 시작하면서 물자와 사람의 이동이 되살아났다. 호조는 그 성과와 함께 이자와 상환 기일이 적힌 장부를 올렸다.\n\n공사 덕분에 물자의 이동이 나아졌지만 그 이익이 세입으로 돌아오는 데는 시간이 필요했다. 상환 일정은 그 속도에 맞춰 늦춰지지 않았다. 복구의 성과를 보고하던 호조는 다시 지급 계획을 수정해 올렸다.","resultTitle":"회복을 앞당긴 빚"},{"title":"지방 자치와 상업 회복을 우선한다","desc":"지방관은 도성의 일률적인 명령보다 현지 주민이 복구 순서를 정하게 해 달라고 청합니다. 지방에 권한을 나누고 상업을 회복시키십시오. 중앙의 위엄보다 각 고을이 스스로 일어설 힘을 택하는 길입니다.","next":"end_rebuild","delta":[5,10,0,8,3,-5],"flags":[],"when":null,"result":"고을마다 복구의 우선순위를 의논하게 하고 상업의 재개를 도왔다. 중앙이 모든 결정을 쥐려 하지 않자 지역의 자금과 노동이 조금씩 돌아오기 시작했다.\n\n주민들은 중앙에서 내려온 순서 대신 자신들에게 급한 수로와 길을 먼저 고쳤다. 지역 간의 차이는 남았지만 회복을 자기 일로 받아들이는 사람들이 늘었다. 국정의 힘은 모든 일을 직접 명령하는 데서가 아니라 이런 협력을 지속시키는 데서 나왔다.","resultTitle":"고을마다 다른 재건"}],"ending":null,"fact":null},"congress":{"id":"congress","year":1890,"title":"누가 나라의 주인이 되는가","story":"지역과 군영, 상업의 이해를 대표하는 사람들이 회의장에 모인다. 모두 같은 이유로 온 것은 아니다. 누군가는 예산을 알고 싶어 하고, 누군가는 전쟁과 동원의 결정에 참여하고 싶어 하며, 누군가는 통치의 책임을 법으로 정하자고 주장한다.\n\n왕실의 대신들은 의견을 듣는 자리와 권한을 나누는 자리는 다르다고 선을 긋는다. 그러나 초대한 사람들의 말을 듣기만 하고 돌려보내면 기대는 실망으로 바뀔 것이다. 당신은 군주의 뜻을 전달할 기구를 만들 것인가, 군주의 뜻도 제한할 제도를 만들 것인가?","choices":[{"title":"헌법으로 군주와 대표 의회의 권한을 나눈다","desc":"대표들은 군주를 몰아내기보다 누구도 법 위에 서지 못하게 하자고 제안합니다. 군주의 권한과 의회의 예산·입법 권한을 헌법에 적으십시오. 왕명이 관습과 위엄만으로 법을 넘어설 수 없게 되는 결정입니다.","next":"constitution","delta":[-3,10,0,12,3,-14],"flags":["constitution"],"when":null,"result":"군주와 대표 기구의 권한을 나눈 헌법이 공포됐다. 그러나 군비와 특권을 줄이는 첫 예산안 앞에서 군부와 구귀족의 반발이 터져 나왔다.\n\n헌법의 조항을 관청의 실제 업무에 옮기자 곧 권한의 경계가 문제 됐다. 특히 군비와 특권을 줄이는 예산은 강한 반발을 불렀다. 문서를 공포한 당신은 이제 그 문서가 불편한 순간에도 효력을 갖는지 보여 줘야 했다.","resultTitle":"왕명에도 그어진 선"},{"title":"왕정 폐지 여부를 제헌 회의에 맡긴다","desc":"일부 대표는 국정의 책임이 세습되어야 하는지부터 물어야 한다고 주장합니다. 왕정의 존폐를 제헌 회의의 의제로 허용하십시오. 이는 관청 하나를 바꾸는 일이 아니라 자신과 왕실의 통치 근거를 심판에 올리는 결정입니다.","next":"republic","delta":[-5,8,-3,12,2,-20],"flags":["republic"],"when":null,"result":"국왕은 제헌 회의가 왕정의 존폐까지 논의하도록 허용했다. 격론 끝에 공화정 수립이 결의되었지만 군대와 반대파가 새 질서를 받아들일지는 별도의 과제로 남았다.\n\n왕조의 존속을 당연하게 여겼던 관원들은 충격을 받았다. 공화정을 지지하는 이들도 군대와 지방이 새 체제를 어떻게 받아들일지 우려했다. 제헌 회의의 결정 이후에는 권력을 실제로 넘기는 절차가 가장 어려운 과제로 남았다.","resultTitle":"왕관을 의제로 올린 회의"},{"title":"자문만 허용하고 최종 결정은 군주가 내린다","desc":"보수적인 대신들은 국정이 분열되지 않으려면 마지막 판단은 임금 한 사람에게 있어야 한다고 아룁니다. 대표들에게 건의할 자리는 주되 결정권은 넘기지 마십시오. 기대했던 참여가 자문에 그치면 개혁을 지지하던 이들도 실망할 것입니다.","next":"strong_state","delta":[3,-5,5,4,0,10],"flags":["royal_council"],"when":null,"result":"대표 기구는 자문에 한정되고 최종 결정은 군주에게 남았다. 국정은 중앙의 명령으로 움직였지만 참여를 바랐던 세력의 불신도 커졌다.\n\n대표들은 의견을 냈지만 결과가 달라지지 않는다는 불만을 품었다. 군주는 결정을 빠르게 내릴 수 있었으나 그 집행에 필요한 자발적 협력을 잃을 위험도 커졌다. 중앙이 강해진 만큼 불만을 다룰 통로가 더욱 중요해졌다.","resultTitle":"말할 자리는 있고 결정할 자리는 없다"}],"ending":null,"fact":null},"constitution":{"id":"constitution","year":1892,"title":"헌법의 첫 시험","story":"헌법이 공포된 뒤 처음 편성한 예산안에서 분쟁이 터진다. 의회가 군비와 특권성 지출을 줄이자 장수들은 나라의 안전을 모르는 결정이라고 반발한다. 구귀족들은 오랫동안 보장받은 몫을 한 번의 표결로 바꿀 수 없다고 말한다.\n\n왕실에 예외를 허락해 달라는 청원이 몰려온다. 헌법을 지킨다는 말은 바로 이처럼 불편한 순간에도 권한의 경계를 인정하는 일이다. 한 번만 비상대권을 쓰면 조용해질 수 있지만 그 한 번이 새 체제의 실제 규칙이 될 수 있다.","choices":[{"title":"의회의 조사와 법에 따라 분쟁을 해결한다","desc":"장수들이 군비 삭감을 거부하며 예외를 요구합니다. 의회의 조사와 법이 정한 절차를 따르게 하십시오. 왕실이 중재를 명분으로 법을 넘어서면 갓 세운 헌법은 첫 위기에서 무너집니다.","next":"end_constitution","delta":[-5,8,-3,10,5,-4],"flags":[],"when":null,"result":"군부의 청원은 의회의 심의와 법정 절차로 넘겨졌다. 군주도 예외를 만들지 않자 예산과 지휘의 분쟁은 점차 제도 안에서 다뤄지기 시작했다.\n\n불리한 결정을 받은 이들은 불만을 거두지 않았지만 군주에게 예외를 청하는 길은 좁아졌다. 대신 증거와 예산, 조문을 놓고 다투어야 했다. 나라를 다스리는 방식이 한 사람을 설득하는 일에서 제도 안에서 책임을 묻는 일로 옮겨 갔다.","resultTitle":"첫 예외를 허락하지 않다"},{"title":"비상대권으로 의회를 정지한다","desc":"측근들은 지금의 혼란이 끝날 때까지만 의회를 멈추자고 건의합니다. 비상대권으로 결정을 다시 궁궐에 모으십시오. 오늘의 임시 조치가 내일도 필요하다는 주장을 막을 장치는 약해집니다.","next":"strong_state","delta":[3,-12,7,-7,0,12],"flags":["emergency"],"when":null,"result":"의회가 정지되고 비상 명령으로 예산이 집행됐다. 당장의 저항은 눌렸지만 헌법의 보장보다 군주의 판단과 군대의 협력이 국정을 좌우하게 됐다.\n\n측근들은 질서가 돌아왔다고 보고했지만 정지된 의회가 언제 다시 제 권한을 행사할지는 불분명했다. 군대의 협력이 국정의 핵심이 되자 그 요구를 거절하기도 어려워졌다. 헌법의 첫 위기는 중앙집권을 되살리는 계기가 됐다.","resultTitle":"임시라는 이름의 권력"}],"ending":null,"fact":null},"republic":{"id":"republic","year":1892,"title":"왕관 이후의 권력","story":"제헌 회의가 왕정을 대신할 공화정의 틀을 의결했다. 문서가 작성됐지만 관청의 인장과 군영의 충성, 각 지방의 명령 체계는 하루아침에 바뀌지 않는다. 왕실에 충성하던 사람들은 새 체제에서 자신들의 자리가 있는지 불안해한다.\n\n권력을 이양하는 마지막 과정에서 당신은 반대자를 정치 안에 남길지, 질서를 이유로 군부에 전권을 맡길지 결정해야 한다. 왕관을 없애는 일과 한 사람의 자의적인 지배를 없애는 일이 같지 않다는 사실이 드러나는 순간이다.","choices":[{"title":"반대파의 참여를 보장하고 군대를 민간 통제에 둔다","desc":"왕정에 충성한 군인과 반대파를 모두 배제하면 새 나라는 시작부터 적을 안게 됩니다. 참여의 길을 열고 군대의 명령권을 민간 정부에 두십시오. 불편한 반론을 견뎌야 권력 이양이 새 지배자의 교체에 그치지 않습니다.","next":"end_republic","delta":[-6,10,-3,12,3,-10],"flags":[],"when":null,"result":"새 제도에 반대한 이들에게도 합법적인 참여가 허용됐다. 군대는 민간의 예산과 명령에 따르도록 재편되었고 권력 이양은 점진적으로 제도에 뿌리를 내렸다.\n\n반대 세력이 정치를 통해 요구를 표현하자 새 체제의 논쟁은 시끄러워졌다. 그러나 군대를 동원하지 않고 다툴 수 있는 자리가 있다는 사실은 중요했다. 민간의 예산과 명령 아래 들어간 군대는 특정 세력보다 제도에 복종할 기반을 얻었다.","resultTitle":"다른 의견을 남겨 둔 권력 이양"},{"title":"과도 군사정부에 질서 유지를 맡긴다","desc":"혼란을 우려한 군 지휘관들은 질서가 잡힐 때까지 정치를 맡겠다고 합니다. 과도 군사정부에 전권을 주십시오. 무장한 통치자가 언제 권력을 돌려줄지 강제할 수단은 부족합니다.","next":"end_military","delta":[4,-8,10,-6,0,6],"flags":[],"when":null,"result":"군 지휘관들이 과도 정부의 핵심 직책을 맡았다. 질서 유지를 이유로 정치 활동이 제한됐고 민간으로 권력을 넘기는 시점은 계속 미뤄졌다.\n\n군부는 혼란이 끝나지 않았다는 이유로 정치적 통제를 계속했다. 왕정에서 벗어난 기쁨 뒤에 권력을 되돌려 받을 방법이 없다는 우려가 커졌다. 왕관은 사라졌지만 나라의 방향을 정하는 권한은 다시 좁은 집단에 모였다.","resultTitle":"질서를 맡긴 손"}],"ending":null,"fact":null},"alliance":{"id":"alliance","year":1890,"title":"동맹인가, 새로운 의존인가","story":"각국 사절의 제안서가 한자리에 모였다. 조선의 안정을 바란다는 말 뒤에는 항구와 교역, 병력과 영향력에 관한 서로 다른 계산이 붙어 있다. 어떤 나라는 제한적인 협력을, 어떤 나라는 더 깊은 군사적 관계를 원한다.\n\n군사적 지원은 고립의 불안을 줄일 수 있지만 그 대가로 어떤 전쟁과 의무를 떠안게 될지도 살펴야 한다. 당신이 지키려는 것은 외국의 우호 그 자체인가, 아니면 그 우호 속에서도 남아 있어야 할 조선의 결정권인가?","choices":[{"title":"항구·지휘권을 지키는 제한적 방어 협력을 맺는다","desc":"사절들은 지원을 받더라도 항구와 군령권을 넘기는 조항만은 막아야 한다고 보고합니다. 협력의 대상을 방어에 한정하십시오. 문서가 성립해도 동맹국이 더 큰 희생을 요구할 때 다시 거절할 용기가 필요합니다.","next":"alliance_test","delta":[-4,3,8,4,5,0],"flags":["limited_alliance"],"when":null,"result":"항구의 관할과 군령권을 남겨 둔 제한적 방어 협정이 체결됐다. 몇 해 뒤 동맹국은 조선의 방어와 관계없는 분쟁에 지원을 요청했다.\n\n사절들은 협정에 명시한 권한을 성과로 보고했다. 그러나 우호 관계가 깊어지자 상대는 문서 밖의 협력도 기대하기 시작했다. 조선과 직접 관계없는 분쟁에 대한 지원 요청이 도착하면서 협정의 한계가 실제로 시험받았다.","resultTitle":"함께 막을 적, 각자 정할 전쟁"},{"title":"어느 진영에도 가담하지 않고 무장 중립을 추진한다","desc":"어느 진영의 전쟁에도 끌려가지 않으려면 중립이 필요하다는 주장이 나옵니다. 대외 선언과 자체 방위를 함께 준비하십시오. 중립은 약속만으로 완성되지 않으며 항구를 원하는 함대 앞에서 시험받을 것입니다.","next":"neutrality","delta":[-6,3,5,4,5,0],"flags":["neutral"],"when":null,"result":"조정은 군사적 중립을 알리고 방위 체계를 정비했다. 그러나 외국 함대가 항구의 군사 이용을 요구하면서 선언을 행동으로 지킬 순간이 찾아왔다.\n\n중립을 알린 문서는 각국에 전달됐고 군영은 그 원칙을 집행할 준비를 점검했다. 하지만 상대가 이를 존중할지는 선언하는 쪽이 결정할 수 없었다. 항구의 군사적 이용을 요구하는 함대가 나타나자 조선은 말과 능력의 거리를 확인하게 됐다.","resultTitle":"어느 편도 되지 않겠다는 선언"},{"title":"강국의 상주 군대와 전면적 보호를 받아들인다","desc":"한 강국의 확실한 보호를 받는 편이 복잡한 균형 외교보다 안전하다는 의견이 우세합니다. 상주 군대와 전면적인 보호를 허용하십시오. 외부의 위협은 줄어들 수 있지만 독자적인 외교와 군사 정책의 공간도 함께 줄어듭니다.","next":"end_dependency","delta":[8,-5,8,0,-18,6],"flags":[],"when":null,"result":"주둔과 보호의 조건이 받아들여졌다. 왕실은 안정을 얻었지만 다른 나라와의 교섭이나 군사 정책을 결정할 때 후원국의 뜻을 먼저 확인해야 했다.\n\n측근들은 군사적 불안을 줄였다고 평가했고 군영은 당장의 지원을 반겼다. 그러나 외국의 동의 없이 할 수 있는 일이 하나씩 줄었다. 국왕의 명령은 더 안전한 환경에서 내려졌지만 그 명령이 닿을 수 있는 영역은 좁아졌다.","resultTitle":"보호가 정한 국정의 범위"}],"ending":null,"fact":null},"alliance_test":{"id":"alliance_test","year":1893,"title":"동맹국의 전쟁 요청","story":"동맹국의 사절이 새로운 문서를 들고 온다. 앞서 맺은 방어 협정을 상기시키며 조선의 국경과는 관계없는 분쟁에 병력과 군량을 보내 달라고 요청한다. 그들은 이번의 협력이 장래의 도움을 보장할 것이라고 말한다.\n\n외교 담당자는 거절 뒤의 냉대를 걱정하고 병조는 먼 전장을 지원할 수송 능력을 계산한다. 협정에 적힌 한계를 실제로 지키려면 좋은 관계를 잠시 불편하게 만들 각오가 필요하다. 한때 선택한 동맹이 이제 당신에게 선택의 값을 묻는다.","choices":[{"title":"방어 협정의 범위를 근거로 참전을 거절한다","desc":"동맹국은 우의를 말하지만 사절이 가져온 요청은 협정의 방어 범위를 넘어섭니다. 문서의 한계를 근거로 참전을 거절하십시오. 보복과 냉대를 감수하더라도 조선의 군사를 어디에 보낼지 스스로 결정하는 선례를 남깁니다.","next":"end_alliance","delta":[-4,7,-2,4,8,-2],"flags":[],"when":null,"result":"조정은 협정의 조문을 들어 원정 참여를 거절했다. 외교적 불편은 남았지만 동맹이 조선의 군사를 마음대로 움직일 수 없다는 경계가 세워졌다.\n\n일부 관원은 다음 지원이 줄어들 것을 우려했고 동맹국의 사절은 실망을 감추지 않았다. 조정은 그 비용을 감수하며 문서에 정한 한계를 반복해 설명했다. 협력은 남았지만 조선의 군사와 세입이 무조건 제공되는 것은 아니라는 선이 세워졌다.","resultTitle":"우호를 지키며 거절하다"},{"title":"원정군을 보내 동맹의 신뢰를 얻는다","desc":"외교를 맡은 대신은 이번에 돕지 않으면 조선이 위기에 처할 때도 외면당할 수 있다고 말합니다. 원정군을 보내 관계를 유지하십시오. 먼 전장의 성패와 무관하게 비용과 전사자의 책임은 조정에 돌아옵니다.","next":"end_entangled","delta":[-12,-10,-10,2,-5,4],"flags":[],"when":null,"result":"원정군이 파견되고 군량과 자금이 해외로 흘러갔다. 동맹국의 감사와 함께 도착한 것은 병력 손실과 추가 지원을 요청하는 문서였다.\n\n도성에는 우의를 확인하는 답신이 도착하고 지방에는 돌아오지 못한 병사의 소식이 전해졌다. 지원이 길어질수록 다른 국내 사업의 예산은 밀렸다. 외교적 신뢰를 얻기 위한 선택이 국내의 신뢰를 설명해야 하는 문제로 돌아왔다.","resultTitle":"감사의 국서와 부상병 명단"}],"ending":null,"fact":null},"neutrality":{"id":"neutrality","year":1894,"title":"중립을 시험하는 함대","story":"외국 함대가 항구를 군사적으로 사용하게 해 달라는 요구를 보낸다. 사절은 잠시 필요한 편의일 뿐이라 설명하지만, 다른 나라들은 이미 조선이 어느 편에 서는지 주시하고 있다. 한 번 허용한 예외는 중립 선언의 의미를 바꿀 수 있다.\n\n군영은 방어 태세를 보고하고 역관은 교섭의 여지를 살핀다. 선언의 문구보다 지금까지 마련한 군사력과 자주성이 중요해졌다. 강하게 거절할지, 군사 이용 대신 통상의 이익을 제안해 긴장을 낮출지 판단해야 한다.","choices":[{"title":"무력시위를 억제하며 입항을 거절한다","desc":"항구를 한 번 군사 기지로 내주면 다른 나라가 조선의 중립을 믿지 않을 것입니다. 경계를 유지하며 입항을 거부하십시오. 준비된 방위력과 외교적 자율성이 없다면 거부의 말만으로 함대를 돌려세우기 어렵습니다.","next":[{"min":{"2":55,"4":55},"to":"end_neutral","result":"군영이 준비된 방어 태세를 보이고 사절이 일관된 조건을 제시하자 상대는 요구를 강행할 비용을 계산해야 했다. 조선은 항구의 군사적 사용을 허용하지 않은 채 위기를 넘겼다. 중립 선언은 이번에 실제로 집행된 원칙으로 기록됐다."},{"to":"end_concession","result":"사절은 거절의 뜻을 전했지만 이를 뒷받침할 군사력이나 자주성의 여유가 부족했다. 압박이 길어지자 조정은 항구 사용권을 양보하며 당장의 충돌을 피했다. 선언문에 남은 중립과 현장에서 행사할 수 있는 권한 사이의 차이가 드러났다."}],"delta":[-5,4,-2,0,2,0],"flags":[],"when":null,"ruleHint":"군사 55·자주 55 이상이면 중립 유지, 부족하면 압박에 굴복한다.","result":"조정은 군사적 사용을 허용할 수 없다는 답신을 보내고 해안 경계 태세를 유지했다.","resultTitle":"입항 요구 앞의 원칙"},{"title":"군사 사용 대신 민간 통상 확대를 중재한다","desc":"통상을 맡은 관리들은 군함의 거점 대신 상선의 교역 이익을 제안하자고 말합니다. 상대가 무력시위보다 거래에서 얻을 몫을 보게 하십시오. 타협으로 긴장을 낮출 수 있으나 통상에서 추가 양보를 요구받을 수 있습니다.","next":"end_trade","delta":[8,3,0,5,-3,0],"flags":[],"when":null,"result":"군사적 사용 대신 민간 통상의 확대가 제안됐다. 일정한 경제적 양보로 갈등을 낮췄고 조정은 원정과 진영 대립보다 교역의 기반을 넓히는 방향으로 나아갔다.\n\n상대에게 얻을 수 있는 경제적 몫을 제시하자 군사적 충돌의 유인은 줄었다. 조선은 양보한 조건을 관리해야 했지만 항구를 전쟁의 거점으로 내주는 일은 피했다. 통상으로 긴장을 낮추는 방식이 이후 국정의 방향이 됐다.","resultTitle":"군함 대신 상선의 이익"}],"ending":null,"fact":null},"strong_state":{"id":"strong_state","year":1892,"title":"강한 국가의 가격","story":"관청에는 군수 생산과 징세, 동원에 관한 수치가 이전보다 빠르게 모인다. 중앙의 명령은 강해졌지만 지방의 청원에는 피로가 짙다. 장수들은 더 큰 예산을 요구하고 호조는 그것을 마련할 백성의 여력을 걱정한다.\n\n군대와 산업을 키우는 일은 어느 지점에서 끝나는가. 늘어나는 국력을 교육과 민생으로 돌릴지, 반대 세력을 눌러 군사 우선을 유지할지, 새로운 원정의 기반으로 쓸지 정해야 한다. 강한 국가가 누구를 위해 존재하는지에 대한 질문이 어전에 올라왔다.","choices":[{"title":"군비에 상한을 두고 민생·교육에 투자한다","desc":"호조는 군비가 계속 늘면 군대를 먹이는 백성부터 지칠 것이라 경고합니다. 지출에 상한을 두고 교육과 민생에 몫을 돌리십시오. 장수들의 반발을 누르고 국가의 힘이 지킬 대상을 다시 정하는 결정입니다.","next":"end_strength","delta":[-4,10,0,10,4,-5],"flags":[],"when":null,"result":"군비의 증가에 한도가 설정되고 학교와 민생에 예산이 배정됐다. 군대의 요구가 늘 우선하지 않게 되면서 자강의 목적도 방어와 사회의 유지로 좁혀졌다.\n\n군영은 원하는 만큼의 증액을 얻지 못했지만 사회가 지탱할 수 있는 예산을 논의하게 됐다. 교육과 생계에 자원이 돌아가면서 주민들이 협력할 이유도 넓어졌다. 국방을 사회 전체의 기반과 함께 보는 방향이 자리 잡기 시작했다.","resultTitle":"힘을 기르는 사람들에게"},{"title":"반대 운동을 진압하고 군사 우선 정책을 고수한다","desc":"강경한 신하들은 전쟁의 위험 앞에서 반대 운동은 사치라고 주장합니다. 집회와 비판을 억누르고 군사 우선 정책을 유지하십시오. 군영은 강해지겠지만 충성의 말이 많아지는 만큼 실제 불만은 드러나기 어려워집니다.","next":"end_military","delta":[-5,-14,10,-3,0,10],"flags":[],"when":null,"result":"반대 운동이 진압되고 군영의 요구가 예산을 이끌었다. 공개적인 비판은 줄었으나 국가의 힘을 통제할 민간의 통로도 좁아졌다.\n\n도성의 거리는 조용해졌지만 불만을 합법적으로 전할 기구는 약해졌다. 관원들은 나쁜 소식을 올리기를 더 조심하게 됐다. 조정이 강한 통치를 보고받는 동안 그 통치가 초래한 비용은 보고서 밖에 쌓였다.","resultTitle":"들리지 않는 반대"},{"title":"군비를 원정으로 돌려 해외 진출을 추진한다","desc":"늘어난 병력과 군수 시설을 해외 진출에 쓰자는 계획이 올라옵니다. 군비의 성과를 원정으로 증명하게 하십시오. 국경 안의 방위를 위해 만든 체제가 타국의 땅을 다스리는 비용까지 견딜지는 알 수 없습니다.","next":"expansion","delta":[-6,-5,5,0,-2,6],"flags":["expansion"],"when":null,"result":"해외 거점과 원정에 관한 조사가 명령되었다. 군부는 진출의 이익을 내세웠지만 보급과 현지 통치에 관한 비용은 기존 군비 계획을 넘어섰다.\n\n새로운 계획이 올라올수록 지원해야 할 선박과 시설의 목록도 길어졌다. 병력을 밖으로 내보내면 국내의 방위와 재정이 어떻게 달라질지 따져야 했다. 군비를 늘린 결정은 이제 그것을 왜, 어디에 쓸지라는 질문으로 돌아왔다.","resultTitle":"방어의 장부에 적힌 원정"}],"ending":null,"fact":null},"expansion":{"id":"expansion","year":1893,"title":"대한의 영광을 위해","story":"해외 거점과 영향력을 넓히자는 보고가 올라온다. 지도 위의 항구는 작지만 그곳을 확보하고 지키는 데 필요한 선박과 군량, 행정 인력의 목록은 길다. 원정을 주장하는 이들은 지금 물러나면 다른 강국이 먼저 차지할 것이라고 말한다.\n\n상인과 일부 대신은 거래로 얻을 수 있는 이익을 굳이 점령의 부담으로 바꿀 필요가 있는지 묻는다. 무엇보다 그 땅에 사는 사람들이 조선의 군대를 어떻게 받아들일지는 조정이 정할 수 없다. 방어를 위해 키운 힘을 국경 밖에 쓰려는 순간 새로운 책임이 생긴다.","choices":[{"title":"무력 확장 대신 통상과 기술 교류에 집중한다","desc":"상인과 일부 대신들은 군대로 얻은 거점보다 거래를 통해 얻은 시장이 오래갈 수 있다고 말합니다. 원정의 열기를 누르고 기술과 통상을 넓히십시오. 눈에 보이는 영토의 성과를 요구하던 이들은 국왕이 기회를 놓쳤다고 비판할 것입니다.","next":"end_trade","delta":[8,8,-3,10,4,-6],"flags":[],"when":null,"result":"원정 계획이 중지되고 사절과 상인의 활동에 지원이 돌아갔다. 조정은 거점을 무력으로 다스리는 부담 대신 거래와 기술 교류의 이해관계를 선택했다.\n\n군부 일부는 국왕이 기회를 놓쳤다고 비판했다. 대신 상인과 기술자들은 원정 대신 교류의 지원을 얻었다. 조선은 눈에 보이는 세력권보다 지속적으로 관리해야 할 통상 관계를 국가의 성과로 삼게 됐다.","resultTitle":"거점을 차지하지 않고 넓히는 길"},{"title":"해외 거점을 확보하기 위한 원정을 강행한다","desc":"군부는 해외 거점을 선점하지 않으면 다시 강국에 둘러싸일 것이라고 주장합니다. 원정과 거점 확보를 명하십시오. 그곳에 사는 사람에게 조선군이 구원자가 아니라 침입자로 보일 가능성까지 책임져야 합니다.","next":"occupation","delta":[-14,-8,-6,0,-4,10],"flags":["expedition"],"when":null,"result":"원정군이 파견되어 거점을 확보했다. 승전의 보고가 올라온 뒤에는 수송비 증가와 현지 주민의 저항, 추가 병력을 청하는 장계가 이어졌다.\n\n현지 주민에게 조선군의 주둔은 새로운 검문과 징발을 뜻했다. 그 반발을 누르는 데 필요한 병력이 늘면서 처음 예상한 보급 계획은 부족해졌다. 조정은 얻은 거점보다 그곳을 유지할 비용을 더 자주 보고받기 시작했다.","resultTitle":"지도에서 보이지 않던 사람들"}],"ending":null,"fact":null},"occupation":{"id":"occupation","year":1895,"title":"점령지에서 돌아온 보고","story":"거점을 확보했다는 첫 장계 뒤로 수송비와 주둔비의 청구가 이어진다. 현지 주민은 군정의 징발에 반발하고 일부 물자의 운송도 막힌다. 지도에는 조선의 영향력으로 표시된 곳이 현장에서는 군사를 계속 보내야만 유지되는 지역이다.\n\n강경파는 이미 치른 희생을 생각하면 철수할 수 없다고 주장한다. 호조는 바로 그 희생 때문에 더 이상의 동원이 어렵다고 답한다. 당신은 손실을 인정하고 멈출 것인가, 지난 결정을 정당화하기 위해 다음 손실도 감수할 것인가?","choices":[{"title":"철군과 배상을 협상하고 내정으로 돌아온다","desc":"현지의 보고는 더 많은 병력을 보내도 저항의 이유가 사라지지 않을 것이라 말합니다. 철군과 배상을 협상하고 소모를 멈추십시오. 국왕이 앞선 판단의 잘못을 인정해야 하지만 손실이 더 커지는 것은 막을 수 있습니다.","next":"end_rebuild","delta":[-8,7,-5,5,3,-10],"flags":[],"when":null,"result":"철군 일정과 배상이 협상되었다. 군대가 돌아오자 조정은 원정의 책임과 남은 재원을 살피며 국내의 회복에 힘을 돌렸다.\n\n원정을 주장했던 이들은 체면의 손상을 말했지만 호조는 끝없이 늘던 지출을 줄일 수 있게 됐다. 돌아온 병사와 피해를 감당한 주민을 돌보는 일이 남았다. 당신은 지난 판단을 되돌릴 수는 없어도 손실이 더 커지는 것은 멈추었다.","resultTitle":"돌아오는 군대와 남은 책임"},{"title":"병력과 세금을 더 동원해 점령을 유지한다","desc":"강경파는 여기서 물러나면 이미 치른 희생이 헛된 일이 된다고 주장합니다. 추가 동원과 징세로 점령을 계속하십시오. 과거의 손실을 정당화하려는 결정이 새로운 손실을 끝없이 요구할 수 있습니다.","next":"end_overreach","delta":[-12,-14,-8,-4,-8,8],"flags":[],"when":null,"result":"추가 병력과 세금이 동원되었다. 점령지의 저항과 국내의 불만이 동시에 커지면서 원정은 국력을 과시하는 수단이 아니라 소모하는 부담이 되었다.\n\n추가 동원은 짧은 안정 뒤에 다시 지원 요청으로 돌아왔다. 국내의 납세자는 지쳐 갔고 현지의 저항은 점령이 계속되는 한 사라지지 않았다. 원정은 끝낼 수 있는 사업이 아니라 계속 먹여 살려야 할 부담으로 굳어졌다.","resultTitle":"지난 희생을 위한 다음 희생"}],"ending":null,"fact":null},"end_dependency":{"id":"end_dependency","year":1898,"title":"보호 아래 남은 왕좌","story":"궁궐의 의례는 예전처럼 이어진다. 관원들은 당신의 재가를 기다리고 지방에는 여전히 왕명이 내려간다. 그러나 중요한 외교와 군사, 재정 문서는 외국 측의 뜻을 확인한 뒤에야 처리된다. 왕실을 보전한 합의가 통치의 한계를 함께 정해 놓았다.\n\n상인들은 질서가 회복됐다는 사실을 반기면서도 계약과 조세의 결정이 어디에서 나오는지 살핀다. 일부 유생과 젊은 관원은 나라를 다시 스스로 다스릴 방법을 찾기 시작한다. 왕좌는 남았지만 당신이 남긴 다음 시대의 과제는 그 왕좌보다 큰 결정권을 되찾는 일이 됐다.","choices":[],"ending":true,"fact":null},"end_concession":{"id":"end_concession","year":1898,"title":"성장의 그늘, 잃어버린 권리","story":"부두에서는 여전히 짐이 내려지고 공장에서는 물건이 나온다. 겉으로 보이는 거래와 생산은 이어지지만 항구나 세관에 관한 중요한 결정을 내릴 때 조선 정부는 외국의 계약과 요구를 먼저 살펴야 한다. 눈앞의 위기를 넘긴 대가가 장래의 정책에 남았다.\n\n관원들은 늘어나는 거래 규모를 성과로 적고, 납세자들은 그 이익 가운데 얼마가 나라에 남는지 묻는다. 조선은 변화를 멈추지는 않았지만 성장의 속도와 자율성의 크기가 함께 늘지 않는다는 현실을 마주한다. 후대의 개혁은 이 빼앗긴 여지를 다시 넓히는 일에서 시작될 것이다.","choices":[],"ending":true,"fact":null},"end_legacy":{"id":"end_legacy","year":1898,"title":"다음 세대의 불씨","story":"학교와 인쇄소, 지역의 모임에 자원이 남았다. 그곳의 사람들은 지금의 실패와 외세의 압박을 글로 기록하고 서로 다른 고을의 소식을 나눈다. 그 활동이 당장 국권을 되돌려 주지는 않지만, 침묵 속에서 흩어지는 것과는 다른 미래를 준비한다.\n\n당신의 통치는 모든 위기를 막아 낸 치세로 기록되지는 않을 것이다. 대신 다음 세대는 배울 자리와 토론할 말, 함께 일할 관계를 물려받는다. 되찾을 나라의 모습을 상상하고 준비하는 일은 이제 왕명 밖에서도 이어진다.","choices":[],"ending":true,"fact":null},"end_rebuild":{"id":"end_rebuild","year":1898,"title":"전쟁 뒤에 다시 세운 나라","story":"장계의 첫머리에서 군사 이동보다 수로의 복구와 장터의 재개가 자주 보이기 시작한다. 고을마다 회복 속도는 다르고 피해가 단번에 사라지지도 않는다. 그래도 주민들은 다음 징발을 피할 곳보다 돌아가 경작할 땅을 이야기한다.\n\n당신은 더 넓은 세력권이나 더 큰 위신 대신 살아남은 사회의 기반을 택했다. 중앙이 모든 일을 정하지 않는 만큼 지방의 조정과 책임도 중요해졌다. 이후의 역사는 전쟁에서 얻은 명예보다 평화를 지탱할 세입과 신뢰를 어떻게 키우느냐에 달려 있다.","choices":[],"ending":true,"fact":null},"end_constitution":{"id":"end_constitution","year":1898,"title":"헌법 아래의 왕관","story":"군비와 특권을 둘러싼 분쟁이 왕실의 한마디가 아니라 의회와 법이 정한 절차에서 다뤄지기 시작한다. 반대는 사라지지 않았고 회의는 때로 오래 지연된다. 그러나 마음에 들지 않는 결정이라는 이유만으로 군주나 군대가 절차를 건너뛰기는 어려워졌다.\n\n당신의 권한은 줄었지만 통치가 한 사람의 판단에만 달려 있던 위험도 줄었다. 이 가상 연대기의 조선은 왕관을 남긴 채 그 왕관의 한계를 정한 나라로 나아간다. 다음 세대가 물려받는 것은 완성된 번영이 아니라 잘못을 고칠 수 있는 제도다.","choices":[],"ending":true,"fact":null},"end_republic":{"id":"end_republic","year":1898,"title":"왕관 없는 새 나라","story":"왕실이 독점하던 결정의 자리에 민간 정부와 대표 기구가 들어선다. 반대파도 합법적인 정치에 참여하고 군대는 예산과 명령을 민간으로부터 받도록 재편된다. 새로운 제도에 익숙하지 않은 관원들은 시행착오를 겪지만 권력의 이양은 공문서와 실제 업무 속에서 진행된다.\n\n왕관이 사라졌다고 갈등이 끝난 것은 아니다. 지역과 계층의 이해를 조정하고 책임자를 바꾸는 일이 앞으로의 정치를 채울 것이다. 당신이 마지막으로 남긴 결정은 어느 한 후계자의 권세보다 권력을 맡기고 되돌려 받을 수 있는 원칙이었다.","choices":[],"ending":true,"fact":null},"end_military":{"id":"end_military","year":1898,"title":"군대가 지배하는 국가","story":"군영의 요구는 예산에서 우선순위를 얻고, 질서를 해친다는 이유로 정치적 반대가 제한된다. 관청의 명령은 빨라졌지만 불만이 공개적으로 전달될 통로는 줄었다. 보고서는 안정과 충성을 말해도 그 밖의 마음까지 보여 주지는 않는다.\n\n국가가 키운 병력과 생산 능력은 군부의 권력을 지탱하는 기반이 됐다. 외부의 위협을 막는 능력과 내부의 통치를 정당화하는 능력이 같은 것으로 취급되기 시작한다. 이 경로의 조선은 강해졌지만 그 힘의 방향을 바꿀 시민의 자리는 좁아졌다.","choices":[],"ending":true,"fact":null},"end_alliance":{"id":"end_alliance","year":1898,"title":"자율성을 지킨 동맹","story":"참전 거절 뒤 동맹국의 문서는 한동안 차가워졌다. 지원과 교역을 둘러싼 불편한 협의도 남았다. 그러나 조정은 협력의 문을 닫지 않은 채 방어 협정의 범위와 조선의 군령권을 분명히 했다.\n\n장수들은 군사를 어디에 보낼지 외국의 요청만으로 결정되지 않는다는 사실을 확인했다. 사절들은 이제 우호의 말뿐 아니라 조문과 한계를 근거로 협상한다. 당신이 남긴 외교의 성과는 모든 나라의 호의가 아니라 필요할 때 거절할 수 있는 자율성이었다.","choices":[],"ending":true,"fact":null},"end_entangled":{"id":"end_entangled","year":1898,"title":"동맹의 전쟁에 묶이다","story":"원정군이 떠난 뒤 군량과 수송비의 청구가 이어진다. 동맹국은 감사를 전하지만 부상병과 전사자의 가족을 돌보는 일은 조선의 고을과 관청에 남는다. 끝날 것으로 예상한 지원은 전황이 바뀔 때마다 추가 요구로 돌아온다.\n\n군사적 고립을 피하려 맺었던 관계가 이제 국내의 예산과 병력 배치를 제약한다. 조정은 우호를 유지하는 비용을 설명해야 하고 백성은 자신들의 희생이 어느 나라의 안전을 위한 것인지 묻는다. 협력의 한계를 그어 두지 못한 선택이 오래 이어지는 의무가 됐다.","choices":[],"ending":true,"fact":null},"end_neutral":{"id":"end_neutral","year":1898,"title":"무장 중립의 길","story":"항구를 군사적으로 내주지 않은 채 위기를 넘겼다. 준비된 군사력과 외교적 자율성이 선언을 지탱했고 사절들은 조선의 중립을 가벼운 말로만 대하기 어려워졌다. 민간의 거래는 계속되지만 어느 나라의 군대에도 같은 원칙이 적용된다.\n\n중립을 한 번 지켰다고 그 비용이 사라지지는 않는다. 방위와 외교에 필요한 인력과 재정을 계속 마련해야 하며 다음 위기에서는 다시 시험받을 것이다. 이 가상 역사의 조선은 다른 나라의 전쟁을 자신의 운명으로 받아들이지 않을 여지를 얻었다.","choices":[],"ending":true,"fact":null},"end_trade":{"id":"end_trade","year":1898,"title":"대포보다 교역을 택한 나라","story":"국정의 문서에서 원정과 점령의 계획 대신 시장과 기술, 항로와 분쟁 조정의 비중이 커진다. 사절과 상인, 학생이 바다를 건너고 그들이 가져온 지식과 이해관계가 조정의 새 의제가 된다. 거래가 늘어도 경쟁과 불평등은 남지만 모든 갈등을 군대로 풀려 하지는 않는다.\n\n당신은 국력을 쌓는 목적을 넓은 세력권보다 지속적인 교류에 두었다. 앞으로의 통치는 외국의 요구와 국내의 피해를 조정하는 능력에 달려 있다. 조선의 영향력은 깃발을 꽂은 땅보다 서로의 이익을 연결한 관계 속에서 자라게 된다.","choices":[],"ending":true,"fact":null},"end_strength":{"id":"end_strength","year":1898,"title":"자강으로 향한 힘","story":"군영의 요구가 무조건 승인되던 관행에 제동이 걸린다. 교육과 민생에 예산이 돌아가자 장수들은 반발하지만 호조는 오래 감당할 수 있는 군비의 범위를 계산하기 시작한다. 국방의 기반을 군인뿐 아니라 세금을 내고 물자를 만드는 사회 전체에서 찾게 됐다.\n\n새 정책의 성과는 승전 장계처럼 한날에 도착하지 않는다. 기술을 익힌 사람과 버틸 수 있는 재정, 다시 협력하려는 주민이 시간을 두고 늘어날 것이다. 당신은 강한 국가의 목표를 끝없는 동원이 아니라 스스로를 유지할 능력에 두었다.","choices":[],"ending":true,"fact":null},"end_overreach":{"id":"end_overreach","year":1898,"title":"제국의 꿈, 소진된 나라","story":"점령지를 유지하기 위한 증원과 징세가 되풀이된다. 현지의 저항은 가라앉지 않고 국내에서는 빈 군량 창고와 늘어난 부담에 대한 탄원이 쌓인다. 더 많은 자원을 보내야 지난 희생이 헛되지 않다는 주장이 다음 희생의 이유가 된다.\n\n지도에 표시한 세력권은 넓어졌지만 조정이 자유롭게 쓸 수 있는 병력과 재정은 오히려 줄었다. 국력을 증명하려던 원정이 국력을 묶어 두는 일이 된 것이다. 당신이 남긴 제국의 꿈은 다음 통치자가 먼저 정리해야 할 빚과 분쟁으로 기록될 것이다.","choices":[],"ending":true,"fact":null}};
const LABELS=['국고','민심','군사','개혁','자주','왕권'];
const FLAG_NAMES={fortified:'해안 요새화',supplied:'군량·수송 확보',trained:'통합 훈련',german:'독일 접촉',american:'미국 수교',american_contact:'미국 교섭',russian:'러시아 접촉',army_united:'군대 통합',unequal:'불평등 조약',victory:'방어전 승리',constitution:'입헌 선택',republic:'공화정 선택',lease:'항구 사용권 양도',lease_revoked:'사용권 회수',loan:'외국 차관',balanced:'균형 외교'};
const SAVE_KEY='joseon-branch-v2';const OLD_KEY='joseon-crossroads-v1';
const initial=()=>({node:'start',year:1873,stats:[72,55,35,20,65,62],flags:[],history:[],pending:false});
let state=initial(),seen=new Set(['start']),showMap=false,showAll=false,zoom=.8,storageOK=true,notice='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function paragraphs(value){return String(value).split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('')}
function matches(rule,s){return(!rule.ifAll||rule.ifAll.every(f=>s.flags.includes(f)))&&(!rule.ifAny||rule.ifAny.some(f=>s.flags.includes(f)))&&(!rule.min||Object.entries(rule.min).every(([i,v])=>s.stats[i]>=v))}
function resolve(choice,s){return typeof choice.next==='string'?{to:choice.next,result:null}:choice.next.find(r=>matches(r,s))}
function applyChoice(s,index){const node=NODES[s.node];if(s.pending||node.ending||!Number.isInteger(index)||!node.choices[index])return false;const choice=node.choices[index];const route=resolve(choice,s);if(!route||!NODES[route.to])throw Error('Invalid branch');const before=[...s.stats];s.stats=s.stats.map((v,i)=>Math.max(0,Math.min(100,v+choice.delta[i])));s.flags=[...new Set([...s.flags,...choice.flags])];const to=NODES[route.to];const nextYear=Math.max(to.year,s.year+1);s.history.push({node:s.node,year:s.year,choice:index,to:route.to,nextYear,delta:s.stats.map((v,i)=>v-before[i]),resultTitle:choice.resultTitle||choice.title,result:route.result?`${choice.result}\n\n${route.result}`:(choice.result||to.story)});s.pending=true;return true}
function advance(s){if(!s.pending)return false;const last=s.history.at(-1);s.node=last.to;s.year=last.nextYear;s.pending=false;return true}
function restore(raw){if(!raw||raw.version!==2||!Array.isArray(raw.decisions)||raw.decisions.length>80||typeof raw.pending!=='boolean'||!Array.isArray(raw.seen)||raw.seen.some(id=>typeof id!=='string'||!NODES[id]))throw Error('Invalid save');const restored=initial();for(let i=0;i<raw.decisions.length;i++){const d=raw.decisions[i];if(!d||d.node!==restored.node||!Number.isInteger(d.choice)||!applyChoice(restored,d.choice))throw Error('Invalid history');if(i<raw.decisions.length-1||!raw.pending)advance(restored)}if(raw.pending&&!raw.decisions.length)throw Error('Invalid pending');return restored}
function snapshot(){return{version:2,decisions:state.history.map(h=>({node:h.node,choice:h.choice})),pending:state.pending,seen:[...seen]}}
try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const data=JSON.parse(raw);state=restore(data);seen=new Set(['start',...data.seen,...state.history.flatMap(h=>[h.node,h.to]),state.node])}else if(localStorage.getItem(OLD_KEY)){notice='새 분기형 이야기입니다. 기존 버전의 저장은 보존되며, 이번 버전은 1873년부터 새로 시작합니다.'}}catch(e){notice='저장된 진행을 읽지 못해 새 회차로 시작합니다.'}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(snapshot()));storageOK=true}catch{storageOK=false}document.getElementById('save-note').textContent=storageOK?' · 이 기기에 자동 저장됨':' · 저장할 수 없습니다. 창을 닫으면 이번 진행이 사라질 수 있습니다.'}
function choose(index){if(!applyChoice(state,index))return;const h=state.history.at(-1);seen.add(h.node);seen.add(h.to);save();render(true)}
function goNext(){if(!advance(state))return;seen.add(state.node);save();render(true)}
function startOver(){state=initial();notice='';document.getElementById('confirm').close();save();render(true)}
function render(focus=false){const node=NODES[state.node];const last=state.history.at(-1);const over=node.ending&&!state.pending;const visited=state.history.map(h=>h.node);if(!state.pending)visited.push(state.node);let body=`<div class="chapter">${over?'도달한 결말':'당신의 역사'}<span></span>${over?'회차 종료':`${state.history.length+(state.pending?0:1)}번째 사건`}</div><h1 tabindex="-1">${esc(node.title)}</h1><div class="story narrative">${paragraphs(node.story)}</div>`;
if(state.pending){body+=`<section class="result" aria-label="선택 결과"><p class="eyebrow">당신의 명령 이후</p><h2>${esc(last.resultTitle||node.choices[last.choice].title)}</h2><p class="order-record">내린 명령 · ${esc(node.choices[last.choice].title)}</p><div class="narrative result-story">${paragraphs(last.result)}</div><div class="deltas">${last.delta.map((v,i)=>v?`<span class="delta ${v>0?'positive':'negative'}">${LABELS[i]} ${v>0?'+':''}${v}</span>`:'').join('')}</div><div class="transition"><p class="eyebrow">이어지는 ${NODES[last.to].ending?'결말':'사건'} · ${last.nextYear}</p><strong>${esc(NODES[last.to].title)}</strong><br><button class="primary" id="next">${NODES[last.to].ending?'결말 확인':'이 사건으로 진행'} →</button></div></section>`}
else if(over){body+=`<p class="context">${state.history.length}번의 결정으로 이 결말에 도달했습니다. 수교 상대·국내 정책·전쟁 준비에 따라 다른 사건과 결말을 만날 수 있습니다.</p><div class="actions"><button class="primary" id="again">다른 역사 시작하기</button><button class="small" id="ending-map">내 분기표 보기</button></div>`}
else{body+=`<p class="context">${state.node==='battle'?'작전 조건은 선택 직전의 수치와 준비 기록으로 판정합니다. 조건과 결과는 공개되며 무작위로 결정되지 않습니다.':'어전에 올라온 방책입니다. 어느 명분을 세우고, 누구의 부담을 감수하게 할지 결정하십시오.'}</p><div class="choices">${node.choices.map((c,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span><strong>${esc(c.title)}</strong><small class="proposal">${esc(c.desc)}</small>${c.ruleHint?`<small class="rule-hint">판정 조건 · ${esc(c.ruleHint)}</small>`:''}</span></button>`).join('')}</div><p class="hint">선택 즉시 적용 · 현재 기기·브라우저에 자동 저장</p>`}
body+=`<details><summary>이번 회차의 선택 기록 · ${state.history.length}개</summary>${state.history.length?state.history.map(h=>`<div class="history-entry"><strong>${h.year} · ${esc(NODES[h.node].title)}</strong><p>${esc(NODES[h.node].choices[h.choice].title)}</p><p>→ ${esc(NODES[h.to].title)}</p><details class="log-narrative"><summary>${esc(h.resultTitle||'결과 다시 읽기')}</summary><div class="narrative">${paragraphs(h.result)}</div></details></div>`).join(''):'<p>첫 선택을 내리면 기록이 시작됩니다.</p>'}</details><details><summary>역사와 가상의 구분</summary><p>${esc(node.fact||'이 사건의 시기·선택·결과는 대체 역사 게임을 위한 창작입니다. 다른 경로에서 이 사건에 합류하면 발생 연도도 지나온 시간에 맞춰 조정됩니다.')}</p><p>실제 역사에서 운요호 사건은 1875년, 강화도 조약은 1876년에 일어났습니다. 게임의 조기 수교, 원산 항구 소요, 강화 사변, 조일전쟁, 부산 조약과 정치 체제 변화는 실제 사건의 재현이 아닙니다.</p><p><a href="https://contents.history.go.kr/front/hm/view.do?levelId=hm_115_0010" target="_blank" rel="noopener noreferrer">우리역사넷 — 실제 강화도 조약 읽기 ↗</a></p></details>`;
document.getElementById('notice').textContent=notice;
document.getElementById('app').innerHTML=`<div class="layout"><aside><p class="eyebrow">${over?'이 경로의 마지막 해':'갈라지는 연대기'}</p><span class="year">${state.year}</span><p class="era">${over?'당신이 남긴 나라':'조선 · 대체 역사의 한 장면'}</p><div class="stats">${LABELS.map((l,i)=>`<div><div class="stathead"><span>${l}</span><strong>${state.stats[i]}</strong></div><div class="track" role="meter" aria-label="${l}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.stats[i]}"><div class="fill ${state.stats[i]<25?'low':''}" style="width:${state.stats[i]}%"></div></div></div>`).join('')}</div><p class="side-note">현재 준비와 관계</p><div class="chips">${state.flags.filter(f=>FLAG_NAMES[f]).map(f=>`<span class="chip">${FLAG_NAMES[f]}</span>`).join('')||'<span class="hint">아직 결정된 정책이 없습니다.</span>'}</div><p class="side-note">수치는 정책의 누적 효과입니다. 전쟁·중립 판정에는 군사력과 준비 기록이 함께 쓰입니다. 결말은 수치의 합계가 아닌 선택한 경로로 결정됩니다.</p><p class="hint">발견한 사건 ${seen.size} / ${Object.keys(NODES).length}</p></aside><article>${body}</article></div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));const next=document.getElementById('next');if(next)next.onclick=goNext;const again=document.getElementById('again');if(again)again.onclick=()=>document.getElementById('confirm').showModal();const endMap=document.getElementById('ending-map');if(endMap)endMap.onclick=()=>toggleMap(true);if(showMap)renderMap();if(focus){document.querySelector('h1').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function targets(node){return [...new Set(node.choices.flatMap(c=>typeof c.next==='string'?[c.next]:c.next.map(r=>r.to)))]}
