ay:grid;gap:12px;margin-top:24px}.choice{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:18px 22px;display:grid;grid-template-columns:28px 1fr;gap:12px;transition:background .2s,border-color .2s}.choice:hover:not(:disabled){background:#223b43;border-color:var(--gold)}.letter{color:var(--gold);font-family:Georgia,serif;font-size:22px}.choice strong{font-size:17px;font-weight:600}.choice small{display:block;color:var(--muted);font-size:14px;line-height:1.6;margin-top:5px}.hint{font-size:13px;color:var(--muted)}.primary{border:0;border-radius:4px;background:var(--gold);color:#17252a;padding:13px 24px;font-weight:700;margin-top:12px}.result{border:1px solid var(--gold);padding:25px;background:#1d3035;border-radius:5px}.deltas{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.delta{font-size:14px;padding:3px 10px;background:#101f25;border-radius:3px}.negative{color:#ffab98}.positive{color:#bfe0b8}details{border-top:1px solid var(--line);margin-top:28px;padding-top:16px}summary{cursor:pointer;color:var(--gold)}details p,details li{font-size:14px;color:var(--muted)}a{color:var(--gold)}.history-entry{padding:12px 0;border-bottom:1px solid var(--line)}.history-entry strong{color:var(--ink)}footer{max-width:1200px;margin:auto;padding:20px 32px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.progress{height:3px;background:#284049;margin-top:22px}.progress div{height:100%;background:var(--gold)}dialog{max-width:440px;background:var(--card);color:var(--ink);border:1px solid var(--gold);padding:28px;border-radius:6px}dialog::backdrop{background:#000a}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){header{padding:16px 20px}.sub{display:none}main{padding:25px 20px 40px}.layout{grid-template-columns:1fr;gap:26px}.year{font-size:46px}.era{display:inline;margin-left:15px}.stats{grid-template-columns:re </style></head><body><header><div class="brand"><span class="seal">朝鮮</span>조선, 갈림길</div><div class="sub">당신의 선택으로 쓰는 또 하나의 역사</div><button class="small" id="restart">처음부터</button></header><main id="app"></main><footer>역사 기반 가상 시뮬레이션 · 수치·대사·선택의 결과는 게임을 위한 창작입니다. 실제 역사를 단일한 선택의 결과로 설명하지 않습니다.<span id="save-note"></span></footer><dialog id="confirm"><h2>새로운 역사를 시작할까요?</h2><p>이 기기에 저장된 현재 진행이 초기화됩니다.</p><div class="actions"><button class="primary" id="confirm-reset">새로 시작</button><button class="small" id="cancel-reset">돌아가기</button></div></dialog><script>
'use strict';
const labels=['국고','민심','군사','개혁','자주','왕권'];
const C=(title,desc,delta,result,flag=null,req=null)=>({title,desc,delta,result,flag,req});
const sources={start:['고종의 생애','https://contents.history.go.kr/mobile/kc/view.do?code=kc_age_40&levelId=kc_n400200'],treaty:['강화도 조약','https://contents.history.go.kr/front/hm/view.do?levelId=hm_115_0010'],army:['임오군란','https://contents.history.go.kr/mobile/kc/view.do?code=kc_age_40&levelId=kc_i403200'],coup:['갑신정변의 정령','https://contents.history.go.kr/front/hm/view.do?levelId=hm_116_0100'],empire:['대한제국과 근대화','https://contents.history.go.kr/front/ht/view.do?levelId=ht_003_0010'],people:['독립협회와 만민공동회','https://contents.history.go.kr/front/kc/printViewPopup.do?levelId=kc_i401700'],hague:['헤이그 특사','https://contents.history.go.kr/front/kc/printViewPopup.do?levelId=kc_i403600']};
const events=[
[1873,'제1장 · 닫힌 문 앞에서','이제, 그대의 조선이다','대원군이 물러났다. 친정을 시작한 당신 앞에 텅 빈 곳간과 서로 다른 상소가 놓인다. 한쪽은 왕실의 권위를, 다른 쪽은 백성의 생계를, 또 다른 쪽은 바다 너머의 변화를 말한다. 첫 교지를 내려야 한다.','고종은 1873년 흥선대원군의 퇴진 이후 친정을 시작했다.','start',[
C('궁중 지출을 줄이고 지방 수탈을 조사한다','민심과 재정을 다진다. 왕실과 유력 가문의 반발을 감수한다.',[12,12,0,3,0,-10],'백성은 감찰관의 파견을 반긴다. 왕실은 줄어든 지출에 불만을 드러내지만, 장부에는 여유가 생겼다.','audit'),
C('박규수 등 개화론자의 의견을 듣는다','국외 정보를 모으고 통역 인재를 기른다.',[-8,0,0,16,6,-4],'역관들이 가져온 보고서가 어전에 쌓인다. 새로운 세계를 이해할 첫 창이 열렸다.','learning'),
C('측근을 등용하고 왕실 친위 세력을 강화한다','왕권과 군사를 높이지만 민심과 국고가 약해진다.',[-8,-8,8,0,0,16],'당장의 명령은 더 빠르게 전달된다. 그러나 조정 밖에서는 인사가 편중됐다는 말이 돈다.','court')]],
[1875,'제1장 · 닫힌 문 앞에서','강화 앞바다의 포성','일본 군함 운요호가 연안에 접근했다. 무력 충돌은 곧 외교 문제로 번진다. 바다를 지킬 힘이 부족한 지금, 어떻게 대응할 것인가?','1875년 운요호 사건을 계기로 일본은 조선에 개항을 압박했다.','treaty',[
C('연안 방비를 강화하며 교섭 창구를 연다','병력을 보강하고 시간을 확보한다.',[-12,3,12,3,4,0],'해안에 병력을 배치하고 접견 준비를 명했다. 협상이 시작되지만 군사적 격차는 여전하다.','defense'),
C('충돌을 피하고 사절을 통해 정세를 파악한다','개혁 역량을 높이지만 저자세라는 비판을 받는다.',[-4,-5,0,10,-5,3],'보고는 풍부해졌지만 사절이 돌아오기 전까지 연안의 불안은 가시지 않는다.'),
C('교섭을 거부하고 무력 대응을 명한다','왕권을 과시하지만 군사적 손실이 따른다.',[-10,4,-12,-3,3,10],'강경한 교지가 전국에 내려졌다. 충돌에 대비하는 비용과 병력 손실이 누적된다.')]],
[1876,'제1장 · 닫힌 문 앞에서','문을 여는 값','일본 사절이 조약을 요구한다. 항구 개방뿐 아니라 재판권과 연안 측량 문제도 걸려 있다. 문을 열어도, 닫아도 대가가 따른다.','강화도 조약은 1876년 체결됐다. 영사재판권과 해안 측량 허용 등 불평등한 조항이 포함되었다.','treaty',[
C('조약을 수용하고 통상 준비에 집중한다','전쟁 위험을 낮추고 교역을 시작하나 자주성이 약해진다.',[8,-5,0,12,-14,0],'항구가 열리고 새로운 물자가 들어온다. 그러나 외국인에 대한 재판권의 제약은 무거운 짐으로 남았다.','open'),
C('통역·법률 인재를 동원해 조항 수정을 요구한다','사전 학습이 필요하다. 협상 비용을 감수한다.',[-10,3,0,8,-4,2],'학습해 둔 조약 지식을 토대로 불리한 조항을 다툰다. 가상 역사에서 일부 양보를 얻었지만 완전한 평등 조약에는 이르지 못했다.','negotiated',[3,30]),
C('체결을 미루고 해안 방어에 자원을 쏟는다','단기적 자주성을 지키지만 재정과 개혁이 지연된다.',[-16,0,10,-6,8,4],'서명은 연기됐다. 그 시간을 버티기 위한 군비가 곳간을 빠르게 소모한다.','delay')]],
[1880,'제2장 · 개화의 그늘','새로운 관청, 오래된 장부','외교와 군사, 기술을 다룰 새 조직이 필요하다. 하지만 모든 사업에 돈을 쓸 수는 없다. 무엇부터 바꿀 것인가?','1880년 통리기무아문이 설치되었고, 1881년 조사 시찰단과 영선사가 파견되었다.','start',[
C('기술 교육과 해외 시찰에 투자한다','장기적인 개혁 역량을 쌓는다.',[-12,3,3,17,3,0],'기술자와 학생들이 돌아와 새 기계와 제도를 설명한다. 변화는 느리지만 자체 역량이 쌓인다.','school'),
C('세금과 회계부터 정비한다','국고를 회복하는 대신 유력 가문의 지지를 잃는다.',[18,5,0,6,0,-8],'누락된 세원을 찾아 장부에 올렸다. 특권을 잃은 이들이 조정에서 저항한다.','tax'),
C('외국 고문에게 군사 개편을 맡긴다','빠른 군사 강화와 외국 의존이 함께 찾아온다.',[-8,-3,18,7,-9,4],'새 훈련이 시작됐다. 그러나 핵심 업무를 맡긴 고문에게 발언권이 생긴다.','advisor')]],
[1881,'제2장 · 개화의 그늘','두 군대의 밥상','신식 군대 양성 계획이 올라왔다. 구식 군인들의 급료는 밀려 있다. 새 무기를 들일 예산과 오래된 빚을 갚을 예산이 한 장부에서 다툰다.','1881년 별기군이 설치됐다. 구식 군인에 대한 차별과 급료 체불은 이듬해 군란의 배경이 되었다.','army',[
C('체불 급료부터 갚고 함께 훈련한다','큰 비용으로 군인들의 불만을 줄인다.',[-16,12,7,5,0,-2],'구식 군인에게 급료가 돌아갔다. 신식 훈련의 규모는 작아졌지만 군영의 불신이 줄었다.','paid'),
C('신식 군대에 우선 투자한다','군사·개혁이 빠르게 오르지만 기존 군영이 소외된다.',[-8,-13,16,10,0,3],'신식 소총이 빛난다. 담장 밖 구식 군인들은 비어 있는 쌀자루를 바라본다.','elite'),
C('군제 개편을 늦추고 재정을 비축한다','국고를 아끼지만 군사·개혁이 뒤처진다.',[12,-5,-5,-5,0,3],'새 군대 계획을 접었다. 군영의 구조적 문제는 해결되지 않은 채 남았다.')]],
[1882,'제2장 · 개화의 그늘','군영에서 올라온 함성','군인과 도성 주민들의 불만이 표면으로 드러난다. 궁궐에서는 청에 원병을 요청하자는 의견까지 나온다.','실제 임오군란은 구식 군인의 불만과 부패, 개화 정책에 대한 반발 속에서 발생했다. 청의 군사 개입 이후 내정 간섭이 강화됐다.','army',[
C('책임 관리를 문책하고 군인 대표와 협상한다','민심으로 위기를 수습한다. 앞선 급료 지급이 도움이 된다.',[-10,10,-2,4,4,-6],'군영의 요구를 받고 책임자를 교체했다. 양보를 비판하는 대신들도 있지만 유혈 충돌을 줄였다.','settled'),
C('청에 군사적 지원을 요청한다','왕권을 회복하지만 외국의 간섭이 커진다.',[-4,-5,8,0,-18,12],'원병이 질서를 회복한다. 그 대가로 청의 관여가 깊어졌다.','qing'),
C('자체 병력으로 진압한다','충분한 군사력이 필요하며 민심을 잃는다.',[-6,-14,-4,0,5,9],'자체 병력으로 도성 통제를 회복했다. 진압의 상처가 주민들에게 남았다.',null,[2,45])]],
[1884,'제2장 · 개화의 그늘','급진 개혁의 밤','급진 개화 세력이 신분제와 재정 제도를 바꾸자고 요구한다. 외국군의 도움을 빌려서라도 낡은 권력을 걷어내겠다는 움직임이 보인다.','김옥균 등은 1884년 갑신정변을 일으켜 개혁을 추진했지만, 청군의 개입 등으로 3일 만에 실패했다.','coup',[
C('개혁 세력을 조정에 참여시키고 점진적으로 시행한다','왕권 일부를 양보하고 제도 개혁의 기반을 넓힌다.',[-7,7,0,12,3,-8],'신분·재정 개혁을 조정 의제로 받아들였다. 타협은 느리지만 무력 정변의 유인을 줄인다.','coalition'),
C('급진 개혁을 후원하고 외국군 지원도 받아들인다','개혁을 급히 밀어붙이나 주권과 정국 안정이 흔들린다.',[-10,-6,-4,22,-12,-7],'개혁 교지가 쏟아진다. 그러나 외국군과 반대 세력이 정국을 위협한다.','radical'),
C('주도 세력을 축출하고 왕권을 다진다','당장의 왕권을 강화하지만 개혁 동력을 잃는다.',[3,-6,4,-13,-3,14],'궁궐은 조용해졌다. 쫓겨난 인재들과 함께 개혁안도 사라졌다.','purge')]],
[1894,'제3장 · 흔들리는 나라','농민의 요구','지방의 수탈에 맞선 농민들이 봉기했다. 폐정 개혁을 요구하는 목소리가 들리고 청과 일본은 한반도의 정세를 주시한다.','동학 농민 운동은 1894년 전개되었다. 조선 정부의 청군 요청과 일본의 파병으로 외세의 군사 개입이 확대됐다.','empire',[
C('농민과 화약을 맺고 지방 개혁을 추진한다','민심을 얻으나 기득권과 왕실의 반발이 따른다.',[-12,18,0,10,6,-10],'폐정 개혁과 지방 감찰을 약속했다. 가상 역사에서 농민들과 개혁의 이행을 협의하기 시작한다.','farmers'),
C('청군을 요청해 봉기를 진압한다','국내 통제를 얻는 대신 청·일 개입의 문을 연다.',[-6,-16,5,0,-20,10],'청군의 진입이 일본의 개입 명분으로 이용된다. 조선의 뜻만으로 사태를 통제하기 어려워졌다.','intervention'),
C('자체 군대를 투입하고 제한적인 개혁을 약속한다','군사적 비용을 치르며 절충을 시도한다.',[-10,-5,-6,5,3,6],'무력과 회유를 함께 사용했다. 도성의 위기는 줄었지만 지방의 신뢰는 회복되지 않았다.')]],
[1894,'제3장 · 흔들리는 나라','바꿀 것과 지킬 것','동아시아의 전쟁과 내정 혼란 속에서 제도 개편안이 올라온다. 신분과 관리 등용, 재정 체계까지 손댈 것인가?','갑오개혁은 1894년 시작됐다. 신분제·과거제 폐지 등 근대적 제도 개혁이 추진되었지만 일본의 간섭이라는 한계가 있었다.','empire',[
C('신분제 폐지와 재정 일원화를 함께 추진한다','민심과 개혁을 얻으나 왕실의 권한을 줄여야 한다.',[6,8,0,15,0,-12],'출신보다 능력을 앞세우는 규정을 마련했다. 왕실도 새 회계 원칙을 받아들여야 한다.','equal'),
C('군사·행정만 바꾸고 사회 질서는 유지한다','왕권을 지키며 제한된 개혁을 추진한다.',[-5,-6,10,7,0,8],'관청의 이름과 군복은 바뀌었다. 그러나 신분의 벽은 백성들의 기대를 가로막는다.'),
C('외국 차관을 받아 개혁 사업을 확대한다','당장 국고와 개혁을 얻지만 자주성이 약해진다.',[18,2,5,12,-15,-3],'자금으로 사업을 벌였다. 차관의 조건이 이후 정책을 제약한다.','loan')]],
[1895,'제3장 · 흔들리는 나라','궁궐을 지킬 방책','외세의 영향력이 왕실의 안전까지 위협한다. 호위 체계의 허점과 외교적 고립을 해결해야 한다.','1895년 일본 공사 미우라 등의 주도로 명성황후가 시해된 을미사변이 일어났다. 이 장면은 사건 이전의 대응을 상상한 가상 선택이다.','start',[
C('궁궐 경비를 재편하고 외국의 무장 진입을 차단한다','군사력이 높을수록 효과적인 대비가 가능하다.',[-13,3,10,0,5,4],'호위 병력을 재배치했다. 축적한 군사 역량이 있다면 왕실 안전을 더 굳건히 지킬 수 있다.','guard'),
C('러시아 등 다른 열강에 보호를 타진한다','왕실의 안전을 도모하나 새로운 의존이 생긴다.',[-3,0,3,0,-10,10],'새 외교 경로를 찾았다. 열강의 보호는 조건 없는 약속이 아니다.','russia'),
C('각국 공사에게 공동 항의하고 국내 여론을 모은다','민심과 자주성을 강화하나 실력 보장이 부족하다.',[-5,9,-3,3,7,-5],'외교 문서와 성명이 퍼진다. 군사적 대비가 약하면 문서만으로 위협을 막기 어렵다.')]],
[1896,'제4장 · 새로운 이름','머물 곳, 나아갈 길','왕실의 거처와 앞으로의 통치 기반을 결정해야 한다. 독립과 개혁을 말하는 새로운 공론도 자라고 있다.','실제 역사에서 고종은 1896년 러시아 공사관으로 옮겼다(아관파천). 같은 해 독립신문과 독립협회가 등장했다.','people',[
C('러시아 공사관으로 거처를 옮긴다','신변 안전과 왕권을 얻지만 자주성이 낮아진다.',[3,-4,0,3,-12,12],'공사관 안에서 정국 수습을 시작했다. 외국의 보호 아래 있는 거처는 주권의 부담이 된다.','legation'),
C('국내 경비로 궁궐을 지키며 공개 정치를 확대한다','군사력이 필요하다. 민심과 개혁 기반을 강화한다.',[-9,10,-3,8,9,-6],'국내 병력을 믿고 궁궐에 남았다. 공개적인 논의를 통해 지지 기반을 넓힌다.','public',[2,45]),
C('여러 나라와 교섭하며 환궁·자강 계획을 세운다','외교적 균형을 찾지만 협상 비용이 든다.',[-10,2,3,5,5,0],'한 나라에 기대는 비중을 줄였다. 그러나 열강이 조선의 독립을 우선해 줄 것이라는 보장은 없다.')]],
[1897,'제4장 · 새로운 이름','대한이라는 이름','새 국호와 황제 즉위가 논의된다. 자주국임을 선포한 뒤, 그 선언을 무엇으로 뒷받침할 것인가?','고종은 1897년 황제로 즉위하고 대한제국을 선포했다. 이후 광무개혁을 통해 근대화와 황제권 강화를 추진했다.','empire',[
C('황제국을 선포하고 토지·산업 개혁을 추진한다','국가 재정과 개혁 기반을 다진다.',[-8,4,3,12,8,6],'대한제국을 선포했다. 토지 장부와 산업 기반을 정비하며 선언을 정책으로 옮긴다.','empire'),
C('황제권과 군대에 힘을 집중한다','군사·왕권을 강화하고 국고를 소모한다.',[-16,-4,16,3,7,14],'군대와 황실의 위엄이 커진다. 높은 비용을 감당할 안정적인 세입이 필요하다.','imperial'),
C('입헌 구상을 공론화하고 대표 기구를 준비한다','가상 경로. 왕권을 나누며 사회적 지지를 얻는다.',[-7,14,0,12,6,-16],'군주의 권한을 법과 대표 기구로 제한하는 구상을 내놓았다. 보수 세력은 강하게 반발한다.','constitution')]],
[1898,'제4장 · 새로운 이름','거리에서 묻는 정치','독립협회와 만민공동회를 중심으로 공론이 커진다. 황제의 뜻과 백성의 목소리는 함께 갈 수 있는가?','1898년 만민공동회와 관민공동회가 열렸고 헌의 6조가 제시되었다. 실제로는 독립협회가 해산되고 의회 설립 구상도 좌절됐다.','people',[
C('대표 기구와 공개적인 재정 심의를 받아들인다','민심·개혁을 얻는 대신 왕권을 양보한다.',[8,13,0,10,4,-16],'정부의 지출을 논의하는 공개 절차를 마련했다. 국정에 참여할 새로운 통로가 생긴다.','assembly'),
C('개혁 요구 일부를 수용하되 황제권을 유지한다','사회적 타협을 시도하지만 변화 폭은 작다.',[-4,4,3,6,2,3],'언로를 열고 일부 요구를 받아들였다. 권력의 근본 구조에 대한 논쟁은 계속된다.'),
C('집회를 해산하고 황제 중심의 질서를 확립한다','왕권을 회복하지만 민심과 개혁이 약해진다.',[-3,-16,6,-7,0,18],'거리의 집회가 사라졌다. 정국은 잠잠해졌지만 자발적인 협력의 기반도 좁아졌다.','closed')]],
[1904,'제5장 · 제국의 파도','두 제국 사이','러시아와 일본이 전쟁으로 향한다. 중립을 선언하는 것만으로 전장을 피할 수 있을까? 지금까지 쌓은 국력이 시험대에 오른다.','대한제국은 러일전쟁을 앞두고 중립을 선언했지만 일본은 이를 무시하고 군사·정치적 영향력을 확대했다.','hague',[
C('중립을 선언하고 자체 방비와 외교를 병행한다','군사·개혁 역량이 충분하면 주권 손실을 완화한다.',[-14,4,-5,0,-8,0],'중립을 공표하고 요충지를 지킨다. 선언의 실효성은 그동안 준비한 역량에 달려 있다.','neutral'),
C('일본의 요구에 협조해 당장의 충돌을 피한다','국고와 군사 손실을 줄이지만 자주성이 크게 낮아진다.',[8,-8,3,0,-22,4],'당장의 전투는 피했다. 그러나 내정에 대한 요구가 더욱 깊숙이 들어온다.','japan'),
C('러시아에 기대 일본을 견제한다','외교적 도박. 러시아의 패배가 큰 부담으로 돌아온다.',[-8,-4,-8,0,-17,3],'러시아의 지원을 기대했지만 전쟁의 흐름이 불리해진다. 한 강국에 건 기대가 취약점을 드러낸다.')]],
[1905,'제5장 · 제국의 파도','외교권을 내놓으라는 요구','일본은 외교권을 빼앗는 협약을 강요한다. 조정은 압박 속에 갈라지고 있다. 준비해 온 국가 역량과 사회적 지지가 지금의 선택을 받쳐 줄 수 있을까?','1905년 일본은 을사늑약을 강요하여 대한제국의 외교권을 빼앗았다. 고종은 이를 승인하지 않았고 부당함을 알리고자 했다.','hague',[
C('강요를 거부하고 국내 역량을 결집한다','군사·민심이 충분하면 가상 경로에서 더 강하게 버틸 수 있다.',[-12,9,-7,0,-7,-5],'협약 강요를 거부했다. 지탱할 힘이 부족하면 거부 의사만으로 침탈을 막기 어렵다.','resist'),
C('해외에 부당함을 알리고 외교적 지원을 구한다','외교 활동에는 비용이 들고 열강의 호응은 불확실하다.',[-8,3,0,5,-12,-3],'각국에 문서를 보냈다. 국제 여론과 열강의 실제 행동 사이에는 간극이 있다.','appeal'),
C('양보하며 교육·산업 기반을 보존한다','주권 손실을 감수하고 장기적인 회복 기반에 투자한다.',[5,-10,-3,12,-20,-5],'학교와 산업의 기반을 남기려 했다. 그러나 외교권의 상실은 독자적인 정책을 어렵게 만든다.','education')]],
[1907,'제5장 · 제국의 파도','역사에 남길 마지막 교지','국제회의가 헤이그에서 열린다. 국권의 위기 앞에서 마지막 힘을 어디에 쏟을 것인가? 당신이 걸어온 길은 다음 세대에 어떤 국가를 남길 것인가?','고종은 1907년 헤이그에 특사를 파견했다. 특사는 회의에 공식 참석하지 못했지만 침탈의 부당함을 알렸다. 일본은 이를 구실로 고종의 퇴위를 강요했다.','hague',[
C('헤이그에 특사를 파견해 침탈의 부당함을 알린다','자주 의지와 공론을 남기지만 왕권에 큰 위험이 따른다.',[-8,7,0,4,5,-14],'특사가 국제 여론에 호소한다. 공식 회의 참석은 막혔지만 침탈에 대한 문제 제기는 기록으로 남았다.','hague'),
C('교육과 언론, 국내 연대에 자원을 남긴다','민심과 개혁 기반을 다음 세대에 잇는다.',[-10,12,0,12,2,-6],'교실과 인쇄소, 지역의 모임으로 자원을 돌렸다. 국가의 미래를 더 많은 사람의 손에 맡긴다.','legacy'),
C('남은 군사력을 결집해 저항을 준비한다','충분한 군사력이 필요하다. 큰 소모를 각오해야 한다.',[-12,8,-12,0,9,-8],'남은 병력을 모았다. 군사적 저항은 희생을 요구하며, 준비된 사회적 기반이 지속력을 좌우한다.','armed',[2,50])]]
];
const key='joseon-crossroads-v1';let state;const fresh=()=>({version:1,i:0,stats:[62,52,35,18,65,62],flags:[],log:[],pending:null});
function valid(s){return s&&s.version===1&&Number.isInteger(s.i)&&s.i>=0&&s.i<=events.length&&Array.isArray(s.stats)&&s.stats.length===6&&s.stats.every(x=>Number.isFinite(x)&&x>=0&&x<=100)&&Array.isArray(s.flags)&&s.flags.every(x=>typeof x==='string')&&Array.isArray(s.log)&&s.log.length===s.i+(s.pending?1:0)&&s.log.every(x=>x&&Number.isInteger(x.year)&&typeof x.title==='string'&&typeof x.choice==='string'&&typeof x.result==='string'&&Array.isArray(x.delta)&&x.delta.length===6&&x.delta.every(Number.isFinite))&&(!s.pending||s.i<events.length&&s.pending===true)}
try{const saved=JSON.parse(localStorage.getItem(key));state=valid(saved)?saved:fresh()}catch{state=fresh()}
function save(){try{localStorage.setItem(key,JSON.stringify(state));document.getElementById('save-note').textContent=' · 이 기기에 자동 저장됨'}catch{document.getElementById('save-note').textContent=' · 저장 불가: 이 창을 닫으면 진행이 사라질 수 있습니다.'}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const has=x=>state.flags.includes(x);const terminal=()=>state.stats[0]===0||state.stats[1]===0||state.stats[4]===0;
function context(){if(state.i===2)return has('learning')?'미리 모은 해외 정보가 조약 협상에 쓰일 수 있다.':'조약 지식이 부족하다. 조항 재협상에는 개혁 30 이상이 필요하다.';if(state.i===5)return has('paid')?'앞서 지급한 급료 덕에 군영 대표와 대화할 여지가 커졌다.':'미뤄진 군영 문제가 폭발했다. 위기 대응에 추가 비용과 민심 손실이 예상된다.';if(state.i===6)return has('qing')?'청군을 요청한 전력이 개혁의 자율성을 제약하고 있다.':'외국군에 덜 의존한 만큼 독자적 타협의 여지가 남아 있다.';if(state.i===10)return has('guard')&&state.stats[2]>=50?'이전에 정비한 호위 체계가 국내 거처 유지의 기반이 된다.':'왕실의 안전을 국내 병력만으로 보장하기에는 부담이 크다.';if(state.i>=13)return state.stats[2]>=55&&state.stats[3]>=60?'축적된 군사·개혁 역량이 외압을 견딜 기반이 된다.':'열강의 압력은 거세다. 명분만으로 국권을 지키기 어렵다.';return '하나의 정책에는 이득과 대가가 함께 따른다. 국고·민심·자주 중 하나라도 0이 되면 통치가 끝난다.'}
function choose(n){if(state.pending||terminal()||state.i>=events.length)return;const e=events[state.i],c=e[6][n];if(!c||c.req&&state.stats[c.req[0]]<c.req[1])return;let d=[...c.delta],extra='';if(state.i===5){if(has('paid')){d[1]+=6;extra=' 앞선 급료 지급으로 협상과 수습이 한결 수월해졌다.'}else{d[0]-=6;d[1]-=7;extra=' 누적된 군영의 불만 때문에 추가 비용과 민심 손실이 발생했다.'}}if(state.i===6&&has('qing')){d[4]-=5;extra+=' 청의 간섭이 개혁의 자율성을 제약했다.'}if(state.i===10&&has('guard')&&n===1){d[5]+=6;extra+=' 미리 정비한 경비 체계가 왕실을 지탱했다.'}if(state.i===13&&n===0&&state.stats[2]>=55&&state.stats[3]>=60){d[4]+=14;extra+=' 가상 역사에서 축적된 자강 역량으로 중립을 지킬 협상력을 확보했다.'}if(state.i===14&&n===0&&state.stats[2]>=55&&state.stats[1]>=60){d[4]+=18;extra+=' 가상 역사에서 군사적 대비와 국내 연대가 강요에 맞설 힘이 되었다.'}const old=[...state.stats];state.stats=state.stats.map((v,i)=>Math.max(0,Math.min(100,v+d[i])));if(c.flag)state.flags.push(c.flag);state.log.push({year:e[0],title:e[2],choice:c.title,result:c.result+extra,delta:state.stats.map((v,i)=>v-old[i])});state.pending=true;save();render(true)}
function ending(){let [money,people,army,reform,sovereignty,crown]=state.stats;if(money===0)return ['곳간이 멈춘 나라','국고가 바닥나 정책을 집행할 수 없게 되었다. 개혁과 군사 투자도 지속 가능한 세입을 필요로 했다.'];if(people===0)return ['백성이 등을 돌리다','통치를 지탱할 사회적 신뢰를 잃었다. 강한 명령만으로는 협력의 기반을 대신할 수 없었다.'];if(sovereignty===0)return ['빼앗긴 결정권','외세의 간섭 속에서 독자적인 정책 결정권을 잃었다. 남겨진 사람들과 제도는 다음 시대의 과제가 되었다.'];if(sovereignty>=55&&reform>=65&&people>=55)return [has('assembly')?'함께 세운 자주국':'자강의 길을 연 대한','가상 역사에서 개혁 역량과 사회적 기반을 모아 국권을 방어할 가능성을 열었다. 이는 실제 역사의 필연적인 대안이나 독립 보장의 예측이 아니다.'];if(sovereignty>=40&&army>=55)return ['위태로운 무장 중립','가상 역사에서 국가의 결정권을 상당 부분 지켜냈지만, 군비와 열강의 압력은 여전히 무거운 과제로 남았다.'];if(reform>=65&&people>=50)return ['다음 시대에 남긴 불씨','충분한 국권을 지키기는 어려웠지만, 교육과 제도, 사회적 연대가 다음 세대의 회복 기반으로 남았다.'];if(crown>=65)return ['왕좌와 나라 사이','왕실의 권한을 지키는 데 힘을 쏟았다. 그러나 왕권의 크기가 국권과 백성의 삶을 곧바로 보장하지는 못했다.'];return ['끝나지 않은 개화','서로 충돌하는 과제 사이에서 생존의 길을 찾았다. 남겨진 과제는 자주성과 사회적 신뢰를 함께 키우는 일이었다.']}
function render(focus=false){const over=!state.pending&&(state.i>=events.length||terminal()),e=events[Math.min(state.i,events.length-1)],last=state.log.at(-1);let content='';if(over){const end=ending();content=`<div class="chapter">통치의 기록 · ${state.log.length}번의 선택<span></span>가상 결말</div><h1 tabindex="-1">${end[0]}</h1><p class="story">${end[1]}</p><p class="context">실제 역사에서는 1907년 고종이 강제로 퇴위했고, 1910년 일본이 한국을 강제 병합했다. 이 게임의 수치와 결말은 학습을 돕기 위한 단순화된 창작이다.</p><button class="primary" id="again">다른 선택으로 다시 시작</button>`}else{content=`<div class="chapter">${e[1]}<span></span>${String(state.i+1).padStart(2,'0')} / ${events.length}</div><h1 tabindex="-1">${e[2]}</h1><p class="story">${e[3]}</p>`;if(state.pending){content+=`<section class="result" aria-label="선택 결과"><p class="eyebrow">교지의 결과 · 가상 역사</p><h2>${esc(last.choice)}</h2><p>${esc(last.result)}</p><div class="deltas">${last.delta.map((v,i)=>v?`<span class="delta ${v>0?'positive':'negative'}">${labels[i]} ${v>0?'+':''}${v}</span>`:'').join('')}</div><button class="primary" id="next">${terminal()||state.i===events.length-1?'통치 결과 보기':'다음 사건으로 →'}</button></section>`}else{content+=`<p class="context">${context()}</p><div class="choices">${e[6].map((c,i)=>{const locked=c.req&&state.stats[c.req[0]]<c.req[1];return `<button class="choice" data-choice="${i}" ${locked?'disabled':''}><span class="letter">${'ABC'[i]}</span><span><strong>${c.title}</strong><small>${c.desc}${c.req?` · ${labels[c.req[0]]} ${c.req[1]} 이상${locked?' 필요':' 충족'}`:''}</small></span></button>`}).join('')}</div><p class="hint">선택하면 즉시 적용됩니다. 자동 저장은 현재 기기·브라우저에서만 유지됩니다.</p>`}content+=`<details><summary>실제 역사와 비교하기</summary><p>${e[4]}</p><p><a href="${sources[e[5]][1]}" target="_blank" rel="noopener noreferrer">국사편찬위원회 우리역사넷 — ${sources[e[5]][0]} ↗</a></p></details>`}
content+=`<details ${over?'open':''}><summary>나의 실록 · ${state.log.length}개의 결정</summary>${state.log.length?state.log.map(l=>`<div class="history-entry"><strong>${l.year} · ${esc(l.title)}</strong><p>${esc(l.choice)}</p><p>${esc(l.result)}</p></div>`).join(''):'<p>첫 교지를 내리면 기록이 시작됩니다.</p>'}</details>`;
document.getElementById('app').innerHTML=`<div class="layout"><aside><p class="eyebrow">${over?'통치 종료':'국정 현황'}</p><span class="year">${over?(last?.year||1873):e[0]}</span><p class="era">${(over?(last?.year||1873):e[0])>=1897?'대한제국 · 광무의 시대':'조선 · 고종의 시대'}</p><div class="stats">${labels.map((l,i)=>`<div><div class="stathead"><span>${l}</span><strong>${state.stats[i]}</strong></div><div class="track" role="meter" aria-label="${l}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.stats[i]}"><div class="fill ${state.stats[i]<25?'low':''}" style="width:${state.stats[i]}%"></div></div></div>`).join('')}</div><p class="side-note">당신은 고종의 입장에서 선택합니다.<br>왕권과 나라의 자주성은 서로 다른 지표입니다.</p><div class="progress" aria-label="진행률"><div style="width:${state.log.length/events.length*100}%"></div></div></aside><article>${content}</article></div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));const next=document.getElementById('next');if(next)next.onclick=()=>{state.i++;state.pending=null;save();render(true)};const again=document.getElementById('again');if(again)again.onclick=()=>document.getElementById('confirm').showModal();if(focus){document.querySelector('h1').focus();window.scrollTo({top:0,behavior:'instant'})}}
document.getElementById('restart').onclick=()=>document.getElementById('confirm').showModal();document.getElementById('cancel-reset').onclick=()=>document.getElementById('confirm').close();document.getElementById('confirm-reset').onclick=()=>{state=fresh();document.getElementById('confirm').close();save();render(true)};render();save();
</script></body></html>
